<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>小马工作台</title>
<meta name="theme-color" content="#FF8A00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小马工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFCF4; --card:#FFFFFF;
  --line:#FFE6BF; --line2:#FFD49A;
  --t1:#2E2314; --t2:#7C6144; --t3:#B3987A;
  --ac:#FF8A00; --ac2:#FFB020;
  --ac-g:linear-gradient(135deg,#FFC02E 0%,#FF8A00 100%);
  --ac-s:#FFF3E0; --ac-l:#FFD9A0;
  --red:#FF5A5F; --red-s:#FFECEC; --red-l:#FFC7C9;
  --green:#12B981; --green-s:#E4F9F1;
  --amber:#F5A300; --amber-s:#FFF7E4;
  --pink:#FF6B9D; --pink-s:#FFEBF2;
  --sky:#2CB4E8; --sky-s:#E4F5FD;
  --violet:#9B7BFA; --violet-s:#F0EBFF;
  --r:14px; --sh:0 2px 10px rgba(255,138,0,.07);
  --bodybg:radial-gradient(1100px 560px at 8% -10%, #FFEFCC 0%, rgba(255,239,204,0) 62%),radial-gradient(880px 480px at 102% -4%, #FFE4DE 0%, rgba(255,228,222,0) 58%),radial-gradient(760px 420px at 50% 108%, #E6FBF3 0%, rgba(230,251,243,0) 60%);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--t1);
  background-image:var(--bodybg);
  background-attachment:fixed; background-size:cover; background-position:center;
  font-size:14.5px; line-height:1.6; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;color:var(--t1)}
button{cursor:pointer;background:none;border:none}
.hide{display:none !important}
::selection{background:var(--ac-l)}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:236px;flex:0 0 236px;padding:20px 14px;
  background:rgba(255,255,255,.94);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo-badge{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--ac-g);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 11px rgba(255,138,0,.34);
}
.logo h1{font-size:14.5px;font-weight:650;letter-spacing:-.02em;line-height:1.3}
.logo p{font-size:11.5px;color:var(--t3);font-weight:450}
/* 月度柱图 hover 浮层：纯 CSS 立即响应（SVG 原生 <title> 需悬停 1~2s 且部分浏览器/手机 WebView 不显示） */
.iobar{position:absolute;top:0;bottom:22px;cursor:pointer}
.iotip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:#3D2C12;color:#fff;font-size:11.5px;line-height:1.65;padding:7px 10px;border-radius:8px;z-index:30;
  box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}
.iobar:hover .iotip{display:block!important}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  font-weight:500;font-size:14px;color:var(--t2);text-align:left;width:100%;min-height:38px;transition:.12s;
}
.nav button:hover{background:#FFF6E8;color:var(--t1)}
.nav button.on{background:var(--ac-g);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(255,138,0,.3)}
.side-foot{margin-top:auto;padding-top:18px}
.side-foot .tip{font-size:11.5px;color:var(--t3);line-height:1.6;margin-top:10px;font-weight:450}

.main{flex:1;min-width:0;padding:26px 28px 48px}
.topbar{display:none}
.page{max-width:1000px;margin:0 auto}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:21px;font-weight:650;letter-spacing:-.025em;display:flex;align-items:center;gap:9px}
.page-head .sub{font-size:12.5px;color:var(--t3);font-weight:450}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;margin-bottom:16px;position:relative;
  box-shadow:var(--sh);
}
.card.tint-r{background:var(--red-s);border-color:var(--red-l)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;color:var(--t1)}

.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:6px;background:#FFEFD8;color:#B57200;white-space:nowrap;line-height:1.55;
}
.pill.red{background:var(--red-s);color:#E23B41}
.pill.green{background:var(--green-s);color:#0A9E6C}
.pill.blue{background:var(--sky-s);color:#1D93C4}
.pill.yellow,.pill.orange{background:#FFEFC2;color:#C07800}
.pill.gray{background:#FFEFD8;color:var(--t2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line2);
  background:#fff;font-weight:550;font-size:13.5px;color:var(--t1);transition:.12s;white-space:nowrap;
}
.btn:hover{background:#FFF8EC;border-color:var(--ac-l)}
.btn:active{transform:scale(.985)}
.btn.p{background:var(--ac-g);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(255,138,0,.3)}
.btn.p:hover{filter:brightness(1.06);box-shadow:0 4px 13px rgba(255,138,0,.38)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.g:hover{background:#0EA372;border-color:#0EA372}
.btn.b{background:#fff;color:#1D93C4;border-color:#A8DEF5}
.btn.b:hover{background:var(--sky-s)}
.btn.y{background:#fff;color:#C07800;border-color:#FFD98A}
.btn.y:hover{background:var(--amber-s)}
.btn.r{background:#fff;color:#E23B41;border-color:var(--red-l)}
.btn.r:hover{background:var(--red-s)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.xs{height:27px;padding:0 9px;font-size:12px;border-radius:6px;font-weight:500}
.btn.ghost{border-color:transparent;background:transparent}
/* 选中态：快捷区间/方向筛选等按钮被选中时颜色加深 + 白字 + 加重阴影 */
.btn.on,.btn.sm.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 8px rgba(255,138,0,.32);font-weight:700}
.btn.on:hover,.btn.sm.on:hover{background:#FF7A00;border-color:#FF7A00;color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;
  background:#fff;font-weight:450;font-size:14px;outline:none;transition:.12s;color:var(--t1);
}
textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.65}
input::placeholder,textarea::placeholder{color:#B4BAC4}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #FFE7C4}
label.fl{display:block;font-size:12.5px;font-weight:550;margin:0 0 6px 1px;color:var(--t2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row{margin-bottom:13px}

/* 列表项 */
.item{
  display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);
  border-radius:10px;background:#fff;margin-bottom:8px;transition:.12s;
}
.item:hover{border-color:var(--ac-l);box-shadow:0 3px 12px rgba(255,138,0,.10)}
.item.late{background:var(--red-s);border-color:var(--red-l)}
.item.done{opacity:.45}
.item.done .it-title{text-decoration:line-through;color:var(--t3)}
.it-body{flex:1;min-width:0}
.it-title{font-weight:500;font-size:14.5px;word-break:break-word;line-height:1.55}
.it-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.it-act{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;opacity:.55;transition:.12s}
.item:hover .it-act{opacity:1}
.chk{
  width:19px;height:19px;flex:0 0 19px;border:1.5px solid #E3C295;border-radius:6px;background:#fff;
  display:flex;align-items:center;justify-content:center;margin-top:3px;transition:.12s;
}
.chk:hover{border-color:var(--ac)}
.chk.on{background:var(--ac-g);border-color:transparent;box-shadow:0 2px 7px rgba(255,138,0,.34)}
.chk svg{opacity:0}
.chk.on svg{opacity:1}

.empty{text-align:center;padding:34px 12px}
.empty p{font-weight:550;margin-top:12px;font-size:13.5px;color:var(--t2)}
.empty span{font-size:12.5px;color:var(--t3)}

.hl{color:var(--red);font-weight:600}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{text-align:center;font-size:11.5px;font-weight:500;color:var(--t3);padding:0 0 6px}
.cal .d{
  aspect-ratio:1/1;border:none;border-radius:8px;background:transparent;
  display:flex;align-items:center;justify-content:center;font-weight:450;font-size:13.5px;
  min-height:38px;position:relative;color:var(--t1);transition:.1s;
}
.cal .d:hover{background:#FFF1DC}
.cal .d.out{opacity:0;pointer-events:none}
.cal .d.today{color:#D97706;font-weight:700;background:#FFEFD8}
.cal .d.sel{background:var(--ac-g);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(255,138,0,.32)}
.cal .d.sel:hover{background:var(--ac-g)}
.dots{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.dot{width:4px;height:4px;border-radius:50%;background:var(--t3)}
.dot.r{background:var(--red)}
.cal .d.sel .dot{background:rgba(255,255,255,.85)}

.badge{
  min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;
  font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat.stat5{grid-template-columns:repeat(5,1fr)}
.stat .s em{display:block;margin-top:2px;font-style:normal;font-size:11.5px;font-weight:550;color:var(--t3)}
.stat .s{
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff;
  box-shadow:var(--sh);
}
.stat .s b{display:block;font-size:27px;font-weight:600;line-height:1.15;letter-spacing:-.035em;color:var(--t1)}
.stat .s span{font-size:12.5px;font-weight:450;color:var(--t3);display:block;margin-top:3px}
.stat .s.r b{color:var(--red)}
.stat .s.g b{color:var(--green)}
.stat .s.b b{color:var(--sky)}
.stat .s.y b{color:var(--ac)}
.stat .s.p b{color:var(--violet)}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(78,48,12,.36);backdrop-filter:blur(2px);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;animation:fi .14s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:14px;padding:22px;width:100%;max-width:450px;
  box-shadow:0 18px 48px rgba(120,75,20,.20),0 0 0 1px rgba(255,180,90,.4);
  max-height:88vh;overflow-y:auto;animation:su .16s cubic-bezier(.2,.8,.3,1);
}
@keyframes su{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal h3{font-size:16px;font-weight:650;letter-spacing:-.02em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal .mfoot{display:flex;gap:9px;margin-top:20px}
.modal .mfoot .btn{flex:1;height:38px}

.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:120;
  background:var(--ac-g);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:10px;
  box-shadow:0 8px 24px rgba(255,138,0,.38);max-width:88vw;text-align:center;animation:su .16s ease;
}
.banner{
  border:1px solid var(--ac-l);border-radius:11px;background:var(--ac-s);padding:11px 14px;
  font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:18px;color:#B57200;
}
.banner .btn{margin-left:auto}
.tabs{display:inline-flex;gap:2px;background:#FFEFD8;padding:3px;border-radius:10px;margin-bottom:0}
.tabs button{
  padding:0 13px;height:28px;border-radius:6px;background:transparent;font-weight:500;font-size:12.5px;color:var(--t2);transition:.12s;
}
.tabs button:hover{color:var(--t1)}
.tabs button.on{background:#fff;color:#D97706;font-weight:650;box-shadow:0 1px 3px rgba(255,138,0,.16)}
.kw{
  display:inline-flex;align-items:center;gap:5px;padding:3px 6px 3px 9px;border-radius:7px;
  background:#FFEFD8;font-size:12.5px;font-weight:450;color:#B57200;margin:0 6px 6px 0;
}
.kw button{color:var(--t3);font-size:14px;line-height:1;padding:0 2px;transition:.1s}
.kw button:hover{color:var(--red)}
.divider{height:1px;background:var(--line);margin:16px 0;border:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.srcline{font-size:12.5px;color:var(--t3);font-weight:450;display:inline-flex;align-items:center;gap:5px}
a{color:var(--ac);font-weight:500;text-decoration:none}
a:hover{text-decoration:underline}
.rowline{padding:11px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none;padding-bottom:0}
.codebox{background:#FFF9EE;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--t2)}

/* ---------- V9.1 物管数据看板 ---------- */
.v9tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.v9tbl th{text-align:left;color:var(--t3);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.v9tbl td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--t2);vertical-align:top}
.v9tbl tr:last-child td{border-bottom:none}
.v9tbl tbody tr:hover{background:var(--ac-s)}
.v9tbl td.r{color:var(--red);font-weight:650}
.v9tbl td.g{color:var(--green);font-weight:650}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:2px -2px}
.v9tbl.v9io .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.v9tbl.v9io .model{max-width:220px;color:var(--t1)}
.v9tbl.v9io th.num{text-align:right}
.muted{color:#c2b6a4}
.barrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.barrow .bl{width:96px;flex-shrink:0;font-size:12.5px;font-weight:550;color:var(--t2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bartrack{flex:1;height:18px;background:#FFF3E0;border-radius:9px;overflow:hidden}
.barfill{height:100%;border-radius:9px;background:linear-gradient(90deg,#FFC02E,#FF8A00);transition:width .4s}
.barrow .bv{width:104px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:650;color:var(--t1)}
.bar{height:14px;background:#FFF3E0;border-radius:9px;overflow:hidden;margin-top:4px}
.bar .barfill{height:100%;border-radius:9px}

/* ---------- 移动端 ---------- */
@media (max-width:860px){
  .side{display:none}
  .main{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
  .topbar{
    display:flex;align-items:center;gap:10px;padding:11px 16px;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
  }
  .topbar .logo-badge{width:30px;height:30px;flex:0 0 30px;border-radius:8px}
  .topbar h1{font-size:14.5px;font-weight:650;letter-spacing:-.02em}
  .topbar p{font-size:11px;color:var(--t3);font-weight:450}
  .page{padding:18px 16px 12px}
  .page-head{margin-bottom:16px}
  .page-head h2{font-size:19px}
  .stat{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat .s{padding:13px 14px}
  .stat .s b{font-size:24px}
  .grid2,.grid3{grid-template-columns:1fr}
  .card{padding:16px;margin-bottom:13px}
  .btn{height:38px;font-size:14px}
  .btn.sm{height:34px}
  .btn.xs{height:30px;font-size:12.5px}
  input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px;height:44px}
  textarea{height:auto}
  .modal .mfoot .btn{height:44px}
  .it-act{opacity:1}
  .btm{
    position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
    background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);padding:5px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .btm button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;
    font-size:10.5px;font-weight:500;color:var(--t3);min-height:48px;border-radius:8px;position:relative;
  }
  .btm button.on{color:var(--ac)}
  .btm .badge{position:absolute;top:2px;right:calc(50% - 20px);transform:scale(.8)}
  .toast{bottom:104px}
  .cal .d{min-height:40px;font-size:14px;border-radius:9px}
  .tabs{display:flex;width:100%}
  .tabs button{flex:1;height:32px}
}
@media (min-width:861px){ .btm{display:none} }
.ext-card{position:relative;background:#fff}
.ext-frame{width:100%;height:78vh;border:0;display:block;background:#fff}
.ext-fb{display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:48px 24px;min-height:78vh;background:var(--card)}
.ext-fb-ic{font-size:44px;line-height:1}
.ext-fb-t{font-size:19px;font-weight:700;color:var(--t1)}
.ext-fb-d{font-size:13px;color:var(--t2);max-width:480px;line-height:1.8}
.btn.big{padding:12px 22px;font-size:15px;margin-top:4px}
/* 详情查询：合同分组折叠 */
.qd-group{border:1px solid #FFE6BF;border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:10px}
.qd-g-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FFF7E6;cursor:pointer;user-select:none;font-size:13.5px;flex-wrap:wrap}
.qd-g-h:hover{background:#FFEFCC}
.qd-g-h.open{background:#FFE6BF;border-bottom:1px solid #FFE6BF}
.qd-g-arr{font-size:14px;color:var(--ac);width:14px;flex-shrink:0}
.qd-g-pid{font-weight:700;color:var(--ac);font-family:Menlo,Consolas,monospace;font-size:14px}
.qd-g-sub{color:var(--t2);font-size:12.5px}
.qd-g-status{margin-left:auto;font-weight:700}
.qd-g-b{padding:14px 16px}
.qd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin-bottom:12px}
.qd-kv{display:flex;gap:10px;font-size:13px;line-height:1.85;align-items:flex-start}
.qd-kv-wide{grid-column:1/-1}
.qd-k{color:var(--t3);flex-shrink:0;min-width:80px}
.qd-v{color:var(--t1);word-break:break-all}

<!-- OCR 引擎：Tesseract.js v5 + PDF.js v4 按需加载，避免拖慢首屏 -->
<script>
  /* 当用户点开「识别录入」时再异步加载识别引擎（~2MB 中文包 + 4.6MB wasm），不影响首屏。
     注意：动态创建的 <script type="module"> 设 textContent 浏览器**不会执行**，
     必须用 Blob URL 才能可靠加载 ESM（PDF.js v4 是 ESM）。 */
  window.__ocrErr=[];
  window.__loadOcrEngine=function(cb){
    var tasks=[], errs=[];
    function done(){
      window.__ocrErr=errs;
      cb(!!(window.Tesseract && window.__pdfjsLib), errs);
    }
    // 绝对 URL（相对当前页面目录），避免子路径部署时解析错
    var BASE='';
    try{ BASE=new URL('./', location.href).href; }catch(_){}
    if(!window.__pdfjsLib){
      tasks.push(function(n){
        try{
          var code="import * as __p from '"+BASE+"vendor/pdf.min.mjs';"+
            "__p.GlobalWorkerOptions.workerSrc='"+BASE+"vendor/pdf.worker.min.mjs';"+
            "window.__pdfjsLib=__p;";
          var b=new Blob([code],{type:'text/javascript'});
          var url=URL.createObjectURL(b);
          var s=document.createElement('script');
          s.type='module';
          s.src=url;
          s.onload=function(){ try{URL.revokeObjectURL(url);}catch(_){} n(); };
          s.onerror=function(e){ errs.push('pdf.js 加载失败（'+BASE+'vendor/pdf.min.mjs）'); n(); };
          document.head.appendChild(s);
        }catch(e){ errs.push('pdf.js 注入异常：'+e.message); n(); }
      });
    }
    if(!window.Tesseract){
      tasks.push(function(n){
        var s=document.createElement('script');
        s.src=BASE+'vendor/tesseract.min.js';
        s.onload=function(){ n(); };
        s.onerror=function(){ errs.push('tesseract.min.js 加载失败（'+BASE+'vendor/tesseract.min.js）'); n(); };
        document.head.appendChild(s);
      });
    }
    if(!tasks.length){ return done(); }
    var pending=tasks.length;
    tasks.forEach(function(t){ t(function(){ if(--pending===0) done(); }); });
  };
  /* 诊断：逐个 HEAD 检查 OCR 依赖资源，返回状态数组（用于错误面板定位） */
  window.__ocrDiag=function(cb){
    var BASE='';
    try{ BASE=new URL('./', location.href).href; }catch(_){}
    var list=[['引擎 tesseract.min.js','vendor/tesseract.min.js'],['worker.min.js','vendor/worker.min.js'],
      ['WASM 核（SIMD+LSTM）','vendor/tesseract-core-simd-lstm.wasm.js'],
      ['WASM 核（兜底 LSTM）','vendor/tesseract-core-lstm.wasm.js'],
      ['中文语言包 chi_sim','vendor/tessdata/chi_sim.traineddata.gz'],
      ['pdf.min.mjs','vendor/pdf.min.mjs'],['pdf.worker.min.mjs','vendor/pdf.worker.min.mjs']];
    var out=[], n=list.length;
    list.forEach(function(it){
      fetch(BASE+it[1],{method:'GET',headers:{Range:'bytes=0-64'}}).then(function(r){
        out.push({name:it[0],path:it[1],ok:r.ok||r.status===206,status:r.status});
      }).catch(function(e){
        out.push({name:it[0],path:it[1],ok:false,status:'网络错误'});
      }).then(function(){ if(--n===0) cb(out); });
    });
  };
</script>

function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function shift(base,n){var d=new Date(base+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)}
function nextWeekday(from,cnw){var map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};var t=map[cnw];if(t===undefined)return from;var d=new Date(from+'T00:00:00');var cur=d.getDay();var diff=(t-cur+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return dstr(d)}
// 解析一段待办文本（钉钉/微信卡片）为一条待办
function parseTodoBlock(raw,from){
  var lines=raw.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean);
  if(!lines.length)return null;
  var text=lines.join('\n');
  var t2=text.replace(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/g,''); // 剔除四位年日期，避免误匹配
  var date=today(),time='',owner='',pri='P1',done=false,title='';
  // 完成状态
  if(/(已完成|已办|已处理|已结|✅|【完成】|完成[:：])/.test(text))done=true;
  // 优先级
  if(/(P0|紧急|加急|特急|重要且紧急|高优先级|务必|立即|马上|尽快|特重)/.test(text))pri='P0';
  else if(/优先级[：:]\s*高/.test(text))pri='P0';
  else if(/(P2|低|不急|普通|较低)/.test(text))pri='P2';
  // 日期：优先 YYYY-MM-DD / YYYY/MM/DD
  var ymd=text.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if(ymd){date=ymd[1]+'-'+pad(+ymd[2])+'-'+pad(+ymd[3]);}
  else{
    var md=t2.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
    if(md){var yy=new Date().getFullYear();date=yy+'-'+pad(+md[1])+'-'+pad(+md[2]);}
    else{
      var dm=t2.match(/(\d{1,2})[-/.](\d{1,2})(?!\d)/);
      if(dm){var yy2=new Date().getFullYear();date=yy2+'-'+pad(+dm[1])+'-'+pad(+dm[2]);}
      else if(/明天|明日/.test(text))date=shift(today(),1);
      else if(/后天/.test(text))date=shift(today(),2);
      else if(/大后天/.test(text))date=shift(today(),3);
      else if(/下周/.test(text))date=shift(today(),7);
      else if(/今天|今日|当日/.test(text))date=today();
      else{var wk=text.match(/周([一二三四五六日天])/);if(wk)date=nextWeekday(today(),wk[1]);
        else{var rel=text.match(/(\d+)\s*天[后以]?/);if(rel)date=shift(today(),+rel[1]);}}
    }
  }
  // 时间
  var tm=text.match(/(\d{1,2}):(\d{2})/);if(tm)time=pad(+tm[1])+':'+tm[2];
  // 负责人
  var ow=text.match(/(?:负责人|执行人|处理人|经办|@)\s*[：:]?\s*(\S{1,12}?)(?:\s|$|，|。|,)/);
  if(ow)owner=ow[1].replace(/[:：]$/,'');
  else{var ow2=text.match(/(?:负责人|执行人|处理人)[：:]\s*(\S+)/);if(ow2)owner=ow2[1];}
  // 标题：优先取 标题/主题/事项/内容/待办/任务 后的内容
  var tM=text.match(/(?:标题|主题|事项|内容|待办|任务|subject|title)[：:]\s*(.+)/i);
  if(tM){title=tM[1].replace(/\n/g,' ').trim();}
  else{
    var cand=lines.map(function(l){return l.replace(/^(【待办】|【任务】|【DING】|待办[:：]|任务[:：]|•|·|\*|-|\d+[.、])\s*/,'');});
    title='';
    for(var i=0;i<cand.length;i++){
      var c=cand[i];
      if(/^(截止|负责|执行|处理|经办|优先级|紧急|备注|内容|时间|日期|due|owner)/i.test(c))continue;
      if(c.length>title.length)title=c;
    }
    if(!title)title=cand[0]||text;
  }
  title=title.replace(/\s+/g,' ').trim();
  if(title.length<2)return null;
  var note=['由消息解析'];if(time)note.push('时间'+time);if(owner)note.push('负责人'+owner);
  return {id:uid(),title:title,date:date,pri:pri,from:from,note:note.join(' · '),done:done};
}

function dayGap(ds){var a=new Date(ds+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/86400000)}

function nowTime(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}

function themePickImage(file,cb){
  var rd=new FileReader();
  rd.onload=function(){ var img=new Image();
    img.onload=function(){ try{
      var maxW=1200, sc=Math.min(1,maxW/img.width);
      var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      var cx=c.getContext('2d'); cx.drawImage(img,0,0,c.width,c.height);
      var dataURL=c.toDataURL('image/jpeg',0.72);
      var s=document.createElement('canvas'); s.width=48; s.height=48; var sx=s.getContext('2d'); sx.drawImage(c,0,0,48,48);
      var px=sx.getImageData(0,0,48,48).data, R=0,G=0,B=0,ws=0;
      for(var i=0;i<px.length;i+=4){ var r=px[i],g=px[i+1],b=px[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=(mx-mn)/(mx||1),w=0.25+sat; R+=r*w;G+=g*w;B+=b*w;ws+=w; }
      R/=ws;G/=ws;B/=ws; cb(dataURL,themePaletteFromImg(R,G,B));
    }catch(e){ toast('图片处理失败，请换一张'); } };
    img.onerror=function(){ toast('图片读取失败'); }; img.src=rd.result;
  };

}

/* 2026-09-03「更新记录」兜底过滤（辉哥报 LB-2026-078 盘亏 -21,444）
   根因：data.v9.json 由 gen_data.py 合并 sheet3 主台账 + sheet30「测算仓储费」；
   sheet30 里同 pid/方向/数量、日期被改过的「更新记录」因日期与主表不同，逃过去重键
   (方向,日期,项目号,数量)，被当成独立新流水 → 虚增出库 → 库存=入-出 变负（盘亏）。
   兜底：按 (dir,pid,qty,model,wh) 分组，同组多条且日期相邻 ≤3 天的，保留最早一条，
   其余标 is_update=true；所有汇总跳过 is_update（明细仍显示，但不计入）。 */
var UPD_MARKED=false;
function _evTime(s){
  if(!s) return null;
  var p=String(s).replace(/[-.]/g,'/').split('/');
  if(p.length<3) return null;
  var y=+p[0],m=+p[1],d=+p[2];
  if(!y||!m||!d) return null;
  return Date.UTC(y,m-1,d);
}
function markUpdateRecords(){
  if(UPD_MARKED) return;
  var det=(V9 && V9.io && V9.io.all_detail);
  if(!det || !det.length){ UPD_MARKED=true; return; }
  var groups={};
  det.forEach(function(x,i){
    var k=(x.dir||'')+'|'+(x.pid||'')+'|'+(x.qty||0)+'|'+(x.model||'')+'|'+(x.wh||'');
    (groups[k]=groups[k]||[]).push(i);
  });
  Object.keys(groups).forEach(function(k){
    var arr=groups[k];
    if(arr.length<2) return;
    var wd=arr.map(function(i){return {i:i,t:_evTime(det[i].date)};}).filter(function(o){return o.t!==null;});
    if(wd.length<2) return;
    wd.sort(function(a,b){return a.t-b.t;});
    /* 保留「日期最晚」的一条：sheet3 主表真实出库日通常晚于 sheet30 的更新日
       （例：LB-2026-078 真实出库 7/31，sheet30 更新记录把日期写成 7/30），
       保留较晚那条 = 明细显示真实日期；较早的那条标 is_update，不计入汇总。 */
    var keep=wd[wd.length-1];
    wd.slice(0,-1).forEach(function(o){
      if(Math.abs(keep.t-o.t) <= 3*86400000) det[o.i].is_update=true;
    });
  });
  UPD_MARKED=true;
}

function syncV9Now(){

    .then(function(r){return r.json().then(function(j){return {ok:r.ok, body:j};});})
    .then(function(res){

function pollSync(base, token, n){
  if(n>40){ toast('⚠ 同步超时，请稍后重试'); refreshV9(); return; }
  fetch(base+'/api/sync-status',{method:'GET',headers:{'X-Webhook-Token':token},cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(st){
      if(st.running){ setTimeout(function(){ pollSync(base, token, n+1); }, 2500); return; }
      if(st.error){ toast('⚠ 同步失败：'+(st.error||'').slice(0,80)); refreshV9(); return; }
      if(st.data){ applyV9(st.data, 'live'); toast('✅ 已同步最新数据（生成于 '+st.generated_at+'）'); }
      else { toast('同步未返回数据，已改为刷新缓存'); refreshV9(); }

function hitKw(text){
  var kws=getKw(),hits=[];
  for(var i=0;i<kws.length;i++){ if(kws[i]&&String(text).indexOf(kws[i])>=0) hits.push(kws[i]); }
  return hits;
}
function markKw(text){
  var s=esc(text),kws=getKw().slice().sort(function(a,b){return b.length-a.length});
  for(var i=0;i<kws.length;i++){
    if(!kws[i])continue;
    var k=esc(kws[i]);
    s=s.split(k).join('\u0001'+k+'\u0002');
  }
  return s.split('\u0001').join('<span class="hl">').split('\u0002').join('</span>');
}

function pageTodo(){
  var t0=today();
  if(!state.calMonth){state.calMonth=t0.slice(0,7)}
  if(!state.calSel){state.calSel=t0}
  var ts=getTodos();
  var y=+state.calMonth.split('-')[0], mo=+state.calMonth.split('-')[1];
  var first=new Date(y,mo-1,1), startW=first.getDay(), days=new Date(y,mo,0).getDate();
  var cells=[];
  for(var i=0;i<startW;i++){cells.push({d:'',out:true})}
  for(var d=1;d<=days;d++){cells.push({d:d,ds:y+'-'+pad(mo)+'-'+pad(d)})}
  while(cells.length%7!==0){cells.push({d:'',out:true})}

  var h='';
  h+='<div class="page-head"><h2>待办 &amp; 排期</h2><span class="sub">共 '+ts.length+' 条 · 未完成 '+ts.filter(function(x){return !x.done}).length+' 条</span></div>';
  h+='<div class="btn-row" style="margin-bottom:16px"><button class="btn p" data-act="addTodo">'+ic('plus','#fff',15)+'新增待办</button>'+
     '<button class="btn" data-act="parseMsg">'+ic('chat','currentColor',15)+'粘贴微信 / 钉钉消息转待办</button></div>';

  h+='<div class="grid2" style="align-items:start">';
  /* 日历 */
  h+='<div class="card"><div class="cal-head">'+
     '<button class="btn xs" data-act="calPrev">'+ic('left','currentColor',14)+'</button>'+
     '<b>'+y+' 年 '+mo+' 月</b>'+
     '<button class="btn xs" data-act="calNext">'+ic('right','currentColor',14)+'</button></div>';
  h+='<div class="cal">'+['日','一','二','三','四','五','六'].map(function(w){return '<div class="wd">'+w+'</div>'}).join('');
  h+= cells.map(function(c){
    if(c.out) return '<div class="d out"></div>';
    var dayTs=ts.filter(function(x){return x.date===c.ds});
    var hasLate=dayTs.some(function(x){return !x.done&&c.ds<t0});
    var hasOpen=dayTs.some(function(x){return !x.done});
    var dots=dayTs.length? '<span class="dot '+(hasLate?'r':'')+'"></span>'+(dayTs.length>1?'<span class="dot"></span>':''):'';
    var cls='d'+(c.ds===t0?' today':'')+(c.ds===state.calSel?' sel':'');
    return '<button class="'+cls+'" data-act="calPick" data-v="'+c.ds+'"><span>'+c.d+'</span><span class="dots">'+dots+'</span></button>';
  }).join('')+'</div>';
  h+='<div class="srcline" style="margin-top:10px;text-align:center">图例：<span class="dot r" style="display:inline-block"></span> 逾期　<span class="dot" style="display:inline-block"></span> 有任务　<span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--ac);vertical-align:middle"></span> 今天</div></div>';

  /* 选中日 */
  var sel=ts.filter(function(x){return x.date===state.calSel}).sort(function(a,b){return a.pri<b.pri?-1:1});
  h+='<div class="card"><div class="card-h"><h3>'+ic('cal','var(--ac)',16)+cn(state.calSel)+' 安排</h3>'+
     '<button class="btn xs p" data-act="addTodoOn" data-v="'+state.calSel+'">+ 加到这天</button></div>';
  h+= sel.length? sel.map(function(x){return todoItem(x)}).join('')
     : '<div class="empty">'+mascot('star')+'<p>这天还是空的</p><span>点右上角安排一件事</span></div>';
  h+='</div>';
  h+='</div>';

  /* 全部清单 */
  var open=ts.filter(function(x){return !x.done}).sort(function(a,b){return a.date===b.date?(a.pri<b.pri?-1:1):(a.date<b.date?-1:1)});
  var done=ts.filter(function(x){return x.done}).sort(function(a,b){return a.date<b.date?1:-1});
  h+='<div class="card"><div class="card-h"><h3>'+ic('box','var(--violet)',16)+'全部未完成（'+open.length+'）</h3></div>'+
     (open.length? open.map(function(x){return todoItem(x)}).join('') : '<div class="empty">'+mascot('truck')+'<p>全部清空，今天你是效率之王</p></div>')+'</div>';
  if(done.length){
    h+='<div class="card"><div class="card-h"><h3>'+ic('check','var(--green)',16)+'已完成（'+done.length+'）</h3>'+
       '<button class="btn xs r" data-act="clearDone">清理已完成</button></div>'+
       done.slice(0,20).map(function(x){return todoItem(x)}).join('')+'</div>';
  }
  return h;
}

    h+='<b style="color:var(--t1)">已选内容：</b>'+items.length+' 条 · 覆盖 '+catsCount+'/8 主题 · 起始 '+items[items.length-1].date+' ~ '+items[0].date+'<br>';
    h+='<b style="color:var(--t1)">最近拉取：</b>'+esc(fetched)+' · 取自 v91-crud 学习包';

  }
  /* ---- 历史知识库：按日期分桶的折叠区 ---- */
  h+=_learnHistBlock(items,lastDate);

}

function _learnHistBlock(items,lastDate){
  /* 按日期分桶（items 已 flat 倒序；同一天多条相邻） */
  var byDate=[];
  var idx={};
  items.forEach(function(it){
    var d=it.date||'';
    if(!(d in idx)){ idx[d]=byDate.length; byDate.push({date:d,items:[]}); }
    byDate[idx[d]].items.push(it);
  });
  var totalDays=byDate.length;
  /* 今日已展示在顶部精选卡片里，历史区按"今日之前的"过滤——这样不重复；
     若用户希望全部归档，把下面这行换回 items.forEach 即可 */
  var pastDays=byDate.filter(function(g){return g.date!==lastDate;});
  var pastCount=pastDays.reduce(function(s,g){return s+g.items.length;},0);
  var nowOpen=!!state.learnHistOpen;
  var html='';
  html+='<div class="card" style="margin-top:12px;overflow:hidden">';
  html+='<div style="display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px dashed var(--line)">';
  html+='<span style="font-size:17px;font-weight:700;color:var(--t1)">'+ic('box','var(--violet)',16)+' 历史知识库</span>';
  html+='<span class="pill" style="background:var(--violet);color:#fff;border:0;font-weight:700">'+pastCount+' 条 · '+pastDays.length+' 天</span>';
  html+='<span style="margin-left:auto;display:flex;align-items:center;gap:6px">';
  if(pastDays.length){
    html+='<button class="btn xs" data-act="learnHistAll">'+ic(nowOpen?'eyeclose':'eye','#666',12)+' '+(nowOpen?'全部收起':'全部展开')+'</button>';
  }
  html+='</span></div>';
  if(!pastDays.length){
    html+='<div style="padding:18px 14px;text-align:center;color:var(--t3);font-size:12.5px">历史区暂无内容（今日之前的要点会在 20:00 自动抓取并归档）</div>';
  }else{
    html+='<div style="padding:8px 14px 14px;max-height:420px;overflow-y:auto">';
    pastDays.forEach(function(g){
      var preview=g.items[0];
      var pMeta=_learnCatMeta(preview.cat);
      var catList=Array.from(new Set(g.items.map(function(x){return x.cat}))).slice(0,5).join('·');
      html+='<details style="margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)'+(nowOpen?' open':'')+'">';
      html+='<summary style="cursor:pointer;list-style:none;padding:10px 12px;display:flex;align-items:center;gap:8px;user-select:none">';
      html+='<span style="display:inline-block;width:14px;color:var(--t3);font-size:11px">▸</span>';
      html+='<span style="font-weight:700;color:var(--t1);font-size:13.5px">'+cn(g.date)+'</span>';
      html+='<span class="pill" style="background:var(--card);color:var(--t2);border:1px solid var(--line);font-weight:600">'+g.items.length+' 条</span>';
      html+='<span style="font-size:11.5px;color:var(--t3);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(catList)+'</span>';
      html+='<span style="margin-left:auto;font-size:11.5px;color:var(--t3);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(preview.title)+'</span>';
      html+='</summary>';
      html+='<div style="padding:6px 12px 12px;border-top:1px dashed var(--line);background:var(--card)">';
      g.items.forEach(function(it){
        var m=_learnCatMeta(it.cat);
        html+='<div style="padding:9px 0;border-bottom:1px dashed var(--line)">';
        html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">';
        html+='<span class="pill" style="background:'+m.c+'18;color:'+m.c+';border:0;font-weight:700;font-size:11px">'+ic(m.i,m.c,11)+' '+esc(it.cat)+'</span>';
        if(it.src){html+='<span class="pill" style="background:var(--bg);color:var(--t3);font-size:11px;border:1px solid var(--line)">'+esc(it.src.slice(0,24))+'</span>'}
        html+='</div>';
        html+='<div style="font-size:14px;font-weight:600;line-height:1.5;color:var(--t1)">'+esc(it.title)+'</div>';
        if(it.sum){html+='<div style="margin-top:4px;font-size:12.5px;line-height:1.75;color:var(--t2);font-weight:500">'+esc(it.sum)+'</div>'}
        if(it.url){html+='<div style="margin-top:5px"><a href="'+esc(it.url)+'" target="_blank" rel="noopener" style="font-size:12px;color:var(--ac);text-decoration:none;font-weight:600">阅读原文 →</a></div>'}
        html+='</div>';
      });
      html+='</div></details>';
    });
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function pageIo(){
  var all=getIo();
  var range=state.ioRange,whF=state.ioWh;
  /* ioItems：手录条目按仓库筛选（v9 端的全局筛选已搬到 v9Io() 自定义查询；手录只保留仓库筛） */
  var ioItems=whF==='全部'?all:all.filter(function(x){return x.wh===whF});
  // 本周一 / 本周日 / 上周一 / 上周日
  var d=new Date(today()+'T00:00:00');
  var wd=d.getDay()||7;
  var mon=shift(today(),-(wd-1));
  var sun=shift(mon,6);
  var lastMon=shift(mon,-7);
  var lastSun=shift(mon,-1);
  var rangeItems;
  if(range==='本周') rangeItems=all.filter(function(x){return x.date>=mon && x.date<=sun});
  else if(range==='上周') rangeItems=all.filter(function(x){return x.date>=lastMon && x.date<=lastSun});
  else if(range==='本月') rangeItems=all.filter(function(x){return x.date.slice(0,7)===today().slice(0,7)});
  else rangeItems=all.slice();
  if(whF!=='全部') rangeItems=rangeItems.filter(function(x){return x.wh===whF});
  var whSet=Array.from(new Set(all.map(function(x){return x.wh}).filter(Boolean)));
  function sumV(items,type,cur){return items.filter(function(x){return x.type===type && x.cur===cur}).reduce(function(s,x){return s+ (+x.qty||0)*(+x.price||0)},0)}
  var inCNY=sumV(ioItems,'in','CNY'),inUSD=sumV(ioItems,'in','USD');
  var outCNY=sumV(ioItems,'out','CNY'),outUSD=sumV(ioItems,'out','USD');
  var netCNY=outCNY-inCNY,netUSD=outUSD-inUSD;
  function fCNY(n){if(!n)return '¥0';return '¥'+(n>=10000?(Math.round(n/100)/100).toLocaleString()+'万':Math.round(n).toLocaleString())}
  function fUSD(n){if(!n)return '$0';return '$'+(n>=10000?(Math.round(n/100)/100).toLocaleString()+'万':Math.round(n).toLocaleString())}

   2) sheet2_brief 模糊 (pid, product)：较长串包含较短串
   3) io.all_detail (pid, model) 模糊：找最近一次该 pid 进出库、model 相近的 wh

        if(ex.length){ var w=v9ioWhN(ex[0].wh); if(w) return w; }

          if(!rp) return false;

        });

function v9ioKdocsUrl(sheet,cfg){
  var p=cfg.pmap||KD_PMAP, dir=sheet.dir==='入'?'入':'出';
  /* 分级装载：核心参数必传，辅助参数在 URL 过长时按序丢弃。
     金山回调地址本身就很长，11 个参数一口气拼上去在部分浏览器/网关会超 2KB 被截断，
     导致「写进去了但字段不全」—— 所以宁可少传辅助项，也要保住 dir/date/pid/qty/product。 */
  var core={}, extra={};
  core[p.dir||'dir']=dir;
  core[p.date||'date']=sheet.date||'';
  core[p.pid||'pid']=sheet.pid||'';
  core[p.qty||'qty']=+sheet.qty||0;
  core[p.product||'product']=sheet.model||'';
  extra[p.wh||'wh']=sheet.wh||'';
  extra[p.note||'note']=sheet.note||'';
  extra[p.buy||'buy']=sheet.buy||'';
  extra[p.sale||'sale']=sheet.sale||'';
  extra[p.price||'price']=+sheet.price||0;
  extra[p.amount||'amount']=+sheet.amt||0;
  function enc(o){
    return Object.keys(o).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(o[k]);}).join('&');
  }
  var base=cfg.url.replace(/\/+$/,'')+(cfg.url.indexOf('?')>=0?'&':'?');
  var LIMIT=1800;
  var u=base+enc(core)+'&'+enc(extra)+'&_t='+Date.now()+'_'+(++_v9ioSeq); /* _t 防缓存：不加则相同内容第二次可能不真发请求 */
  if(u.length>LIMIT) u=base+enc(core)+'&_t='+Date.now()+'_'+(++_v9ioSeq);            /* 一级：丢辅助参数 */
  if(u.length>LIMIT){                                                /* 二级：截断超长型号名 */
    var c2={}; for(var k in core) c2[k]=core[k];
    var pk=p.product||'product', pv=String(c2[pk]||''), over=u.length-LIMIT+20;
    c2[pk]=pv.substring(0, Math.max(0, pv.length-over));
    u=base+enc(c2)+'&_t='+Date.now()+'_'+(++_v9ioSeq);
  }
  return u;
}

      clearTimeout(t);
      return fetch(u,{method:'GET',mode:'no-cors',cache:'no-store'})
        .then(function(){v9ioLogSent(u,kv,true,'no-cors');return {ok:true,confirmed:false};})
        .catch(function(){
          return new Promise(function(resolve){
            var img=new Image(),done=false;
            function fin(){ if(!done){done=true;v9ioLogSent(u,kv,true,'img');resolve({ok:true,confirmed:false});} }
            img.onload=img.onerror=fin;
            setTimeout(fin,6000);
            img.src=u;
          });

}
/* 把单条 sheet 推到 v91-crud webhook（直写 V9.1 多维表格 sheet 3 + sheet 30）。
   返回 Promise<{ok:bool, err?:string, sheet3?, sheet30?}>。
   网络/4xx/5xx/超时/CORS 任一失败都算 err，留待「复制 JSON」兜底链路继续走。*/
function v9ioPushSheet(sheet, webhook){
  if(!webhook.url) return Promise.resolve({ok:false,err:'未配置 V9.1 直写通道（请在「我的→V9.1 直写」里填）'});
  if(webhook.mode==='kdocs') return v9ioPushKdocs(sheet, webhook);
  var dir=sheet.dir==='入'?'入':'出';
  var body={dir:dir,date:sheet.date,pid:sheet.pid,buy:sheet.buy||'',sale:sheet.sale||'',
    product:sheet.model||'',wh:sheet.wh||'',qty:+sheet.qty||0,
    unit_price:+sheet.price||0,amount:+sheet.amt||0,note:sheet.note||''};
  var ctrl=new AbortController();
  var t=setTimeout(function(){ctrl.abort()}, 8000);
  return fetch(webhook.url.replace(/\/$/,'')+'/api/io-write',{
    method:'POST',signal:ctrl.signal,
    headers:{'Content-Type':'application/json','X-Webhook-Token':webhook.token||''},
    body:JSON.stringify(body)
  }).then(function(res){
    clearTimeout(t);
    return res.json().then(function(j){return {ok:res.ok, status:res.status, body:j};});
  }).then(function(r){
    if(!r.ok){return {ok:false,err:(r.body&&r.body.error)||('HTTP '+r.status)};}
    return {ok:true,sheet3:r.body.sheet3,sheet30:r.body.sheet30};
  }).catch(function(e){
    clearTimeout(t);
    return {ok:false,err:String(e&&e.message||e)};
  });
}
/* 批量推送 sheets（一条失败不阻塞其它），返回 Promise<{ok,succ[],fail[]}> */
function v9ioPushBatch(sheets, webhook){
  var succ=[],succR=[],fail=[];
  return sheets.reduce(function(p,s){
    return p.then(function(){return v9ioPushSheet(s,webhook).then(function(r){
      if(r.ok){succ.push(s);succR.push(r);} else fail.push({sheet:s,err:r.err});
    })});
  },Promise.resolve()).then(function(){return {ok:fail.length===0,succ:succ,succR:succR,fail:fail};});
}

/* 预通知：自动从 sheet2_brief 反查（输入项目号或合同号后调用） */
var _ION_AF_DEBOUNCE=null;
function ionAutoFill(){
  clearTimeout(_ION_AF_DEBOUNCE);
  _ION_AF_DEBOUNCE=setTimeout(function(){
    var sb=V9&&V9.inventory&&V9.inventory.sheet2_brief||[];
    var pidRaw='LB-'+val('ion_year')+(val('ion_mode')==='外贸（J）'?'-J':'')+(val('ion_no')?'-'+val('ion_no'):'');
    var buy=val('ion_buy').trim(), sale=val('ion_sale').trim();
    var hit=null;
    if(pidRaw.replace(/-+$/,'') && pidRaw.replace(/-+$/,'').length>5){ hit=sb.find(function(r){return r.pid===pidRaw.replace(/-+$/,'')}); }
    if(!hit && buy){ hit=sb.find(function(r){return r.buy===buy}); }
    if(!hit && sale){ hit=sb.find(function(r){return r.sale===sale}); }
    var hint=document.getElementById('ion_autoHint');
    if(hit){
      // 反向回填项目号字段
      if(!val('ion_no') && hit.pid){
        var parts=hit.pid.split('-'); // ['LB','2026','J','091']
        if(parts.length>=3){
          val_set('ion_year', parts[1]||'2026');
          if(parts[2]==='J'){ val_set('ion_mode','外贸（J）'); } else { val_set('ion_mode','内贸'); }
          val_set('ion_no', parts.slice(parts[2]==='J'?3:2).join('-')||hit.no||'');
          ionPreviewPid();
        }
      }
      if(!val('ion_buy') && hit.buy){ val_set('ion_buy', hit.buy); }
      if(!val('ion_sale') && hit.sale){ val_set('ion_sale', hit.sale); }
      // 销售端下家：默认填一份
      if(hit.customer){
        var box=document.getElementById('ion_customers');
        if(box && !box.querySelector('[data-idx="0"]')){
          box.innerHTML='<div data-idx="0" style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'+
            '<input type="text" data-f="customer" value="'+esc(hit.customer)+'" placeholder="销售下家" style="flex:1;height:30px;font-size:12.5px;padding:0 8px;border:1px solid #E8D9BE;border-radius:8px;background:#fff">'+
            '<button type="button" class="btn sm" data-act="ionDelCustomer" data-idx="0" style="border-color:var(--red-l);color:var(--red)">'+ic('trash','currentColor',12)+'</button>'+
          '</div>';
        }
      }
      // 提示
      if(hint){
        hint.style.display='inline-flex';
        hint.style.color='var(--green)';
        hint.innerHTML='✓ 已自动匹配合同：'+esc(hit.product||'')+(hit.customer?' · 下家 '+esc(hit.customer):'');
      }
      // 自动加载产品下拉
      ionLoadProductOptions([hit]);
    } else {
      if(hint){ hint.style.display='inline-flex'; hint.style.color='var(--t3)'; hint.innerHTML='未匹配到合同（项目号/合同号可能尚无记录）'; }
    }
  }, 250);
}

/* 预通知：收集表单 → 转为多张出入库条目（保存到本地 io + v9io_pending 队列） */
function ionCollect(){
  _ionRenderRows(); // 同步最新输入
  var pid='LB-'+val('ion_year')+(val('ion_mode')==='外贸（J）'?'-J':'')+(val('ion_no')?'-'+val('ion_no'):'');
  pid=pid.replace(/-+$/,'');
  var buy=val('ion_buy').trim(), sale=val('ion_sale').trim();
  var note=val('ion_note').trim();
  var drvName=val('ion_drvName').trim(), drvPhone=val('ion_drvPhone').trim(), drvPlate=val('ion_drvPlate').trim();
  var customers=Array.from(document.querySelectorAll('#ion_customers [data-f="customer"]')).map(function(el){return el.value.trim()}).filter(Boolean);
  // 校验
  if(!pid && !buy && !sale){
    toast('请至少填写项目号/采购合同号/销售合同号之一');
    return null;
  }
  var rows=_IO_NOTICE_ROWS.filter(function(r){
    return (r.wh&&(r.inQty||r.outQty))||r.product;
  });
  if(!rows.length){
    toast('请至少添加一条产品行（仓库+数量 或 产品名）');
    return null;
  }
  // 每行：构建 io item + sheet draft
  var ts=Date.now();
  var ioItems=[], sheets=[], idx=0;
  rows.forEach(function(r){
    var driverInfo=(drvName||drvPhone||drvPlate)?('司机：'+(drvName||'?')+' / '+(drvPhone||'?')+' / '+(drvPlate||'?')):'';
    var extraNote=[customers.length?'下家：'+customers.join('、'):'', driverInfo].filter(Boolean).join(' · ');
    var fullNote=(note?note:'')+(/[，。,]/.test(note)?' · ':'')+extraNote;
    if(r.inQty){
      var li={id:'ion_'+ts+'_'+idx,type:'in',date:r.inDate||today(),wh:r.wh,item:r.product||'',qty:+r.inQty||0,price:'',cur:'',
        project:pid,note:fullNote};
      var sh={dir:'入',date:li.date,pid:pid,contract:buy||sale||'',model:r.product||'',
        wh:r.wh,qty:+r.inQty||0,amt:0,price:0,buy:buy,sale:sale,cur:'',vol:r.inVol||'',note:fullNote,ts:ts};
      ioItems.push(li); sheets.push(sh);
      idx++;
    }
    if(r.outQty){
      var li2={id:'ion_'+ts+'_'+idx,type:'out',date:r.outDate||today(),wh:r.wh,item:r.product||'',qty:+r.outQty||0,price:'',cur:'',
        project:pid,note:fullNote};
      var sh2={dir:'出',date:li2.date,pid:pid,contract:buy||sale||'',model:r.product||'',
        wh:r.wh,qty:+r.outQty||0,amt:0,price:0,buy:buy,sale:sale,cur:'',vol:r.outVol||'',note:fullNote,ts:ts};
      ioItems.push(li2); sheets.push(sh2);
      idx++;
    }
  });
  if(!sheets.length){
    toast('请填写产品的入库数量或出库数量');
    return null;
  }
  return {pid:pid,buy:buy,sale:sale,note:note,drv:{n:drvName,p:drvPhone,pl:drvPlate},customers:customers,rows:rows,items:ioItems,sheets:sheets,ts:ts};
}

/* 预通知：渲染到 canvas（生成可下载/可复制的图片） */
function ionRenderCanvas(){
  var d=ionCollect();
  if(!d){ return null; }
  var cv=document.getElementById('ion_canvas');
  if(!cv) return null;
  // 移动端画布：宽度按内容定（WeChat 适合 ~720px 宽），用 2x DPR 出清晰图
  var dpr=window.devicePixelRatio||1;
  var W=720, pad=20, lineH=22, titleH=42;
  // 估算高度
  var rowH=46;
  var H=titleH + 30 + 30 + 30 + 30 + 20 + 20 + d.rows.length*rowH + 30 + 30 + 30 + 30 + 40 + 30;
  H=Math.max(420, H);
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  // 背景
  ctx.fillStyle='#FFFCF5'; ctx.fillRect(0,0,W,H);
  // 标题
  ctx.fillStyle='#ED7A1A'; ctx.font='700 18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('📦 出入库预通知', pad, 28);
  // 时间戳
  ctx.fillStyle='#888'; ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='right';
  ctx.fillText('生成于 '+nowTime(), W-pad, 28);
  ctx.textAlign='left';
  // 分隔
  ctx.strokeStyle='#F0E5D0'; ctx.beginPath(); ctx.moveTo(pad, titleH-6); ctx.lineTo(W-pad, titleH-6); ctx.stroke();
  var y=titleH+8;
  function kv(k,v,color){
    ctx.fillStyle='#888'; ctx.font='12px sans-serif'; ctx.fillText(k, pad, y);
    ctx.fillStyle=color||'#222'; ctx.font='600 13px sans-serif';
    var tx=pad+72;
    var txt=String(v==null?'':v);
    if(ctx.measureText(txt).width>W-pad-tx-10){
      while(ctx.measureText(txt+'…').width>W-pad-tx-10 && txt.length>0) txt=txt.slice(0,-1);
        txt+='…';
    }
    ctx.fillText(txt, tx, y);
    y+=lineH;
  }
  kv('项目号', d.pid||'—', '#ED7A1A');
  kv('采购合同号', d.buy||'—');
  kv('销售合同号', d.sale||'—');
  kv('销售下家', d.customers.join('、')||'—');
  // 司机
  var drvTxt=[d.drv.n&&('司机：'+d.drv.n), d.drv.p&&('电话：'+d.drv.p), d.drv.pl&&('车牌：'+d.drv.pl)].filter(Boolean).join(' / ');
  kv('司机信息', drvTxt||'—');
  // 备注
  if(d.note){ kv('备注', d.note); }
  // 表格标题
  y+=4;
  ctx.fillStyle='#222'; ctx.font='600 13px sans-serif'; ctx.fillText('出入库明细', pad, y); y+=4;
  ctx.strokeStyle='#E8D9BE'; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
  y+=12;
  // 表头
  ctx.fillStyle='#FFF8E8'; ctx.fillRect(pad, y-12, W-pad*2, 22);
  ctx.fillStyle='#666'; ctx.font='600 11.5px sans-serif';
  var cols=[
    {k:'仓库',x:pad+4,w:80},
    {k:'产品',x:pad+88,w:200},
    {k:'入库日期',x:pad+292,w:90},
    {k:'入库数',x:pad+386,w:60},
    {k:'出库日期',x:pad+450,w:90},
    {k:'出库数',x:pad+544,w:60}
  ];
  cols.forEach(function(c){ ctx.fillText(c.k, c.x, y+4); });
  y+=18;
  // 行
  d.rows.forEach(function(r){
    var hasIn=!!(r.inQty&&r.inQty>0), hasOut=!!(r.outQty&&r.outQty>0);
    if(!hasIn && !hasOut) return;
    // 截断产品名
    var prodTxt=String(r.product||'—');
    if(ctx.measureText(prodTxt).width>200){ while(ctx.measureText(prodTxt+'…').width>200 && prodTxt.length>0) prodTxt=prodTxt.slice(0,-1); prodTxt+='…'; }
    ctx.fillStyle='#222'; ctx.font='12px sans-serif';
    ctx.fillText((r.wh||'—'), pad+4, y);
    ctx.fillText(prodTxt, pad+88, y);
    ctx.fillStyle='#0a8b3e'; ctx.fillText(hasIn?(r.inDate||'—'):'—', pad+292, y);
    ctx.fillText(hasIn?r.inQty:'—', pad+386, y);
    ctx.fillStyle='#c0392b'; ctx.fillText(hasOut?(r.outDate||'—'):'—', pad+450, y);
    ctx.fillText(hasOut?r.outQty:'—', pad+544, y);
    ctx.strokeStyle='#F2E8D0'; ctx.beginPath(); ctx.moveTo(pad, y+6); ctx.lineTo(W-pad, y+6); ctx.stroke();
    y+=rowH;
  });
  // 底部
  ctx.fillStyle='#888'; ctx.font='11px sans-serif';
  ctx.fillText('武汉联博光电 · 出入库预通知（生成后请人工核对再操作）', pad, y+18);
  // 输出 dataURL
  return cv.toDataURL('image/png');
}

/* 预通知：复制 PNG 到剪贴板（可粘到微信） */
async function ionImgCopy(){
  var url=ionRenderCanvas();
  if(!url) return;
  try{
    var blob=await (await fetch(url)).blob();
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast('✅ 已复制到剪贴板，可去微信粘贴');
    } else { throw new Error('浏览器不支持剪贴板图片'); }

    toast('复制失败：'+e.message+'（请改用「下载图片·保存」再发送）');
  }
}
/* 第一步：收集表单 + 校验，返回 draft（失败返回 null）
   增强：① 项目编号自动归一化（091/91/9 → 091）；② 仓库为空时按 pid 从历史出入库自动推荐 */
function ioFormV9Collect(){
  var year=val('ioForm_yearSel'), mode=val('ioForm_modeSel'), no=val('ioForm_noInp');
  var buy=val('ioForm_buy'), sale=val('ioForm_sale');

  var outDate=val('ioForm_outDate'), outQty=+(val('ioForm_outQty')||0), outVol=val('ioForm_outVol');

  var mid=mode==='外贸（J）'?'-J':'';

  return {year:year,mode:mode,no:norm,pid:pid,
    buy:buy,sale:sale,product:product,wh:wh,

/* 真正写入（确认后） */
function ioFormV9Save(){
  var d=state.ioFormDraft;
  if(!d) return false;
  var ts=Date.now(), idPrefix='v9_'+ts+'_';
  function buildItem(dir,date,qty,vol){
    var li={id:idPrefix+Math.random().toString(36).slice(2,6),type:dir==='入'?'in':'out',
      date:date||today(),wh:d.wh,item:d.product||'',qty:qty,price:'',cur:'',
      project:d.pid,note:(d.note||'')+(vol?(' / 体积 '+vol):'')};
    return {li:li, sheet:{dir:dir,date:li.date,pid:d.pid,contract:d.buy||d.sale||'',model:d.product||'',
      wh:d.wh,qty:qty,amt:0,price:0,buy:d.buy,sale:d.sale,cur:'',vol:vol||'',note:d.note||'',ts:ts}};
  }
  var items=[], sheets=[];
  if(d.inQty>0){var a=buildItem('入',d.inDate,d.inQty,d.inVol);items.push(a.li);sheets.push(a.sheet)}
  if(d.outQty>0){var b=buildItem('出',d.outDate,d.outQty,d.outVol);items.push(b.li);sheets.push(b.sheet)}
  setIo(getIo().concat(items));
  /* 1) 写入本地 v9io_pending 队列（页面立即可见） */
  var allPending=getV9ioPending().concat(sheets);
  setV9ioPending(allPending);
  state.ioFormDraft=null; state.ioFormStep='form';
  /* 2) 自动复制刚保存的 sheets（仅本次新增的部分，不是历史累积）到剪贴板 */
  var clipTxt=JSON.stringify(sheets,null,2);
  var _wr=getV9ioWebhook();
  var _direct=!!(_wr.mode&&_wr.url&&sheets.length);
  if(_direct){
    /* 直写模式：仍静默复制一份 JSON 作保险，但不再弹「回 WorkBuddy 派单」的引导 */
    _copyText(clipTxt);
    toast('⏳ 已保存 '+items.length+' 条，正在直写 V9.1 多维表格…');
  }else{
    _copyText(clipTxt).then(function(ok){
      if(ok){ toast('已保存 '+items.length+' 条出入库 + 已自动复制同步 JSON 到剪贴板。\n回 WorkBuddy 对话告诉我：「同步上面」\n我立即用 kdocs 写入 V9.1 多维表格 sheet 3 / sheet 30。'); }
      else   { toast('已保存 '+items.length+' 条出入库（自动复制失败，请手动复制顶部「待同步」卡片的 JSON）'); }
    });
  }
  /* 3) 关掉 modal */
  try{ closeModal(); }catch(e){}
  render();
  /* 4) 推送直写通道（V9.1 出入库 + 测算仓储费）—— 成功则从待同步队列移除这批。
     未配置通道时静默跳过，走「复制 JSON」兜底。 */
  if(_direct){
    v9ioPushBatch(sheets,_wr).then(function(rs){
      if(rs.ok){
        /* 推送成功 → 从 pending 队列里精确移除这批（按 ts 筛掉） */
        var remaining=getV9ioPending().filter(function(p){return p.ts!==ts;});
        setV9ioPending(remaining);
        if(_wr.mode==='kdocs'){
          var conf=(rs.succR||[]).filter(function(r){return r.confirmed!==false;}).length;
          toast((conf?'✅ 已直写 V9.1 ':'📤 已触发 V9.1 ')+rs.succ.length+' 条（出入库 + 测算仓储费）\n'+
                (conf?'':'跨域读不到响应属正常，')+'请到 V9.1 核对一下');
        }else{
          toast('✅ 已直写 V9.1 多维表格 '+rs.succ.length+' 条（sheet 3 + sheet 30）');
        }
      }else if(rs.succ.length){
        var remaining=getV9ioPending().filter(function(p){return p.ts!==ts;}).concat(rs.fail.map(function(x){return x.sheet;}));
        setV9ioPending(remaining);
        toast('⚠️ 直写部分成功（'+rs.succ.length+'/'+sheets.length+'），'+rs.fail[0].err+'。剩余条目已保留在待同步区。');
      }else{
        toast('⚠️ 直写失败：'+rs.fail[0].err+'。\n已自动复制 JSON，去对话说「同步上面」');
      }
      render();
    });
  }
  return true;
}
/* ============= 识别录入（页面内自动 OCR） =============
   工作流：用户上传图片/PDF → 页面内自动调 Tesseract 引擎（本地，无需联网）→ 自动解析字段 →
   「填充到新增出入库」关闭此 modal、自动唤醒 ioFormV9 并预填。
   兜底：识别失败或准确率低时，仍可手动粘贴 OCR 文本后「重解析字段」。 */
var OCR_LANG='chi_sim'; // 中文简
/* 关键：必须用「绝对 URL」+ workerBlobURL:false。
   Tesseract 默认用 blob: 创建 worker，worker 内相对路径会相对 blob: 解析 → 加载 WASM/语言包失败（识别报错的真凶）。
   corePath 以 / 结尾 → 引擎会拼成 <base>vendor/tesseract-core-simd.wasm.js
   langPath 不以 / 结尾 → 会拼成 <base>vendor/tessdata/chi_sim.traineddata.gz */
function _ocrBase(){
  /* 纯字符串算「当前页面所在目录的绝对 URL」，不依赖 new URL（部分 WebView 里 URL 行为不一致） */
  try{
    var h=String(location.href||'').split('?')[0].split('#')[0];
    return h.substring(0, h.lastIndexOf('/')+1);
  }catch(_){ return ''; }
}
function _ocrOpts(){
  var b=_ocrBase();
  return {
    workerPath: b+'vendor/worker.min.js',
    corePath:   b+'vendor/',
    langPath:   b+'vendor/tessdata',
    workerBlobURL:false,
    gzip:true
  };
}

async function ocrStart(file){
  if(!file){ toast('请先选择文件'); return; }
  var pre=document.getElementById('ocrPreview');
  var prog=document.getElementById('ocrProgress');
  var bar=document.getElementById('ocrProgBar');
  var lab=document.getElementById('ocrProgLabel');

  var cancel=document.getElementById('ocrCancelBtn');
  var hint=document.getElementById('ocrProgHint');
  if(!pre||!prog) return;

    pre.innerHTML='<img src="'+url+'" style="max-width:100%;max-height:180px;border-radius:6px">';
  } else {
    pre.innerHTML='<div style="font-size:12.5px;color:var(--t2);padding:10px">PDF：<b>'+esc(file.name)+'</b>（'+Math.round(file.size/1024)+' KB · 自动转首页为图片再 OCR）</div>';
  }

  if(cancel) cancel.style.display='inline-block';

    if(hintTxt && hint) hint.textContent=hintTxt;
  }
  try{
    /* 关键：不依赖「点开 modal 时的预加载」——用户一传文件就主动等引擎就绪，避免"识别错误" */
    if(!window.Tesseract || !window.__pdfjsLib){
      _setUI(3,'正在加载识别引擎…','首次使用需下载约 7MB（引擎 + 中文语言包），请稍候');
      var _ok=await new Promise(function(res){
        var t0=setTimeout(function(){ res({ok:false,errs:['引擎加载超时（30 秒）']}); }, 30000);
        window.__loadOcrEngine(function(ok,errs){
          clearTimeout(t0);
          res({ok:ok,errs:errs||[]});
        });
      });
      if(state._ocrCancel) return;
      if(!_ok.ok){
        _setUI(0,'识别引擎加载失败','');
        if(cancel) cancel.style.display='none';
        _ocrShowDiag('识别引擎加载失败', (_ok.errs||[]).join('；') || '引擎文件未能加载');
        return;
      }
    }
    var imgSrc;
    if(isImg){
      imgSrc=url;
      _setUI(8,'已选图片，准备识别…');
    } else {
      _setUI(5,'PDF 转首页图片…');
      if(!window.__pdfjsLib){ _setUI(0,'PDF 引擎未就绪，刷新重试'); if(cancel) cancel.style.display='none'; prog.style.display='none'; _ocrShowDiag('PDF 引擎未就绪','请点击「重试加载引擎」或刷新页面'); return; }
      imgSrc=await _pdfFirstPageToImg(file, function(step,p){ _setUI(Math.round(2+p*0.06), step); });
      _setUI(8,'PDF 转图完成，开始识别…');
    }
    if(!window.Tesseract){
      _setUI(0,'OCR 引擎未就绪','');
      if(cancel) cancel.style.display='none'; prog.style.display='none';
      _ocrShowDiag('OCR 引擎未就绪','请点击「重试加载引擎」或刷新页面（首次需联网下载约 7MB）');
      return;

        } else if(m.status==='loading tesseract core'){
          _setUI(8,'加载 OCR 引擎…');
        } else if(m.status==='initializing tesseract'){
          _setUI(15,'初始化 OCR 引擎…');
        } else if(m.status==='loading language traineddata'){

        } else if(m.status==='initializing api'){
          _setUI(38,'初始化识别 API…');

    _matchOcrToInventory(parsed);
    toast(text ? 'OCR 识别完成 · 已自动解析入库/出库字段' : 'OCR 完成但未识别到文字，请手动粘贴或换张更清晰的图');
  }catch(e){
    done=true;
    console.error(e);
    if(prog) prog.style.display='none';
    if(cancel) cancel.style.display='none';
    var msg=(e&&e.message)||String(e)||'未知错误';
    /* 常见原因先本地化翻译，别让辉哥看英文堆栈 */
    if(/NetworkError|Network|Failed to fetch|fetch/i.test(msg)) msg='网络异常：无法下载 OCR 引擎或中文语言包（首次需联网一次）';
    else if(/importScripts|worker/i.test(msg)) msg='Worker 加载失败：引擎文件路径解析错误';
    else if(/wasm|core/i.test(msg)) msg='WASM 引擎核加载失败';
    else if(/lang|traineddata|chi_sim/i.test(msg)) msg='中文语言包（chi_sim）加载失败';
    _ocrShowDiag('识别失败', msg);
  }

async function _pdfFirstPageToImg(file, onStep){
  var buf=await file.arrayBuffer();
  if(onStep) onStep('PDF 解码…',0.1);
  var pdf=await window.__pdfjsLib.getDocument({data:buf}).promise;
  if(onStep) onStep('PDF 第 1 页渲染…',0.4);
  var page=await pdf.getPage(1);
  var vp=page.getViewport({scale:2.0});
  var canvas=document.createElement('canvas');
  canvas.width=Math.ceil(vp.width); canvas.height=Math.ceil(vp.height);
  var ctx=canvas.getContext('2d');
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  if(onStep) onStep('PDF 已转图片',1.0);
  return canvas.toDataURL('image/png');
}

function parseOcrTxt(txt){
  txt=txt||''; var out={_raw:txt};
  /* OCR 容错：去除常见误识（如空格、断句），统一全角符号 */
  var norm=txt.replace(/[，、。；：]/g,' ').replace(/[Oo]/g, o=> /[A-Za-z]/.test(o)?'O':'0').replace(/\s+/g,' ');
  /* 日期：YYYY-MM-DD / YYYY/MM/DD / YYYY.MM.DD / 2024年08月31日 */
  var dm=norm.match(/\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?/);
  if(dm){out.date=dm[0].replace(/[年月]/g,'-').replace(/\./g,'-').replace(/\//g,'-').replace(/日$/,'');
    var dy=out.date.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(dy) out.date=dy[1]+'-'+dy[2].padStart(2,'0')+'-'+dy[3].padStart(2,'0');
  }
  /* 项目号：标准 LB-2026-078 / 外贸 LB-2026-J-024；OCR 误识空格也容错 */
  var pidm=norm.match(/LB[- ]?(\d{4})[- ]?(J[- ]?)?[- ]?(\d{2,4})/i);

  var sm=norm.match(/(?:销售合同号[:：\s]*|RF[- ]?LB[- ]?\d+[A-Z]?|XS[- ]?LB[- ]?\d+[A-Z]?|KY[- ]?LB[- ]?\d+|JZ[- ]?LB[- ]?\d+)([\w\-]+)/i);

  if(/出库/.test(txt)) out.dir='出';

  var am=norm.match(/[¥￥]\s*(\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?)/);

/* 智能匹配：根据解析字段在 V9 数据里找最贴近的合同/产品/库存 */
function _matchOcrToInventory(p){
  var hits=[];
  var V9=window.V9;
  if(!V9 || !(V9.inventory||{}).sheet2_brief){
    state._ocrMatch=null;
    return;
  }
  var briefs=V9.inventory.sheet2_brief||[];
  var qty=p.qty?p.qty:null;
  var pid=(p.pid||'').toUpperCase();
  var buy=(p.buy||'').toUpperCase();
  var sale=(p.sale||'').toUpperCase();
  briefs.forEach(function(b){
    var score=0;
    if(pid && b.pid && String(b.pid).toUpperCase()===pid) score+=60;
    else if(pid && b.pid && String(b.pid).toUpperCase().indexOf(pid)>=0) score+=30;
    if(buy && b.buy && String(b.buy).toUpperCase().indexOf(buy)>=0) score+=50;
    if(sale && b.sale && String(b.sale).toUpperCase().indexOf(sale)>=0) score+=50;
    if(qty && b.qty && Math.abs(Number(b.qty)-qty)<Math.max(qty*0.2,5)) score+=15;
    if(b.wh && p.wh && String(b.wh).indexOf(p.wh)>=0) score+=10;
    if(score>=30) hits.push({score:score,b:b});
  });
  hits.sort(function(a,b){return b.score-a.score;});
  state._ocrMatch=hits.slice(0,3);
}

  var ZH={pid:'项目号',sale:'销售合同号',buy:'采购合同号',supplier:'采购端供方',customer:'销售端下家',mode:'内外贸',year:'年份',mid:'单据号',no:'序号',status:'完结状态',overdue:'逾期',product:'产品',ptype:'产品类型',wh:'仓库',amt:'金额(元)',qty:'数量',cnt:'合同数/笔数',type:'产品类型',month:'月份',in_amt:'入库金额(元)',in_qty:'入库数量',out_amt:'出库金额(元)',out_qty:'出库数量',week:'周',dir:'方向',date:'日期',contract:'合同',model:'型号',price:'单价(元)',warehouses:'仓库',months:'月数',sf_no:'顺丰单号',route:'路线',project:'项目',fee:'运费(元)'};
  var sheets=[];
  sheets.push({name:'说明',rows:[
    ['V9.1 物管数据多维表格（Excel 导出）'],
    ['数据来源',d.source||''],
    ['生成时间',d.generated_at||''],
    ['文件ID',d.file_id||''],
    [''],
    ['工作表','行数(约)','说明'],
    ['合同台账',(inv.sheet2_brief||[]).length,'全部合同明细'],
    ['库存按仓库',(inv.by_warehouse||[]).length,'各仓库库存金额/数量'],
    ['库存按产品',(inv.product_types||[]).length,'各产品类型库存'],
    ['逾期合同TOP40',(inv.overdue_contracts||[]).length,'逾期合同清单'],
    ['合同按年',Object.keys(inv.by_year||{}).length,'按年份汇总'],
    ['出入库明细',(io.all_detail||[]).length,'全部出入库流水'],
    ['出入库统计','-','按月/按仓库/按周汇总'],
    ['仓储费按供应商',(st.by_supplier||[]).length,'各供应商仓储费'],
    ['仓储费按月',(st.by_month||[]).length,'按月仓储费'],
    ['顺丰运输明细',(st.sf_shipments||[]).length,'顺丰运输单'],
    ['查询统计','-','查询追踪汇总']
  ]});
  sheets.push({name:'合同台账',rows:_v9Table(inv.sheet2_brief,['pid','sale','buy','supplier','customer','mode','year','mid','no','status','overdue','product','ptype'],ZH)});
  sheets.push({name:'库存按仓库',rows:_v9Table(inv.by_warehouse,['wh','amt','qty','cnt'],ZH)});
  sheets.push({name:'库存按产品',rows:_v9Table(inv.product_types,['type','amt','cnt'],ZH)});
  sheets.push({name:'逾期合同TOP40',rows:_v9Table(inv.overdue_contracts,['项目号','销售合同号','采购合同号','采购端供方','销售端下家','截止日期','仓库','库存金额','产品类型'],ZH)});
  var yr=inv.by_year||{}, yrecs=Object.keys(yr).map(function(k){return {年:k,amt:yr[k].amt,cnt:yr[k].cnt,overdue:yr[k].overdue};});
  sheets.push({name:'合同按年',rows:_v9Table(yrecs,['年','amt','cnt','overdue'],ZH)});
  sheets.push({name:'出入库明细',rows:_v9Table(io.all_detail,['dir','date','pid','contract','model','wh','qty','amt','price'],ZH)});
  var srows=[['出入库统计']];
  srows.push(['指标','入库金额(元)','入库数量','出库金额(元)','出库数量','笔数']);
  var t=io.total||{}; srows.push(['本周期累计',t.in_amt,t.in_qty,t.out_amt,t.out_qty,'']);
  var tw=io.this_week||{}; srows.push(['本周',tw.in_amt,tw.in_qty,tw.out_amt,tw.out_qty,tw.cnt]);
  var ms=io.month_summary||{}; srows.push(['本月',ms.in_amt,ms.in_qty,ms.out_amt,ms.out_qty,ms.cnt]);
  var pws=io.prev_week_summary||{}; if(pws&&pws.in_amt!=null) srows.push(['上周',pws.in_amt,pws.in_qty,pws.out_amt,pws.out_qty,pws.cnt]);
  srows.push([]); srows.push(['按月份']);
  _v9Table(io.by_month,['month','in_amt','in_qty','out_amt','out_qty','cnt'],ZH).forEach(function(r,i){if(i>0)srows.push(r);});
  srows.push([]); srows.push(['按仓库']);
  _v9Table(io.by_warehouse,['wh','in_amt','out_amt','in_qty','out_qty'],ZH).forEach(function(r,i){if(i>0)srows.push(r);});
  srows.push([]); srows.push(['按周']);
  _v9Table(io.weeks,['week','in_amt','out_amt'],ZH).forEach(function(r,i){if(i>0)srows.push(r);});
  sheets.push({name:'出入库统计',rows:srows});
  sheets.push({name:'仓储费按供应商',rows:_v9Table(st.by_supplier,['supplier','amt','warehouses','months'],ZH)});
  sheets.push({name:'仓储费按月',rows:_v9Table(st.by_month,['month','amt'],ZH)});
  sheets.push({name:'顺丰运输明细',rows:_v9Table(st.sf_shipments,['date','sf_no','route','project','fee'],ZH)});
  var qrows=[['查询统计汇总']];
  qrows.push(['总合同数',q.total]); qrows.push(['已查询',q.queried]); qrows.push(['未查询',q.not_queried]); qrows.push(['查询率(%)',q.queried_pct]);
  qrows.push([]); qrows.push(['查询次数 TOP']);
  _v9Table(q.top_queried,['项目号','查询次数'],ZH).forEach(function(r,i){if(i>0)qrows.push(r);});
  qrows.push([]); qrows.push(['未查询样本']);
  var uf=q.unqueried_sample||[], ufk=uf[0]?Object.keys(uf[0]):[];
  _v9Table(uf,ufk,ZH).forEach(function(r,i){if(i>0)qrows.push(r);});
  sheets.push({name:'查询统计',rows:qrows});
  return sheets;
}
async function v9DlXlsx(){
  toast('正在拉取最新 V9.1 多维表格并生成 Excel…');
  var base=_ocrBase()||'', data=null;
  try{
    var r=await fetch(base+'data.v9.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    data=await r.json();
  }catch(e){
    if(window.V9&&window.V9.inventory){ data={inventory:window.V9.inventory||{},io:window.V9.io||{},storage:window.V9.storage||{},query:window.V9.query||{}}; }
    if(!data){ toast('取数失败：'+(e&&e.message||'')+' · 请检查网络后重试'); return; }
  }
  try{
    var sheets=_v9Sheets(data);
    var blob=buildXlsx(sheets);
    var name='V9.1多维表格_'+today()+'.xlsx';
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2500);
    toast('已下载 '+name+'（'+sheets.length+' 个工作表，'+Math.round(blob.size/1024)+' KB）');
  }catch(e2){
    try{ v9DlJson(); toast('Excel 生成失败，已降级导出 JSON'); }catch(_){ toast('导出失败：'+(e2&&e2.message||'')); }
  }
}
function doExportCsv(){
  var rows=[['事项','日期','优先级','来源','状态','备注']];
  getTodos().forEach(function(t){rows.push([t.title,t.date,t.pri,t.from,t.done?'已完成':'未完成',t.note||''])});
  var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='待办清单_'+today()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV 已导出');
}
document.getElementById('fileInput').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw 0;
      if(d.todos)setTodos(d.todos); if(d.news)setNews(d.news); if(d.ideas)setIdeas(d.ideas);
      if(d.keywords)setKw(d.keywords); if(d.io)setIo(d.io); if(d.meta)setMeta(d.meta);
      SS(K.seed,true);
      toast('导入成功：待办 '+((d.todos||[]).length)+' / 资讯 '+((d.news||[]).length)+' / 选题 '+((d.ideas||[]).length)+' / 出入库 '+((d.io||[]).length));
      render();
    }catch(err){ toast('文件解析失败，请确认是本工作台导出的 JSON'); }
  };
  r.readAsText(f); e.target.value='';
});

  }

  /* --- 待办 --- */
  if(act==='addTodo'||act==='addTodoOn'){
    var pre={title:'',date:v||today(),pri:'P1',from:'自建',note:''};
    openModal('新增待办',todoForm(pre),'保存',function(){
      if(!val('fTitle')){toast('先写点内容嘛');return false}
      ts=getTodos(); ts.push({id:uid(),title:val('fTitle'),date:val('fDate')||today(),pri:val('fPri'),from:val('fFrom'),note:val('fNote'),done:false});
      setTodos(ts); toast('已添加'); render();
    },{icon:'plus'}); return;
  }
  if(act==='editTodo'){
    ts=getTodos(); ix=ts.findIndex(function(x){return x.id===id}); if(ix<0)return;
    openModal('修改待办',todoForm(ts[ix]),'保存',function(){
      if(!val('fTitle')){toast('内容不能为空');return false}
      ts[ix].title=val('fTitle');ts[ix].date=val('fDate');ts[ix].pri=val('fPri');ts[ix].from=val('fFrom');ts[ix].note=val('fNote');
      setTodos(ts); toast('已更新'); render();

  if(act==='toggleTodo'){
    ts=getTodos(); ix=ts.findIndex(function(x){return x.id===id}); if(ix<0)return;

    var u=val('lgUser'), p=val('lgPwd');
    if(!u||!p){toast('请输入账号和密码');return}
    var us=getUsers(), m=null;
    us.forEach(function(x){if(x.u===u && x.p===p) m=x});
    if(!m){toast('账号或密码错误');return}
    setSess({u:m.u,role:m.role,name:m.name||m.u});
    toast('登录成功：'+(m.name||m.u));
    state.tab='home';
    render(); return;
  }
  if(act==='logout'){
    clearSess(); state.tab='home';
    toast('已退出'); render(); return;
  }
  if(act==='userAdd'){
    openModal('新增账号',userForm(),'保存',function(){
      var u=val('ufUser'), p=val('ufPwd');
      if(!u||!p){toast('账号和密码必填');return false}
      var us=getUsers(), dup=false;
      us.forEach(function(x){if(x.u===u) dup=true});
      if(dup){toast('账号已存在');return false}
      us.push({u:u,p:p,name:val('ufName'),role:val('ufRole')||'user'});
      setUsers(us); toast('已新增'); render(); return true;
    },{icon:'plus'}); return;
  }
  if(act==='userEdit'){
    var us=getUsers(), x=us[id];
    if(!x){toast('账号不存在');return}
    openModal('编辑账号',userForm(x),'保存',function(){
      var u=val('ufUser'), p=val('ufPwd');
      if(!u||!p){toast('账号和密码必填');return false}
      var dup=false;
      us.forEach(function(y,i){if(y.u===u && i!=id) dup=true});
      if(dup){toast('账号已存在');return false}
      us[id]={u:u,p:p,name:val('ufName'),role:val('ufRole')||'user'};
      setUsers(us); toast('已更新'); render(); return true;
    },{icon:'edit'}); return;
  }
  if(act==='userDel'){
    var us=getUsers(), x=us[id];
    if(!x){toast('账号不存在');return}
    confirmBox('删除账号','将删除账号「'+esc(x.u)+'」，该账号将无法登录。确认删除？','确认删除',function(){
      us.splice(id,1); setUsers(us); toast('已删除'); render();
    }); return;
  }
});

/* ================= PWA ================= */
function initPWA(){
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.v29.js').then(function(reg){
      if(!reg) return;
      // 注册后立即主动检查 SW 更新（即使页面长期开着，也能立刻升级到新 SW，拿到最新 data.json）
      try{ if(reg.update) reg.update(); }catch(_){}
      // 检测到新版本已安装 → 自动重载一次，让新页面/新数据立刻生效（sessionStorage 防循环）
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            if(!sessionStorage.getItem('wb_sw_reloaded')){
              sessionStorage.setItem('wb_sw_reloaded','1');
              setTimeout(function(){ location.reload(); },200);
            }
          }
        });
      });
    }).catch(function(){});
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._deferred=e});
}

/* ================= 启动 ================= */
/* 扫码 / 链接自动配置直写通道：打开带 ?wh=<server 公网地址>&wt=<token> 的链接即完成配置。
   用途：本机「一键启动」脚本把隧道地址做成二维码，手机扫一下就配好，不用手工填。
   注意：配置落在「扫码时那个浏览器」的 localStorage，换浏览器（微信/飞书互切）需重新扫。
   这里直接写 meta 而不调 setV9ioWebhook，避免在数据初始化前触发 render()。 */
(function v9ioAutoCfg(){
  try{
    var q=location.search||'';
    var mw=q.match(/[?&]wh=([^&]+)/), mt=q.match(/[?&]wt=([^&]+)/);
    if(!mw) return;
    var url=decodeURIComponent(mw[1]);
    var tok=mt?decodeURIComponent(mt[1]):'';
    if(url && /^https?:\/\//i.test(url)){
      var m=getMeta();
      m.v9ioWhMode='server';
      m.v9ioWebhookUrl=url;
      m.v9ioWebhookToken=tok;
      setMeta(m);
      try{ localStorage.setItem('v9io_autocfg_at', new Date().toISOString().slice(0,19).replace('T',' ')); }catch(e){}
      /* 清掉地址栏参数：避免刷新重复触发，也避免 token 留在浏览器历史里 */
      try{ history.replaceState({}, '', location.pathname + (location.hash||'')); }catch(e){}
    }
  }catch(e){}
})();
seedData();
state.calMonth=today().slice(0,7);
state.calSel=today();
loadV9();
applyTheme();
render();
initPWA();
document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeModal(); });
