function ioFormV9Collect(){
  _iofRenderRows();
  var year=val('ioForm_yearSel'), mode=val('ioForm_modeSel');
  var noRaw=val('ioForm_noInp'), norm=_v9ioNormalizeNo(noRaw);
  if(!norm){toast('请填写项目编号（数字，091/91/9 皆可）');return null}
  if(norm!==noRaw){ var inp=document.getElementById('ioForm_noInp'); if(inp){ inp.value=norm; previewIoFormPid(); } }
  var mid=mode==='外贸（J）'?'-J':'';
  var pid='LB-'+year+mid+'-'+norm;
  var buy=val('ioForm_buy'), sale=val('ioForm_sale');
  var note=val('ioForm_note');
  /* 司机信息板块已移除（V9.1 sheet3 不涉及）；下家/采购销售合同号：表单保留，仅 sheet 写入时忽略 */
  var customers=Array.from(document.querySelectorAll('#ioForm_customers [data-f="customer"]')).map(function(el){return el.value.trim()}).filter(Boolean);
  /* 收集 rows */
  var rows=_IO_NEW_ROWS.slice().map(function(r){
    return {wh:(r.wh||'').trim(), product:(r.product||'').trim(), dir:r.dir||'in',
      date:(r.date||'').trim(), qty:+r.qty||0, vol:(r.vol||'').trim(), note:(r.note||'').trim()};
  });
  /* 过滤空行（产品+仓库+数量都空） */
  var useful=rows.filter(function(r){ return r.product || r.wh || r.qty; });
  if(!useful.length){toast('请至少添加一条产品行（产品/仓库/数量）');return null}
  if(!useful.some(function(r){return r.qty>0})){toast('请至少一条产品行填了数量');return null}
  /* 自动补仓库：每行按 (pid, 产品) 猜（用户没填则猜，已填不动） */
  useful.forEach(function(r){
    if(!r.wh){ var g=_v9ioGuessWh(pid, r.product); if(g) r.wh=g; }
  });
  if(!useful.some(function(r){return r.wh})){toast('请至少一条产品行选择仓库');return null}
  /* extraNote 留空（V9.1 sheet3 不写入采购/销售合同号、销售端下家、司机信息） */
  var fullBaseNote=(note?note:'');
  return {pid:pid,buy:buy,sale:sale,note:note,baseNote:fullBaseNote,extraNote:'',
    customers:customers,drv:'',rows:useful,ts:Date.now()};
}

/* 真正写入（确认后）— 把 rows[] 每行生成一条 ioItem + sheet */
function ioFormV9Save(){
  var d=state.ioFormDraft;
  if(!d) return false;
  var ts=d.ts||Date.now(), idPrefix='v9_'+ts+'_';
  function buildItem(row){
    var isIn=row.dir==='in';
    var rowNote=row.note||'';
    var fullNote=(d.baseNote?d.baseNote:'')+(rowNote?' · '+rowNote:'')+(d.extraNote?' · '+d.extraNote:'');
    var li={id:idPrefix+Math.random().toString(36).slice(2,6),type:isIn?'in':'out',
      date:row.date||today(),wh:row.wh,item:row.product||'',qty:row.qty,price:'',cur:'',
      project:d.pid,note:fullNote};
    /* contract/buy/sale：V9.1 sheet3 不写入（这些字段在 sheet3 主台账不涉及） */
    return {li:li, sheet:{dir:isIn?'入':'出',date:li.date,pid:d.pid,
      contract:'',model:row.product||'',wh:row.wh,qty:row.qty,
      amt:0,price:0,buy:'',sale:'',cur:'',vol:row.vol||'',note:li.note,ts:ts}};
  }
  var items=[], sheets=[];
  d.rows.forEach(function(r){
    if(!r.qty) return;
    var a=buildItem(r);
    items.push(a.li); sheets.push(a.sheet);
  });
  setIo(getIo().concat(items));
  /* 1) 写入本地 v9io_pending 队列（页面立即可见） */
  var allPending=getV9ioPending().concat(sheets);
  setV9ioPending(allPending);
  state.ioFormDraft=null; state.ioFormStep='form';
  /* 2) 自动复制刚保存的 sheets（仅本次新增的部分，不是历史累积）到剪贴板 */
  var clipTxt=JSON.stringify(sheets,null,2);
  var _wr=getV9ioWebhook();
  var _direct=!!(_wr.mode&&_wr.url&&sheets.length);
  if(_direct){
    _copyText(clipTxt);
    toast('⏳ 已保存 '+items.length+' 条，正在直写 V9.1 多维表格…');
  }else{
    _copyText(clipTxt).then(function(ok){
      if(ok){ toast('已保存 '+items.length+' 条出入库 + 已自动复制同步 JSON 到剪贴板。\n回 WorkBuddy 对话告诉我：「同步上面」\n我立即用 kdocs 写入 V9.1 多维表格 sheet 3 / sheet 30。'); }
      else   { toast('已保存 '+items.length+' 条出入库（自动复制失败，请手动复制顶部「待同步」卡片的 JSON）'); }
    });
  }
  /* 3) 不关 modal —— 改为在模态底部渲染 ionConfirmPanel，复用预通知那套结果弹窗
        （v48：写入结果页 必须在模态内显示，不能只 toast 一下就关——辉哥 17:59 反馈） */
  render();

  if(_direct){
    _ionWrite(sheets, _wr, ts, sheets.length);
  }else{
    /* 没有可用通道：直接给失败页（数据已本地 + 剪贴板） */
    _ionWriteResult({ok:false,succ:[],fail:sheets.map(function(s){return {sheet:s,err:'未配置 V9.1 直写通道（数据已存待同步区，JSON 已复制到剪贴板）'};})}, sheets, null, ts, sheets.length);
  }
  return true;
}
/* ============= 识别录入（页面内自动 OCR） =============
   工作流：用户上传图片/PDF → 页面内自动调 Tesseract 引擎（本地，无需联网）→ 自动解析字段 →
   「填充到新增出入库」关闭此 modal、自动唤醒 ioFormV9 并预填。
   兜底：识别失败或准确率低时，仍可手动粘贴 OCR 文本后「重解析字段」。 */
var OCR_LANG='chi_sim'; // 中文简
/* 关键：必须用「绝对 URL」+ workerBlobURL:false。

   corePath 以 / 结尾 → 引擎会拼成 <base>vendor/tesseract-core-simd.wasm.js
   langPath 不以 / 结尾 → 会拼成 <base>vendor/tessdata/chi_sim.traineddata.gz */

  /* 纯字符串算「当前页面所在目录的绝对 URL」，不依赖 new URL（部分 WebView 里 URL 行为不一致） */
  try{
    var h=String(location.href||'').split('?')[0].split('#')[0];
    return h.substring(0, h.lastIndexOf('/')+1);
  }catch(_){ return ''; }
}
function _ocrOpts(){
  var b=_ocrBase();
  return {
    workerPath: b+'vendor/worker.min.js',
    corePath:   b+'vendor/',
    langPath:   b+'vendor/tessdata',
    workerBlobURL:false,
    gzip:true
  };
}

      var _ok=await new Promise(function(res){
        var t0=setTimeout(function(){ res({ok:false,errs:['引擎加载超时（30 秒）']}); }, 30000);

    if(isImg){
      imgSrc=url;
      _setUI(8,'已选图片，准备识别…');
    } else {
      _setUI(5,'PDF 转首页图片…');
      if(!window.__pdfjsLib){ _setUI(0,'PDF 引擎未就绪，刷新重试'); if(cancel) cancel.style.display='none'; prog.style.display='none'; _ocrShowDiag('PDF 引擎未就绪','请点击「重试加载引擎」或刷新页面'); return; }

  }catch(e){
    done=true;
    console.error(e);
    if(prog) prog.style.display='none';
    if(cancel) cancel.style.display='none';
    var msg=(e&&e.message)||String(e)||'未知错误';
    /* 常见原因先本地化翻译，别让辉哥看英文堆栈 */

    else if(/wasm|core/i.test(msg)) msg='WASM 引擎核加载失败';
    else if(/lang|traineddata|chi_sim/i.test(msg)) msg='中文语言包（chi_sim）加载失败';

  }

async function _pdfFirstPageToImg(file, onStep){
  var buf=await file.arrayBuffer();
  if(onStep) onStep('PDF 解码…',0.1);
  var pdf=await window.__pdfjsLib.getDocument({data:buf}).promise;
  if(onStep) onStep('PDF 第 1 页渲染…',0.4);
  var page=await pdf.getPage(1);
  var vp=page.getViewport({scale:2.0});
  var canvas=document.createElement('canvas');
  canvas.width=Math.ceil(vp.width); canvas.height=Math.ceil(vp.height);
  var ctx=canvas.getContext('2d');
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  if(onStep) onStep('PDF 已转图片',1.0);
  return canvas.toDataURL('image/png');
}

function parseOcrTxt(txt){
  txt=txt||''; var out={_raw:txt};
  /* OCR 容错：去除常见误识（如空格、断句），统一全角符号 */
  var norm=txt.replace(/[，、。；：]/g,' ').replace(/[Oo]/g, o=> /[A-Za-z]/.test(o)?'O':'0').replace(/\s+/g,' ');
  /* 日期：YYYY-MM-DD / YYYY/MM/DD / YYYY.MM.DD / 2024年08月31日 */
  var dm=norm.match(/\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?/);
  if(dm){out.date=dm[0].replace(/[年月]/g,'-').replace(/\./g,'-').replace(/\//g,'-').replace(/日$/,'');
    var dy=out.date.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(dy) out.date=dy[1]+'-'+dy[2].padStart(2,'0')+'-'+dy[3].padStart(2,'0');
  }
  /* 项目号：标准 LB-2026-078 / 外贸 LB-2026-J-024；OCR 误识空格也容错 */
  var pidm=norm.match(/LB[- ]?(\d{4})[- ]?(J[- ]?)?[- ]?(\d{2,4})/i);
  if(pidm){out.year=pidm[1]; out.foreign=!!pidm[2]; out.no=pidm[3];
    out.pid='LB-'+pidm[1]+(pidm[2]?'-J':'')+'-'+pidm[3];
  }
  /* 采购合同号：以常见前缀开头（RF / SJ / XSHT 等），容忍 OCR 空格 */
  var buyPat=/(?:采购合同号[:：\s]*|合同号[:：\s]*|RF[- ]?(?:LB|LB)[- ]?\d+[- ]?[A-Z]?|SJ[- ]?LB[- ]?\d+|XSHT\d+|RF\d+)([\w\-]+)/i;
  var bm=norm.match(buyPat);
  if(bm) out.buy=bm[1].replace(/[^A-Z0-9\-]/ig,'');
  else{var b2=norm.match(/(?:采购|采)合同号?[：:\s]*([A-Z0-9][A-Z0-9\-]{4,})/i); if(b2) out.buy=b2[1];}
  /* 销售合同号：RF-LB-240215S / XS-LB-... */
  var sm=norm.match(/(?:销售合同号[:：\s]*|RF[- ]?LB[- ]?\d+[A-Z]?|XS[- ]?LB[- ]?\d+[A-Z]?|KY[- ]?LB[- ]?\d+|JZ[- ]?LB[- ]?\d+)([\w\-]+)/i);
  if(sm) out.sale=sm[1];
  else{var s2=norm.match(/销售合同号?[：:\s]*([A-Z0-9][A-Z0-9\-]{4,})/i); if(s2) out.sale=s2[1];}
  /* 数量：1,200 件 / 200台 / 拾 等 */
  var qm=norm.match(/(\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?)\s*(件|台|箱|只|个|颗|pcs|PCS)/);
  if(qm) out.qty=parseFloat(qm[1].replace(/,/g,''));
  /* 仓库：关键词匹配（兼容 OCR 误差：去空格匹配） */
  var txtNoSpace=norm.replace(/\s+/g,'');
  ['邦达凤岗仓','邦达香港仓','新宁东莞仓','新宁武汉仓','海晨武汉仓','中电虎门仓','中电石岩仓','邦达清溪仓','虚拟仓','邦达仓','新宁仓','中电仓'].forEach(function(w){
    if(!out.wh && txtNoSpace.indexOf(w)>=0) out.wh=w;
  });
  /* 方向：入库/出库（先出后入，回避"送货入仓"被误判为入） */
  if(/出库/.test(txt)) out.dir='出';
  else if(/入库/.test(txt)) out.dir='入';
  /* 金额（备用）：¥ / 元 等 */
  var am=norm.match(/[¥￥]\s*(\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?)/);
  if(am) out.amt=parseFloat(am[1].replace(/,/g,''));
  return out;
}
function ocrShowParsed(){
  var txt=val('ocrText'); if(!txt){toast('请先粘贴 OCR 文本');return;}
  var p=parseOcrTxt(txt);
  state.ocrDraft=p;
  _renderOcrParsed(p, txt);
}
/* 智能匹配：根据解析字段在 V9 数据里找最贴近的合同/产品/库存 */
function _matchOcrToInventory(p){
  var hits=[];
  var V9=window.V9;
  if(!V9 || !(V9.inventory||{}).sheet2_brief){
    state._ocrMatch=null;
    return;
  }
  var briefs=V9.inventory.sheet2_brief||[];
  var qty=p.qty?p.qty:null;
  var pid=(p.pid||'').toUpperCase();
  var buy=(p.buy||'').toUpperCase();
  var sale=(p.sale||'').toUpperCase();
  briefs.forEach(function(b){
    var score=0;
    if(pid && b.pid && String(b.pid).toUpperCase()===pid) score+=60;
    else if(pid && b.pid && String(b.pid).toUpperCase().indexOf(pid)>=0) score+=30;
    if(buy && b.buy && String(b.buy).toUpperCase().indexOf(buy)>=0) score+=50;
    if(sale && b.sale && String(b.sale).toUpperCase().indexOf(sale)>=0) score+=50;
    if(qty && b.qty && Math.abs(Number(b.qty)-qty)<Math.max(qty*0.2,5)) score+=15;
    if(b.wh && p.wh && String(b.wh).indexOf(p.wh)>=0) score+=10;
    if(score>=30) hits.push({score:score,b:b});
  });
  hits.sort(function(a,b){return b.score-a.score;});
  state._ocrMatch=hits.slice(0,3);
}

/* ===== V9.1 多维表格 → Excel(.xlsx) 导出（零依赖：内联 ZIP store + SpreadsheetML） ===== */
function _xlsxCol(n){var s='';n=n+1;while(n>0){var r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
function _xlsxEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function _xlsxSheetName(s){s=String(s);var bad=':\\/?*[]';var out='';for(var i=0;i<s.length;i++){if(bad.indexOf(s[i])<0)out+=s[i];}return out.slice(0,31)||'Sheet';}
function _xlsxCell(ref,val){
  if(val===null||val===undefined||val==='') return '<c r="'+ref+'"/>';
  if(typeof val==='number' && isFinite(val)){ return '<c r="'+ref+'"><v>'+val+'</v></c>'; }
  return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+_xlsxEsc(val)+'</t></is></c>';
}
function _xlsxSheet(rows){
  var xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  xml+='<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  for(var r=0;r<rows.length;r++){ var row=rows[r], rn=r+1; xml+='<row r="'+rn+'">';
    for(var c=0;c<row.length;c++){ xml+=_xlsxCell(_xlsxCol(c)+rn, row[c]); } xml+='</row>'; }
  xml+='</sheetData></worksheet>';
  return xml;
}
var _crcT=(function(){var c,t=[];for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=(c>>>0);}return t;})();
function _crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=_crcT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function _u8(s){return new TextEncoder().encode(s);}
function _ba(){this.parts=[];this.len=0;}
_ba.prototype.u8=function(a){this.parts.push(a);this.len+=a.length;};
_ba.prototype.str=function(s){var a=_u8(s);this.parts.push(a);this.len+=a.length;};
_ba.prototype.u16=function(v){var b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);this.parts.push(b);this.len+=2;};
_ba.prototype.u32=function(v){var b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);this.parts.push(b);this.len+=4;};
_ba.prototype.bytes=function(){var o=new Uint8Array(this.len),p=0;for(var i=0;i<this.parts.length;i++){o.set(this.parts[i],p);p+=this.parts[i].length;}return o;};
function _zipStore(files){
  var locals=[],centrals=[],offset=0;
  for(var i=0;i<files.length;i++){
    var nameB=_u8(files[i].name), data=files[i].data, crc=_crc32(data);
    var lh=new _ba();
    lh.u32(0x04034b50);lh.u16(20);lh.u16(0x0800);lh.u16(0);lh.u16(0);lh.u16(0);
    lh.u32(crc);lh.u32(data.length);lh.u32(data.length);lh.u16(nameB.length);lh.u16(0);lh.str(files[i].name);lh.u8(data);
    var lhB=lh.bytes(); locals.push(lhB);
    var ch=new _ba();
    ch.u32(0x02014b50);ch.u16(20);ch.u16(20);ch.u16(0x0800);ch.u16(0);ch.u16(0);ch.u16(0);
    ch.u32(crc);ch.u32(data.length);ch.u32(data.length);ch.u16(nameB.length);ch.u16(0);ch.u16(0);ch.u16(0);ch.u16(0);ch.u32(0);ch.u32(offset);ch.str(files[i].name);
    centrals.push(ch.bytes()); offset+=lhB.length;
  }
  var cdLen=0; for(var j=0;j<centrals.length;j++)cdLen+=centrals[j].length;
  var eo=new _ba();
  eo.u32(0x06054b50);eo.u16(0);eo.u16(0);eo.u16(files.length);eo.u16(files.length);eo.u32(cdLen);eo.u32(offset);eo.u16(0);
  var total=offset+cdLen+eo.bytes().length, out=new Uint8Array(total),o=0;
  for(var a=0;a<locals.length;a++){out.set(locals[a],o);o+=locals[a].length;}
  for(var b=0;b<centrals.length;b++){out.set(centrals[b],o);o+=centrals[b].length;}

function buildXlsx(sheets){
  var files=[], i;
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>';
  ct+='<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
  for(i=0;i<sheets.length;i++) ct+='<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
  ct+='<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>';
  files.push({name:'[Content_Types].xml',data:_u8(ct)});
  files.push({name:'_rels/.rels',data:_u8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>')});
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  for(i=0;i<sheets.length;i++) wb+='<sheet name="'+_xlsxEsc(_xlsxSheetName(sheets[i].name))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
  wb+='</sheets></workbook>';
  files.push({name:'xl/workbook.xml',data:_u8(wb)});
  var wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  for(i=0;i<sheets.length;i++) wbr+='<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
  wbr+='</Relationships>';
  files.push({name:'xl/_rels/workbook.xml.rels',data:_u8(wbr)});
  for(i=0;i<sheets.length;i++) files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:_u8(_xlsxSheet(sheets[i].rows))});
  var now=new Date().toISOString();
  files.push({name:'docProps/core.xml',data:_u8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>V9.1 物管数据多维表格</dc:title><dc:creator>小二</dc:creator><cp:lastModifiedBy>小二</cp:lastModifiedBy><dcterms:created xsi:type="dcterms:W3CDTF">'+now+'</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">'+now+'</dcterms:modified></cp:coreProperties>')});
  files.push({name:'docProps/app.xml',data:_u8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>小马工作台</Application></Properties>')});
  return new Blob([_zipStore(files)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function v9DlXlsx(){
  /* 2026-09-07 辉哥要求：只导出 sheet 2 合同详情 + sheet 3 出入库，按 V9.1 多维表格原表结构（列名/列顺序按 schema）。
     实现：调 server.py /api/v91/raw?sid=2|3 拉 raw records + schema，按 schema 字段顺序铺 xlsx。*/
  var wh=getV9ioWebhook();
  if(!wh||!wh.url){ toast('请先在「数据 & 设置」配置 V9.1 直写通道'); return; }
  toast('正在拉取 V9.1 多维表格原始数据…');
  var base=wh.url.replace(/\/+$/,''), H=_ioAuthHeaders(false);
  var fetchRaw=function(sid){
    return fetch(base+'/api/v91/raw?sid='+sid,{headers:H,cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('sheet '+sid+' HTTP '+r.status);
      return r.json();
    });
  };
  var s2, s3;
  try{
    s2=await fetchRaw(2);
    s3=await fetchRaw(3);
  }catch(e){
    toast('拉取失败：'+(e&&e.message||'')+' · 请检查 V9.1 直写通道是否可达');
    return;
  }
  // 按 schema 字段顺序铺 rows（表头=field.name，单元格按 field.raw_name||field.name 取值）
  function _normRow(rec, fields){
    var flds=rec.fields||{}, row=[];
    for(var i=0;i<fields.length;i++){
      var f=fields[i];
      var k=f.raw_name||f.name;
      var v=flds[k];
      if(v===undefined && f.name!==k) v=flds[f.name];
      if(v===null||v===undefined) v='';
      if(Array.isArray(v)) v=v.join('/');
      if(typeof v==='object') v=JSON.stringify(v);
      row.push(v);
    }
    return row;
  }
  var sheets=[];
  // 第 1 张：合同详情
  sheets.push({name:'合同详情', rows:[s2.fields.map(function(f){return f.name;})].concat(
    (s2.records||[]).map(function(r){return _normRow(r,s2.fields);})
  )});
  // 第 2 张：出入库
  sheets.push({name:'出入库', rows:[s3.fields.map(function(f){return f.name;})].concat(
    (s3.records||[]).map(function(r){return _normRow(r,s3.fields);})
  )});
  try{
    var blob=buildXlsx(sheets);
    var name='V9.1多维表格_'+today()+'.xlsx';
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2500);
    toast('已下载 '+name+'（合同详情 '+s2.count+' 行 · 出入库 '+s3.count+' 行，'+Math.round(blob.size/1024)+' KB）');
  }catch(e2){
    toast('Excel 生成失败：'+(e2&&e2.message||''));
  }
}
/* ===== 仓库盘点表（2026-09-07 新增）=====
   v9DlInv → 弹模态列 sheet2 出现的所有「最后一个仓库」供选择
   _v9InvGen → 选定仓库后筛合同详情现有库存，调 _xlsxInvBuild 生成 xlsx
   _xlsxInvBuild → 自包含 styles.xml + mergeCells（5 跨 8 列合并），单 sheet「库存盘点表」 */
async function v9DlInv(){
  var wh=getV9ioWebhook();
  if(!wh||!wh.url){ toast('请先在「数据 & 设置」配置 V9.1 直写通道'); return; }
  toast('正在拉取合同详情用于仓库盘点…');
  var s2;
  try{
    var r=await fetch(wh.url.replace(/\/+$/,'')+'/api/v91/raw?sid=2',{headers:_ioAuthHeaders(false),cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    s2=await r.json();
  }catch(e){ toast('拉取失败：'+(e&&e.message||'')+' · 请检查 V9.1 直写通道是否可达'); return; }
  if(!s2||!s2.fields){ toast('合同详情表数据格式异常'); return; }
  /* 字段模糊匹配（兼容带空格/特殊字符的真实字段名） */
  function findField(re){ return s2.fields.find(function(f){return re.test(f.name||'')||re.test(f.raw_name||'');}); }
  var whF=findField(/^仓库\s*$/);
  var prodF=findField(/^产品(?!类型)/);
  var pidF=findField(/项目号/);
  /* V9.1 真实字段（2026-09-07 实拉 schema）：库存(Formula, 0=合同完结) / 单价（元）(Currency) */
  var qtyF=findField(/^库存\s*$/)||findField(/库存数量|现有数量|^数量$/);
  var priceF=findField(/^单价（元）/)||findField(/^单价/);
  var priceUsdF=findField(/^单价（美元）/)||findField(/单价.*美元/);
  if(!whF){ toast('合同详情表未找到「仓库」字段（请检查 sheet 2 schema）'); return; }
  if(!qtyF){ toast('合同详情表未找到「库存」字段（请检查 sheet 2 schema）'); return; }
  var whK=whF.raw_name||whF.name, prodK=prodF?(prodF.raw_name||prodF.name):'', pidK=pidF?(pidF.raw_name||pidF.name):'', qtyK=qtyF?(qtyF.raw_name||qtyF.name):'';
  var priceK=priceF?(priceF.raw_name||priceF.name):'';
  var priceUsdK=priceUsdF?(priceUsdF.raw_name||priceUsdF.name):'';
  /* 库存为 0 → 合同已完结，不在统计维度（辉哥规则） */
  function done(r){ return _v9InvNum((r.fields||{})[qtyK])<=0; }
  /* 收集「最后一个仓库」+ 计数（多值分隔：中文逗号/分号/顿号/斜线 → 取末段） */
  var whMap={};
  (s2.records||[]).forEach(function(rec){
    if(done(rec)) return;   /* 库存=0（已完结）不进统计维度 */
    var v=(rec.fields||{})[whK];
    if(v===undefined||v===null||v==='') return;
    if(Array.isArray(v)) v=v.join(',');
    var parts=String(v).replace(/[，；、\/]/g,',').split(',').map(function(x){return x.trim();}).filter(Boolean);
    var last=parts[parts.length-1]; if(!last) return;
    whMap[last]=(whMap[last]||0)+1;
  });
  var whList=Object.keys(whMap).sort(function(a,b){return whMap[b]-whMap[a]});
  if(!whList.length){ toast('合同详情表没有任何仓库数据'); return; }
  var body=
    '<div style="font-size:12.5px;color:var(--t3);margin-bottom:14px;line-height:1.7">从 V9.1 合同详情筛出该仓库的现有库存并下载 Excel 盘点表。<br>仓库列含多个值时，<b>以最后一个为统计维度</b>。</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;padding-right:4px">'+
    whList.map(function(w,i){
      return '<label style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--sky-s);cursor:pointer">'+
        '<input type="radio" name="v9InvWh" value="'+esc(w)+'" '+(i===0?'checked':'')+'>'+
        '<span style="flex:1;font-weight:600">'+esc(w)+'</span>'+
        '<span style="color:var(--t3);font-size:12.5px">'+whMap[w]+' 条</span>'+
      '</label>';
    }).join('')+
    '</div>';
  openModal('仓库盘点表 · 选择仓库', body, '生成 Excel', function(){
    var checked=document.querySelector('input[name="v9InvWh"]:checked');
    if(!checked){ toast('请选择一个仓库'); return false; }
    var sel=checked.value;
    /* 立即关模态，后台生成 */
    setTimeout(function(){
      try{ _v9InvGen(s2, whK, prodK, pidK, qtyK, sel, priceK, priceUsdK); }
      catch(err){ toast('生成失败：'+(err&&err.message||'')); }
    }, 50);
    return true;
  }, {icon:'box'});
}
/* 库存/单价数值解析：容错逗号/空格/字符串数字；无效视为 0（0=已完结不入盘点） */
function _v9InvNum(x){ if(x===undefined||x===null||x==='') return 0; var n=parseFloat(String(x).replace(/[,，\s]/g,'')); return isNaN(n)?0:n; }
function _v9InvGen(s2, whK, prodK, pidK, qtyK, selWh, priceK, priceUsdK){
  var rows=[];
  (s2.records||[]).forEach(function(rec){
    var flds=rec.fields||{};
    if(_v9InvNum(flds[qtyK])<=0) return;   /* 库存=0（合同已完结）不入盘点 */
    var v=flds[whK]; if(v===undefined||v===null||v==='') return;
    if(Array.isArray(v)) v=v.join(',');
    var parts=String(v).replace(/[，；、\/]/g,',').split(',').map(function(x){return x.trim();}).filter(Boolean);
    var last=parts[parts.length-1]||'';
    if(last!==selWh) return;
    function get(k){var x=flds[k]; if(x===undefined||x===null||x==='') return ''; if(Array.isArray(x)) return x.join('/'); if(typeof x==='object') return JSON.stringify(x); return x;}
    /* 价格规则：单价（元）有数据 → ¥人民币；单价（元）空白且单价（美元）有数据 → $美金 */
    var cny=_v9InvNum(flds[priceK]), usd=_v9InvNum(flds[priceUsdK]);
    var prTxt='';
    if(cny>0)       prTxt='¥'+(Math.round(cny*100)/100);
    else if(usd>0)  prTxt='$'+(Math.round(usd*100)/100);
    rows.push([rows.length+1, get(pidK), get(prodK), prTxt, '', get(qtyK), '', '']);
  });
  if(!rows.length){ toast('所选仓库没有匹配的合同记录'); return; }
  var d=new Date();
  var todayCN=d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日';
  var blob=_xlsxInvBuild(rows, selWh, todayCN);
  var name='库存盘点表_'+selWh+'_'+today()+'.xlsx';
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2500);
  toast('已下载 '+name+'（'+rows.length+' 条记录，'+Math.round(blob.size/1024)+' KB）');
}
/* 仓库盘点表 xlsx 生成器（自包含 styles.xml + 合并表头/表尾）
   行 1: 标题「武汉联博光电科技有限公司」（A1:H1 合并）
   行 2: 副标题「库存物品盘点表」（A2:H2 合并）
   行 3: 日期（A3:D3 合并·居左）+ 仓库（E3:H3 合并）
   行 4: 8 列表头（序号/项目号/产品规格/价格/单位/库存数量/实际数量/备注）
   行 5..(4+N): 数据（序号右对齐数字，其余左对齐带边框）
   行 (5+N): 签字行「盘点人：… 复核人：… 仓库管理员：…」（A..:H.. 合并） */

      '</borders>'+
      '<cellXfs count="8">'+
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
        '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'+
        '<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'+
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>'+
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" wrapText="1"/></xf>'+
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>'+
      '</cellXfs>'+
    '</styleSheet>';
  var sh='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<cols>'+
        '<col min="1" max="1" width="7"  customWidth="1"/>'+

        '<col min="4" max="4" width="12" customWidth="1"/>'+
        '<col min="5" max="5" width="8"  customWidth="1"/>'+
        '<col min="6" max="6" width="14" customWidth="1"/>'+
        '<col min="7" max="7" width="14" customWidth="1"/>'+
        '<col min="8" max="8" width="24" customWidth="1"/>'+
      '</cols>'+
      '<sheetData>';
  function sc(ref,val,style,isNum){
    if(val===''||val===null||val===undefined) return '<c r="'+ref+'" s="'+style+'"/>';
    if(isNum) return '<c r="'+ref+'" s="'+style+'"><v>'+val+'</v></c>';
    return '<c r="'+ref+'" s="'+style+'" t="inlineStr"><is><t xml:space="preserve">'+_xlsxEsc(val)+'</t></is></c>';
  }
  sh+='<row r="1" ht="36" customHeight="1">'+sc('A1','武汉联博光电科技有限公司',1,false)+'</row>';
  sh+='<row r="2" ht="30" customHeight="1">'+sc('A2','库存物品盘点表',2,false)+'</row>';
  sh+='<row r="3" ht="22" customHeight="1">'+
    sc('A3','日期：'+todayCN,7,false)+

  }
  sh+='<row r="'+signRow+'" ht="50" customHeight="1">'+
    sc('A'+signRow,'　　盘点人：　　　　　　　　　　复核人：　　　　　　　　　　仓库管理员：',6,false)+
    sc('B'+signRow,'',6,false)+sc('C'+signRow,'',6,false)+sc('D'+signRow,'',6,false)+
    sc('E'+signRow,'',6,false)+sc('F'+signRow,'',6,false)+sc('G'+signRow,'',6,false)+sc('H'+signRow,'',6,false)+
    '</row>';
  sh+='</sheetData>'+
    '<mergeCells count="5">'+
      '<mergeCell ref="A1:H1"/>'+
      '<mergeCell ref="A2:H2"/>'+
      '<mergeCell ref="A3:D3"/>'+
      '<mergeCell ref="E3:H3"/>'+

    '</workbook>';
  var wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'+

  var now=new Date().toISOString();
  var core='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'+
    '<dc:title>库存盘点表 - '+_xlsxEsc(whName)+'</dc:title>'+

  return new Blob([_zipStore(files)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

  /* --- V9.1 物管数据 --- */
  if(act==='v9sub'){state.v9sub=v;render();return}

  if(act==='v9ioDir'){state.v9ioDir=v;render();v9ioFetchLive(v9ioBuildParams());return}

    var _match=state.qDetailMatch||'模糊';
    if(!_no && _dim!=='pid'){toast('请填写编号');return}
    if(!_no && _dim==='pid'){toast('请填写编号');return}
    var _brief=(V9 && V9.inventory && V9.inventory.sheet2_brief) || [];
    var _found=[];
    var _pid='';
    var _hit=function(val){
      if(!_no) return false;
      if(!val) return false;
      if(_match==='精准') return (val+'').toUpperCase()===_no.toUpperCase();
      return (val+'').toUpperCase().indexOf(_no.toUpperCase())>-1;
    };
    if(_dim==='pid'){
      var _mid=_mode==='外贸'?'-J':'';
      _pid='LB-'+_year+_mid+'-'+_no.padStart(3,'0');
      _found=_brief.filter(function(r){return r.pid===_pid});
    } else if(_dim==='buy'){
      _found=_brief.filter(function(r){return _hit(r.buy)});
    } else if(_dim==='sale'){
      _found=_brief.filter(function(r){return _hit(r.sale)});
    } else if(_dim==='supplier'){
      _found=_brief.filter(function(r){return _hit(r.supplier)});
    } else if(_dim==='customer'){
      _found=_brief.filter(function(r){return _hit(r.customer)});
    }
    /* 预计算每个合同的出入库流水 */
    var _evMap={};
    /* 同 pid 多产品合并：每条合同的 products[] */
    var _seen={};
    var _uniq=[];
    _found.forEach(function(c){
      if(_seen[c.pid]){
        _seen[c.pid].products.push({product:c.product||'', ptype:c.ptype||''});
      } else {
        var cc=Object.assign({}, c);
        cc.products=[{product:c.product||'', ptype:c.ptype||''}];
        _seen[c.pid]=cc;
        _uniq.push(cc);
      }
    });
    _found=_uniq;
    if(_found.length){

      _found.forEach(function(c){

  /* --- 危险操作（先二级密码校验 → 再二次确认） --- */

  /* --- 账号 & 登录 --- */

  if(act==='useBuiltinSrv'){

  }
  /* v45：服务器关机/断网时的兜底入口 —— 只读浏览静态数据（不校验，因为静态数据本就公开） */
  if(act==='loginOffline'){
    var _lu=getLastUser();
    setSess({u:(_lu&&_lu.u)||'guest', name:(_lu&&_lu.name)||'离线浏览', role:'user', src:'offline'});

  if(act==='doLogin'){

    /* v43：登录页的服务器地址有改动则先保存（首次/隧道换地址场景；重绘不影响已读取的 u/p） */
    try{
      var _lgUrl=(val('lgUrl')||'').trim();

    var us=getUsers(), lu=null;
    us.forEach(function(x){if(x.u===u && x.p===p) lu=x});
    var w=getV9ioWebhook();
    var _built=(typeof V9IO_BUILTIN_URL!=='undefined'?V9IO_BUILTIN_URL:'');
    if(!(w && w.url)){ toast('未配置服务器地址：请在上方填 https 地址（或退出重进自动带出）'); return; }
    function _ok(sess){ try{ if(sess.src!=='offline') setLastUser({u:sess.u,name:sess.name,role:sess.role}); }catch(e){} setSess(sess); toast('登录成功：'+(sess.name||sess.u)); state.tab='home'; render(); }
    function _local(){
      var _last=getLastUser();
      if(lu){ _ok({u:lu.u,role:lu.role,name:lu.name||lu.u,src:'local'}); toast('服务器连不上，已用本机账号进入（离线只读）'); }
      else if(_last && _last.u===u){ _ok({u:u,role:_last.role||'user',name:_last.name||u,src:'offline'}); toast('服务器连不上，已用上次的账号离线进入（只读）'); }
      else { toast('连不上服务器，且这台设备没存过「'+u+'」→ 点下方「离线浏览」可先看数据'); try{ _srvDownTip(document.getElementById('lgTip'), w.url, _built); }catch(_e){} }
    }
    /* 连不上时：若内置地址还活着，自动切过去并提示重试（隧道换地址的常见场景） */
    function _fallbackSwitch(){
      if(_built && w.url && w.url!==_built){
        fetch(_built.replace(/\/+$/,'')+'/api/health',{cache:'no-store'})
          .then(function(r){return r.json();})
          .then(function(j){
            if(j && j.ok){ setV9ioWebhook('server',_built,''); toast('原地址已失效，已切到最新服务器地址，请重新点登录'); }
            else { _local(); }
          }).catch(function(){ _local(); });
      } else { _local(); }
    }
    {
      /* v43：服务端在线 → 以 auth.json 为权威（同事账号在此校验，角色由服务端决定） */
      fetch(w.url.replace(/\/+$/,'')+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,body:j};});})
        .then(function(res){
          if(!res.ok){

            if(lu){ _ok({u:lu.u,role:lu.role,name:lu.name||lu.u,src:'local'}); toast('服务端无此账号，已用本机账号进入（离线只读模式）'); }

        })

    }
    return;

  if(act==='userDel'){

/* ================= PWA ================= */
function initPWA(){
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.v55.js').then(function(reg){
      if(!reg) return;
      // 注册后立即主动检查 SW 更新（即使页面长期开着，也能立刻升级到新 SW，拿到最新 data.json）
      try{ if(reg.update) reg.update(); }catch(_){}
      // 检测到新版本已安装 → 自动重载一次，让新页面/新数据立刻生效（sessionStorage 防循环）
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            if(!sessionStorage.getItem('wb_sw_reloaded')){
              sessionStorage.setItem('wb_sw_reloaded','1');
              setTimeout(function(){ location.reload(); },200);
            }
          }
        });
      });
    }).catch(function(){});
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._deferred=e});
}

/* ================= 启动 ================= */
/* 扫码 / 链接自动配置直写通道：打开带 ?wh=<server 公网地址>&wt=<token> 的链接即完成配置。
   用途：本机「一键启动」脚本把隧道地址做成二维码，手机扫一下就配好，不用手工填。
   注意：配置落在「扫码时那个浏览器」的 localStorage，换浏览器（微信/飞书互切）需重新扫。
   这里直接写 meta 而不调 setV9ioWebhook，避免在数据初始化前触发 render()。 */
(function v9ioAutoCfg(){
  try{
    var q=location.search||'';
    var mw=q.match(/[?&]wh=([^&]+)/), mt=q.match(/[?&]wt=([^&]+)/);
    if(!mw) return;
    var url=decodeURIComponent(mw[1]);
    var tok=mt?decodeURIComponent(mt[1]):'';
    if(url && /^https?:\/\//i.test(url)){
      var m=getMeta();
      m.v9ioWhMode='server';
      m.v9ioWebhookUrl=url;
      m.v9ioWebhookToken=tok;
      setMeta(m);
      try{ localStorage.setItem('v9io_autocfg_at', new Date().toISOString().slice(0,19).replace('T',' ')); }catch(e){}
      /* 清掉地址栏参数：避免刷新重复触发，也避免 token 留在浏览器历史里 */
      try{ history.replaceState({}, '', location.pathname + (location.hash||'')); }catch(e){}
    }
  }catch(e){}
})();

initPWA();
