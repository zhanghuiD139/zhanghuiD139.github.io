<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>小马工作台</title>
<meta name="theme-color" content="#FF8A00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小马工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFCF4; --card:#FFFFFF;
  --line:var(--ac-l); --line2:#FFD49A;
  --t1:#2E2314; --t2:#7C6144; --t3:#B3987A;
  --ac:#FF8A00; --ac2:#FFB020;
  --ac-g:linear-gradient(135deg,#FFC02E 0%,#FF8A00 100%);
  --ac-s:#FFF3E0; --ac-l:#FFD9A0;
  --red:#FF5A5F; --red-s:#FFECEC; --red-l:#FFC7C9;
  --green:#12B981; --green-s:#E4F9F1;
  --amber:#F5A300; --amber-s:#FFF7E4;
  --pink:#FF6B9D; --pink-s:#FFEBF2;
  --sky:#2CB4E8; --sky-s:#E4F5FD;
  --violet:#9B7BFA; --violet-s:#F0EBFF;
  --r:14px; --sh:0 2px 10px rgba(255,138,0,.07);
  --bodybg:radial-gradient(1100px 560px at 8% -10%, #FFEFCC 0%, rgba(255,239,204,0) 62%),radial-gradient(880px 480px at 102% -4%, #FFE4DE 0%, rgba(255,228,222,0) 58%),radial-gradient(760px 420px at 50% 108%, #E6FBF3 0%, rgba(230,251,243,0) 60%);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--t1);
  background-image:var(--bodybg);
  background-attachment:fixed; background-size:cover; background-position:center;
  font-size:14.5px; line-height:1.6; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;color:var(--t1)}
button{cursor:pointer;background:none;border:none}
.hide{display:none !important}
::selection{background:var(--ac-l)}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:236px;flex:0 0 236px;padding:20px 14px;
  background:var(--veil);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo-badge{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--ac-g);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 11px rgba(255,138,0,.34);
}
.logo h1{font-size:14.5px;font-weight:650;letter-spacing:-.02em;line-height:1.3}
.logo p{font-size:11.5px;color:var(--t3);font-weight:450}
/* 月度柱图 hover 浮层：纯 CSS 立即响应（SVG 原生 <title> 需悬停 1~2s 且部分浏览器/手机 WebView 不显示） */
.iobar{position:absolute;top:0;bottom:22px;cursor:pointer}
.iotip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:#3D2C12;color:#fff;font-size:11.5px;line-height:1.65;padding:7px 10px;border-radius:8px;z-index:30;
  box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}
.iobar:hover .iotip{display:block!important}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  font-weight:500;font-size:14px;color:var(--t2);text-align:left;width:100%;min-height:38px;transition:.12s;
}
.nav button:hover{background:var(--w1);color:var(--t1)}
.nav button.on{background:var(--ac-g);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(255,138,0,.3)}
.side-foot{margin-top:auto;padding-top:18px}
.side-foot .tip{font-size:11.5px;color:var(--t3);line-height:1.6;margin-top:10px;font-weight:450}

.main{flex:1;min-width:0;padding:26px 28px 48px}
.topbar{display:none}
.page{max-width:1000px;margin:0 auto}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:21px;font-weight:650;letter-spacing:-.025em;display:flex;align-items:center;gap:9px}
.page-head .sub{font-size:12.5px;color:var(--t3);font-weight:450}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;margin-bottom:16px;position:relative;
  box-shadow:var(--sh);
}
.card.tint-r{background:var(--red-s);border-color:var(--red-l)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;color:var(--t1)}

.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:6px;background:var(--w2);color:var(--amber-t);white-space:nowrap;line-height:1.55;
}
.pill.red{background:var(--red-s);color:var(--red-t)}
.pill.green{background:var(--green-s);color:#0A9E6C}
.pill.blue{background:var(--sky-s);color:var(--sky-t)}
.pill.yellow,.pill.orange{background:var(--w1);color:var(--amber-t)}
.pill.gray{background:var(--w2);color:var(--t2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line2);
  background:var(--card);font-weight:550;font-size:13.5px;color:var(--t1);transition:.12s;white-space:nowrap;
}
.btn:hover{background:var(--w1);border-color:var(--ac-l)}
.btn:active{transform:scale(.985)}
.btn.p{background:var(--ac-g);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(255,138,0,.3)}
.btn.p:hover{filter:brightness(1.06);box-shadow:0 4px 13px rgba(255,138,0,.38)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.g:hover{background:var(--green);border-color:#0EA372}
.btn.b{background:var(--card);color:var(--sky-t);border-color:var(--line2)}
.btn.b:hover{background:var(--sky-s)}
.btn.y{background:var(--card);color:var(--amber-t);border-color:var(--ac-l)}
.btn.y:hover{background:var(--amber-s)}
.btn.r{background:var(--card);color:var(--red-t);border-color:var(--red-l)}
.btn.r:hover{background:var(--red-s)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.xs{height:27px;padding:0 9px;font-size:12px;border-radius:6px;font-weight:500}
.btn.ghost{border-color:transparent;background:transparent}
/* 选中态：快捷区间/方向筛选等按钮被选中时颜色加深 + 白字 + 加重阴影 */
.btn.on,.btn.sm.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 8px rgba(255,138,0,.32);font-weight:700}
.btn.on:hover,.btn.sm.on:hover{background:var(--ac);border-color:#FF7A00;color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;
  background:var(--card);font-weight:450;font-size:14px;outline:none;transition:.12s;color:var(--t1);
}
textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.65}
input::placeholder,textarea::placeholder{color:#B4BAC4}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #FFE7C4}
label.fl{display:block;font-size:12.5px;font-weight:550;margin:0 0 6px 1px;color:var(--t2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row{margin-bottom:13px}

/* 列表项 */
.item{
  display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);margin-bottom:8px;transition:.12s;
}
.item:hover{border-color:var(--ac-l);box-shadow:0 3px 12px rgba(255,138,0,.10)}
.item.late{background:var(--red-s);border-color:var(--red-l)}
.item.done{opacity:.45}
.item.done .it-title{text-decoration:line-through;color:var(--t3)}
.it-body{flex:1;min-width:0}
.it-title{font-weight:500;font-size:14.5px;word-break:break-word;line-height:1.55}
.it-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.it-act{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;opacity:.55;transition:.12s}
.item:hover .it-act{opacity:1}
.chk{
  width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--inp-b);border-radius:6px;background:var(--card);
  display:flex;align-items:center;justify-content:center;margin-top:3px;transition:.12s;
}
.chk:hover{border-color:var(--ac)}
.chk.on{background:var(--ac-g);border-color:transparent;box-shadow:0 2px 7px rgba(255,138,0,.34)}
.chk svg{opacity:0}
.chk.on svg{opacity:1}

.empty{text-align:center;padding:34px 12px}
.empty p{font-weight:550;margin-top:12px;font-size:13.5px;color:var(--t2)}
.empty span{font-size:12.5px;color:var(--t3)}

.hl{color:var(--red);font-weight:600}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{text-align:center;font-size:11.5px;font-weight:500;color:var(--t3);padding:0 0 6px}
.cal .d{
  aspect-ratio:1/1;border:none;border-radius:8px;background:transparent;
  display:flex;align-items:center;justify-content:center;font-weight:450;font-size:13.5px;
  min-height:38px;position:relative;color:var(--t1);transition:.1s;
}
.cal .d:hover{background:var(--w1)}
.cal .d.out{opacity:0;pointer-events:none}
.cal .d.today{color:var(--amber-t);font-weight:700;background:var(--w2)}
.cal .d.sel{background:var(--ac-g);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(255,138,0,.32)}
.cal .d.sel:hover{background:var(--ac-g)}
.dots{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.dot{width:4px;height:4px;border-radius:50%;background:var(--t3)}
.dot.r{background:var(--red)}
.cal .d.sel .dot{background:rgba(255,255,255,.85)}

.badge{
  min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;
  font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat.stat5{grid-template-columns:repeat(5,1fr)}
.stat .s em{display:block;margin-top:2px;font-style:normal;font-size:11.5px;font-weight:550;color:var(--t3)}
.stat .s{
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--card);
  box-shadow:var(--sh);
}
.stat .s b{display:block;font-size:27px;font-weight:600;line-height:1.15;letter-spacing:-.035em;color:var(--t1)}
.stat .s span{font-size:12.5px;font-weight:450;color:var(--t3);display:block;margin-top:3px}
.stat .s.r b{color:var(--red)}
.stat .s.g b{color:var(--green)}
.stat .s.b b{color:var(--sky)}
.stat .s.y b{color:var(--ac)}
.stat .s.p b{color:var(--violet)}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(78,48,12,.36);backdrop-filter:blur(2px);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;animation:fi .14s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:450px;
  box-shadow:0 18px 48px rgba(120,75,20,.20),0 0 0 1px rgba(255,180,90,.4);
  max-height:88vh;overflow-y:auto;animation:su .16s cubic-bezier(.2,.8,.3,1);
}
@keyframes su{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal h3{font-size:16px;font-weight:650;letter-spacing:-.02em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal .mfoot{display:flex;gap:9px;margin-top:20px}
.modal .mfoot .btn{flex:1;height:38px}

.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:120;
  background:var(--ac-g);color:#fff;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:10px;
  box-shadow:0 8px 24px rgba(255,138,0,.38);max-width:88vw;text-align:center;animation:su .16s ease;
}
.banner{
  border:1px solid var(--ac-l);border-radius:11px;background:var(--ac-s);padding:11px 14px;
  font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--amber-t);
}
.banner .btn{margin-left:auto}
.tabs{display:inline-flex;gap:2px;background:var(--w2);padding:3px;border-radius:10px;margin-bottom:0}
.tabs button{
  padding:0 13px;height:28px;border-radius:6px;background:transparent;font-weight:500;font-size:12.5px;color:var(--t2);transition:.12s;
}
.tabs button:hover{color:var(--t1)}
.tabs button.on{background:var(--card);color:var(--amber-t);font-weight:650;box-shadow:0 1px 3px rgba(255,138,0,.16)}
.kw{
  display:inline-flex;align-items:center;gap:5px;padding:3px 6px 3px 9px;border-radius:7px;
  background:var(--w2);font-size:12.5px;font-weight:450;color:var(--amber-t);margin:0 6px 6px 0;
}
.kw button{color:var(--t3);font-size:14px;line-height:1;padding:0 2px;transition:.1s}
.kw button:hover{color:var(--red)}
.divider{height:1px;background:var(--line);margin:16px 0;border:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.srcline{font-size:12.5px;color:var(--t3);font-weight:450;display:inline-flex;align-items:center;gap:5px}
a{color:var(--ac);font-weight:500;text-decoration:none}
a:hover{text-decoration:underline}
.rowline{padding:11px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none;padding-bottom:0}
.codebox{background:var(--w1);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--t2)}

/* ---------- V9.1 物管数据看板 ---------- */
.v9tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.v9tbl th{text-align:left;color:var(--t3);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.v9tbl td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--t2);vertical-align:top}
.v9tbl tr:last-child td{border-bottom:none}
.v9tbl tbody tr:hover{background:var(--ac-s)}
.v9tbl td.r{color:var(--red);font-weight:650}
.v9tbl td.g{color:var(--green);font-weight:650}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:2px -2px}
.v9tbl.v9io .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.v9tbl.v9io .model{max-width:220px;color:var(--t1)}
.v9tbl.v9io th.num{text-align:right}
.muted{color:#c2b6a4}
.barrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.barrow .bl{width:96px;flex-shrink:0;font-size:12.5px;font-weight:550;color:var(--t2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bartrack{flex:1;height:18px;background:var(--w2);border-radius:9px;overflow:hidden}
.barfill{height:100%;border-radius:9px;background:linear-gradient(90deg,#FFC02E,#FF8A00);transition:width .4s}
.barrow .bv{width:104px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:650;color:var(--t1)}
.bar{height:14px;background:var(--w2);border-radius:9px;overflow:hidden;margin-top:4px}
.bar .barfill{height:100%;border-radius:9px}

/* ---------- 移动端 ---------- */
@media (max-width:860px){
  .side{display:none}
  .main{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
  .topbar{
    display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--veil);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
  }
  .topbar .logo-badge{width:30px;height:30px;flex:0 0 30px;border-radius:8px}
  .topbar h1{font-size:14.5px;font-weight:650;letter-spacing:-.02em}
  .topbar p{font-size:11px;color:var(--t3);font-weight:450}
  .page{padding:18px 16px 12px}
  .page-head{margin-bottom:16px}
  .page-head h2{font-size:19px}
  .stat{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat .s{padding:13px 14px}
  .stat .s b{font-size:24px}
  .grid2,.grid3{grid-template-columns:1fr}
  .card{padding:16px;margin-bottom:13px}
  .btn{height:38px;font-size:14px}
  .btn.sm{height:34px}
  .btn.xs{height:30px;font-size:12.5px}
  input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px;height:44px}
  textarea{height:auto}
  .modal .mfoot .btn{height:44px}
  .it-act{opacity:1}
  .btm{
    position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
    background:var(--veil);backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);padding:5px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .btm button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;
    font-size:10.5px;font-weight:500;color:var(--t3);min-height:48px;border-radius:8px;position:relative;
  }
  .btm button.on{color:var(--ac)}
  .btm .badge{position:absolute;top:2px;right:calc(50% - 20px);transform:scale(.8)}
  .toast{bottom:104px}
  .cal .d{min-height:40px;font-size:14px;border-radius:9px}
  .tabs{display:flex;width:100%}
  .tabs button{flex:1;height:32px}
}
@media (min-width:861px){ .btm{display:none} }
.ext-card{position:relative;background:var(--card)}
.ext-frame{width:100%;height:78vh;border:0;display:block;background:#fff}
.ext-fb{display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:48px 24px;min-height:78vh;background:var(--card)}
.ext-fb-ic{font-size:44px;line-height:1}
.ext-fb-t{font-size:19px;font-weight:700;color:var(--t1)}
.ext-fb-d{font-size:13px;color:var(--t2);max-width:480px;line-height:1.8}
.btn.big{padding:12px 22px;font-size:15px;margin-top:4px}
/* 详情查询：合同分组折叠 */
.qd-group{border:1px solid var(--ac-l);border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:10px}
.qd-g-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--w1);cursor:pointer;user-select:none;font-size:13.5px;flex-wrap:wrap}
.qd-g-h:hover{background:var(--w1)}
.qd-g-h.open{background:var(--w2);border-bottom:1px solid var(--ac-l)}
.qd-g-arr{font-size:14px;color:var(--ac);width:14px;flex-shrink:0}
.qd-g-pid{font-weight:700;color:var(--ac);font-family:Menlo,Consolas,monospace;font-size:14px}
.qd-g-sub{color:var(--t2);font-size:12.5px}
.qd-g-status{margin-left:auto;font-weight:700}
.qd-g-b{padding:14px 16px}
.qd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin-bottom:12px}
.qd-kv{display:flex;gap:10px;font-size:13px;line-height:1.85;align-items:flex-start}
.qd-kv-wide{grid-column:1/-1}
.qd-k{color:var(--t3);flex-shrink:0;min-width:80px}

<!-- OCR 引擎：Tesseract.js v5 + PDF.js v4 按需加载，避免拖慢首屏 -->
<script>
  /* 当用户点开「识别录入」时再异步加载识别引擎（~2MB 中文包 + 4.6MB wasm），不影响首屏。
     注意：动态创建的 <script type="module"> 设 textContent 浏览器**不会执行**，
     必须用 Blob URL 才能可靠加载 ESM（PDF.js v4 是 ESM）。 */
  window.__ocrErr=[];
  window.__loadOcrEngine=function(cb){
    var tasks=[], errs=[];
    function done(){
      window.__ocrErr=errs;
      cb(!!(window.Tesseract && window.__pdfjsLib), errs);
    }
    // 绝对 URL（相对当前页面目录），避免子路径部署时解析错
    var BASE='';
    try{ BASE=new URL('./', location.href).href; }catch(_){}
    if(!window.__pdfjsLib){
      tasks.push(function(n){
        try{
          var code="import * as __p from '"+BASE+"vendor/pdf.min.mjs';"+
            "__p.GlobalWorkerOptions.workerSrc='"+BASE+"vendor/pdf.worker.min.mjs';"+
            "window.__pdfjsLib=__p;";
          var b=new Blob([code],{type:'text/javascript'});
          var url=URL.createObjectURL(b);
          var s=document.createElement('script');
          s.type='module';
          s.src=url;
          s.onload=function(){ try{URL.revokeObjectURL(url);}catch(_){} n(); };
          s.onerror=function(e){ errs.push('pdf.js 加载失败（'+BASE+'vendor/pdf.min.mjs）'); n(); };
          document.head.appendChild(s);
        }catch(e){ errs.push('pdf.js 注入异常：'+e.message); n(); }
      });
    }
    if(!window.Tesseract){
      tasks.push(function(n){
        var s=document.createElement('script');
        s.src=BASE+'vendor/tesseract.min.js';
        s.onload=function(){ n(); };
        s.onerror=function(){ errs.push('tesseract.min.js 加载失败（'+BASE+'vendor/tesseract.min.js）'); n(); };
        document.head.appendChild(s);
      });
    }
    if(!tasks.length){ return done(); }
    var pending=tasks.length;
    tasks.forEach(function(t){ t(function(){ if(--pending===0) done(); }); });
  };
  /* 诊断：逐个 HEAD 检查 OCR 依赖资源，返回状态数组（用于错误面板定位） */
  window.__ocrDiag=function(cb){
    var BASE='';
    try{ BASE=new URL('./', location.href).href; }catch(_){}
    var list=[['引擎 tesseract.min.js','vendor/tesseract.min.js'],['worker.min.js','vendor/worker.min.js'],
      ['WASM 核（SIMD+LSTM）','vendor/tesseract-core-simd-lstm.wasm.js'],
      ['WASM 核（兜底 LSTM）','vendor/tesseract-core-lstm.wasm.js'],
      ['中文语言包 chi_sim','vendor/tessdata/chi_sim.traineddata.gz'],
      ['pdf.min.mjs','vendor/pdf.min.mjs'],['pdf.worker.min.mjs','vendor/pdf.worker.min.mjs']];
    var out=[], n=list.length;
    list.forEach(function(it){
      fetch(BASE+it[1],{method:'GET',headers:{Range:'bytes=0-64'}}).then(function(r){
        out.push({name:it[0],path:it[1],ok:r.ok||r.status===206,status:r.status});
      }).catch(function(e){
        out.push({name:it[0],path:it[1],ok:false,status:'网络错误'});
      }).then(function(){ if(--n===0) cb(out); });
    });
  };
</script>

function nextWeekday(from,cnw){var map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};var t=map[cnw];if(t===undefined)return from;var d=new Date(from+'T00:00:00');var cur=d.getDay();var diff=(t-cur+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return dstr(d)}
// 解析一段待办文本（钉钉/微信卡片）为一条待办
function parseTodoBlock(raw,from){
  var lines=raw.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean);
  if(!lines.length)return null;
  var text=lines.join('\n');
  var t2=text.replace(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/g,''); // 剔除四位年日期，避免误匹配
  var date=today(),time='',owner='',pri='P1',done=false,title='';
  // 完成状态
  if(/(已完成|已办|已处理|已结|✅|【完成】|完成[:：])/.test(text))done=true;
  // 优先级
  if(/(P0|紧急|加急|特急|重要且紧急|高优先级|务必|立即|马上|尽快|特重)/.test(text))pri='P0';
  else if(/优先级[：:]\s*高/.test(text))pri='P0';
  else if(/(P2|低|不急|普通|较低)/.test(text))pri='P2';
  // 日期：优先 YYYY-MM-DD / YYYY/MM/DD
  var ymd=text.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if(ymd){date=ymd[1]+'-'+pad(+ymd[2])+'-'+pad(+ymd[3]);}
  else{
    var md=t2.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
    if(md){var yy=new Date().getFullYear();date=yy+'-'+pad(+md[1])+'-'+pad(+md[2]);}
    else{
      var dm=t2.match(/(\d{1,2})[-/.](\d{1,2})(?!\d)/);
      if(dm){var yy2=new Date().getFullYear();date=yy2+'-'+pad(+dm[1])+'-'+pad(+dm[2]);}
      else if(/明天|明日/.test(text))date=shift(today(),1);
      else if(/后天/.test(text))date=shift(today(),2);
      else if(/大后天/.test(text))date=shift(today(),3);
      else if(/下周/.test(text))date=shift(today(),7);
      else if(/今天|今日|当日/.test(text))date=today();
      else{var wk=text.match(/周([一二三四五六日天])/);if(wk)date=nextWeekday(today(),wk[1]);
        else{var rel=text.match(/(\d+)\s*天[后以]?/);if(rel)date=shift(today(),+rel[1]);}}
    }
  }
  // 时间
  var tm=text.match(/(\d{1,2}):(\d{2})/);if(tm)time=pad(+tm[1])+':'+tm[2];
  // 负责人
  var ow=text.match(/(?:负责人|执行人|处理人|经办|@)\s*[：:]?\s*(\S{1,12}?)(?:\s|$|，|。|,)/);
  if(ow)owner=ow[1].replace(/[:：]$/,'');
  else{var ow2=text.match(/(?:负责人|执行人|处理人)[：:]\s*(\S+)/);if(ow2)owner=ow2[1];}
  // 标题：优先取 标题/主题/事项/内容/待办/任务 后的内容
  var tM=text.match(/(?:标题|主题|事项|内容|待办|任务|subject|title)[：:]\s*(.+)/i);
  if(tM){title=tM[1].replace(/\n/g,' ').trim();}
  else{
    var cand=lines.map(function(l){return l.replace(/^(【待办】|【任务】|【DING】|待办[:：]|任务[:：]|•|·|\*|-|\d+[.、])\s*/,'');});
    title='';
    for(var i=0;i<cand.length;i++){
      var c=cand[i];
      if(/^(截止|负责|执行|处理|经办|优先级|紧急|备注|内容|时间|日期|due|owner)/i.test(c))continue;
      if(c.length>title.length)title=c;
    }
    if(!title)title=cand[0]||text;
  }
  title=title.replace(/\s+/g,' ').trim();
  if(title.length<2)return null;
  var note=['由消息解析'];if(time)note.push('时间'+time);if(owner)note.push('负责人'+owner);
  return {id:uid(),title:title,date:date,pri:pri,from:from,note:note.join(' · '),done:done};
}

function themePickImage(file,cb){

      var cx=c.getContext('2d'); cx.drawImage(img,0,0,c.width,c.height);
      var dataURL=c.toDataURL('image/jpeg',0.72);
      var s=document.createElement('canvas'); s.width=48; s.height=48; var sx=s.getContext('2d'); sx.drawImage(c,0,0,48,48);
      var px=sx.getImageData(0,0,48,48).data, R=0,G=0,B=0,ws=0;
      for(var i=0;i<px.length;i+=4){ var r=px[i],g=px[i+1],b=px[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=(mx-mn)/(mx||1),w=0.25+sat; R+=r*w;G+=g*w;B+=b*w;ws+=w; }

    img.onerror=function(){ toast('图片读取失败'); }; img.src=rd.result;

/* 2026-09-03「更新记录」兜底过滤（辉哥报 LB-2026-078 盘亏 -21,444）
   根因：data.v9.json 由 gen_data.py 合并 sheet3 主台账 + sheet30「测算仓储费」；
   sheet30 里同 pid/方向/数量、日期被改过的「更新记录」因日期与主表不同，逃过去重键
   (方向,日期,项目号,数量)，被当成独立新流水 → 虚增出库 → 库存=入-出 变负（盘亏）。
   兜底：按 (dir,pid,qty,model,wh) 分组，同组多条且日期相邻 ≤3 天的，保留最早一条，
   其余标 is_update=true；所有汇总跳过 is_update（明细仍显示，但不计入）。 */
var UPD_MARKED=false;
function _evTime(s){
  if(!s) return null;
  var p=String(s).replace(/[-.]/g,'/').split('/');
  if(p.length<3) return null;
  var y=+p[0],m=+p[1],d=+p[2];
  if(!y||!m||!d) return null;
  return Date.UTC(y,m-1,d);
}
function markUpdateRecords(){
  if(UPD_MARKED) return;
  var det=(V9 && V9.io && V9.io.all_detail);
  if(!det || !det.length){ UPD_MARKED=true; return; }
  var groups={};
  det.forEach(function(x,i){
    var k=(x.dir||'')+'|'+(x.pid||'')+'|'+(x.qty||0)+'|'+(x.model||'')+'|'+(x.wh||'');
    (groups[k]=groups[k]||[]).push(i);
  });
  Object.keys(groups).forEach(function(k){
    var arr=groups[k];
    if(arr.length<2) return;
    var wd=arr.map(function(i){return {i:i,t:_evTime(det[i].date)};}).filter(function(o){return o.t!==null;});
    if(wd.length<2) return;
    wd.sort(function(a,b){return a.t-b.t;});
    /* 保留「日期最晚」的一条：sheet3 主表真实出库日通常晚于 sheet30 的更新日
       （例：LB-2026-078 真实出库 7/31，sheet30 更新记录把日期写成 7/30），
       保留较晚那条 = 明细显示真实日期；较早的那条标 is_update，不计入汇总。 */
    var keep=wd[wd.length-1];
    wd.slice(0,-1).forEach(function(o){
      if(Math.abs(keep.t-o.t) <= 3*86400000) det[o.i].is_update=true;
    });
  });
  UPD_MARKED=true;
}

    .then(function(res){

function pollSync(base, n){

      if(st.error){ toast('⚠ 同步失败：'+(st.error||'').slice(0,80)); refreshV9(); return; }
      if(st.data){ applyV9(st.data, 'live'); toast('✅ 已同步最新数据（生成于 '+st.generated_at+'）'); }

function hitKw(text){
  var kws=getKw(),hits=[];
  for(var i=0;i<kws.length;i++){ if(kws[i]&&String(text).indexOf(kws[i])>=0) hits.push(kws[i]); }
  return hits;
}
function markKw(text){
  var s=esc(text),kws=getKw().slice().sort(function(a,b){return b.length-a.length});
  for(var i=0;i<kws.length;i++){
    if(!kws[i])continue;
    var k=esc(kws[i]);
    s=s.split(k).join('\u0001'+k+'\u0002');
  }
  return s.split('\u0001').join('<span class="hl">').split('\u0002').join('</span>');
}

/* ================= 页面：待办 & 排期 ================= */
function pageTodo(){
  var t0=today();
  if(!state.calMonth){state.calMonth=t0.slice(0,7)}
  if(!state.calSel){state.calSel=t0}
  var ts=getTodos();
  var y=+state.calMonth.split('-')[0], mo=+state.calMonth.split('-')[1];
  var first=new Date(y,mo-1,1), startW=first.getDay(), days=new Date(y,mo,0).getDate();
  var cells=[];
  for(var i=0;i<startW;i++){cells.push({d:'',out:true})}
  for(var d=1;d<=days;d++){cells.push({d:d,ds:y+'-'+pad(mo)+'-'+pad(d)})}
  while(cells.length%7!==0){cells.push({d:'',out:true})}

  var h='';
  h+='<div class="page-head"><h2>待办 &amp; 排期</h2><span class="sub">共 '+ts.length+' 条 · 未完成 '+ts.filter(function(x){return !x.done}).length+' 条</span></div>';
  h+='<div class="btn-row" style="margin-bottom:16px"><button class="btn p" data-act="addTodo">'+ic('plus','#fff',15)+'新增待办</button>'+
     '<button class="btn" data-act="parseMsg">'+ic('chat','currentColor',15)+'粘贴微信 / 钉钉消息转待办</button></div>';

  h+='<div class="grid2" style="align-items:start">';
  /* 日历 */
  h+='<div class="card"><div class="cal-head">'+
     '<button class="btn xs" data-act="calPrev">'+ic('left','currentColor',14)+'</button>'+
     '<b>'+y+' 年 '+mo+' 月</b>'+
     '<button class="btn xs" data-act="calNext">'+ic('right','currentColor',14)+'</button></div>';
  h+='<div class="cal">'+['日','一','二','三','四','五','六'].map(function(w){return '<div class="wd">'+w+'</div>'}).join('');
  h+= cells.map(function(c){
    if(c.out) return '<div class="d out"></div>';
    var dayTs=ts.filter(function(x){return x.date===c.ds});
    var hasLate=dayTs.some(function(x){return !x.done&&c.ds<t0});
    var hasOpen=dayTs.some(function(x){return !x.done});
    var dots=dayTs.length? '<span class="dot '+(hasLate?'r':'')+'"></span>'+(dayTs.length>1?'<span class="dot"></span>':''):'';
    var cls='d'+(c.ds===t0?' today':'')+(c.ds===state.calSel?' sel':'');
    return '<button class="'+cls+'" data-act="calPick" data-v="'+c.ds+'"><span>'+c.d+'</span><span class="dots">'+dots+'</span></button>';
  }).join('')+'</div>';
  h+='<div class="srcline" style="margin-top:10px;text-align:center">图例：<span class="dot r" style="display:inline-block"></span> 逾期　<span class="dot" style="display:inline-block"></span> 有任务　<span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--ac);vertical-align:middle"></span> 今天</div></div>';

  /* 选中日 */
  var sel=ts.filter(function(x){return x.date===state.calSel}).sort(function(a,b){return a.pri<b.pri?-1:1});
  h+='<div class="card"><div class="card-h"><h3>'+ic('cal','var(--ac)',16)+cn(state.calSel)+' 安排</h3>'+
     '<button class="btn xs p" data-act="addTodoOn" data-v="'+state.calSel+'">+ 加到这天</button></div>';
  h+= sel.length? sel.map(function(x){return todoItem(x)}).join('')
     : '<div class="empty">'+mascot('star')+'<p>这天还是空的</p><span>点右上角安排一件事</span></div>';
  h+='</div>';
  h+='</div>';

  /* 全部清单 */
  var open=ts.filter(function(x){return !x.done}).sort(function(a,b){return a.date===b.date?(a.pri<b.pri?-1:1):(a.date<b.date?-1:1)});
  var done=ts.filter(function(x){return x.done}).sort(function(a,b){return a.date<b.date?1:-1});
  h+='<div class="card"><div class="card-h"><h3>'+ic('box','var(--violet)',16)+'全部未完成（'+open.length+'）</h3></div>'+
     (open.length? open.map(function(x){return todoItem(x)}).join('') : '<div class="empty">'+mascot('truck')+'<p>全部清空，今天你是效率之王</p></div>')+'</div>';
  if(done.length){
    h+='<div class="card"><div class="card-h"><h3>'+ic('check','var(--green)',16)+'已完成（'+done.length+'）</h3>'+
       '<button class="btn xs r" data-act="clearDone">清理已完成</button></div>'+
       done.slice(0,20).map(function(x){return todoItem(x)}).join('')+'</div>';
  }
  return h;
}

function _learnHistBlock(items,lastDate){
  /* 按日期分桶（items 已 flat 倒序；同一天多条相邻） */
  var byDate=[];
  var idx={};
  items.forEach(function(it){
    var d=it.date||'';
    if(!(d in idx)){ idx[d]=byDate.length; byDate.push({date:d,items:[]}); }
    byDate[idx[d]].items.push(it);
  });
  var totalDays=byDate.length;
  /* 今日已展示在顶部精选卡片里，历史区按"今日之前的"过滤——这样不重复；
     若用户希望全部归档，把下面这行换回 items.forEach 即可 */
  var pastDays=byDate.filter(function(g){return g.date!==lastDate;});
  var pastCount=pastDays.reduce(function(s,g){return s+g.items.length;},0);
  var nowOpen=!!state.learnHistOpen;
  var html='';
  html+='<div class="card" style="margin-top:12px;overflow:hidden">';
  html+='<div style="display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px dashed var(--line)">';
  html+='<span style="font-size:17px;font-weight:700;color:var(--t1)">'+ic('box','var(--violet)',16)+' 历史知识库</span>';
  html+='<span class="pill" style="background:var(--violet);color:#fff;border:0;font-weight:700">'+pastCount+' 条 · '+pastDays.length+' 天</span>';
  html+='<span style="margin-left:auto;display:flex;align-items:center;gap:6px">';
  if(pastDays.length){
    html+='<button class="btn xs" data-act="learnHistAll">'+ic(nowOpen?'eyeclose':'eye','#666',12)+' '+(nowOpen?'全部收起':'全部展开')+'</button>';
  }
  html+='</span></div>';
  if(!pastDays.length){
    html+='<div style="padding:18px 14px;text-align:center;color:var(--t3);font-size:12.5px">历史区暂无内容（今日之前的要点会在 20:00 自动抓取并归档）</div>';
  }else{
    html+='<div style="padding:8px 14px 14px;max-height:420px;overflow-y:auto">';
    pastDays.forEach(function(g){
      var preview=g.items[0];
      var pMeta=_learnCatMeta(preview.cat);
      var catList=Array.from(new Set(g.items.map(function(x){return x.cat}))).slice(0,5).join('·');
      html+='<details style="margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)'+(nowOpen?' open':'')+'">';
      html+='<summary style="cursor:pointer;list-style:none;padding:10px 12px;display:flex;align-items:center;gap:8px;user-select:none">';
      html+='<span style="display:inline-block;width:14px;color:var(--t3);font-size:11px">▸</span>';
      html+='<span style="font-weight:700;color:var(--t1);font-size:13.5px">'+cn(g.date)+'</span>';
      html+='<span class="pill" style="background:var(--card);color:var(--t2);border:1px solid var(--line);font-weight:600">'+g.items.length+' 条</span>';
      html+='<span style="font-size:11.5px;color:var(--t3);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(catList)+'</span>';
      html+='<span style="margin-left:auto;font-size:11.5px;color:var(--t3);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(preview.title)+'</span>';
      html+='</summary>';
      html+='<div style="padding:6px 12px 12px;border-top:1px dashed var(--line);background:var(--card)">';
      g.items.forEach(function(it){
        var m=_learnCatMeta(it.cat);
        html+='<div style="padding:9px 0;border-bottom:1px dashed var(--line)">';
        html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">';
        html+='<span class="pill" style="background:'+m.c+'18;color:'+m.c+';border:0;font-weight:700;font-size:11px">'+ic(m.i,m.c,11)+' '+esc(it.cat)+'</span>';
        if(it.src){html+='<span class="pill" style="background:var(--bg);color:var(--t3);font-size:11px;border:1px solid var(--line)">'+esc(it.src.slice(0,24))+'</span>'}
        html+='</div>';
        html+='<div style="font-size:14px;font-weight:600;line-height:1.5;color:var(--t1)">'+esc(it.title)+'</div>';
        if(it.sum){html+='<div style="margin-top:4px;font-size:12.5px;line-height:1.75;color:var(--t2);font-weight:500">'+esc(it.sum)+'</div>'}
        if(it.url){html+='<div style="margin-top:5px"><a href="'+esc(it.url)+'" target="_blank" rel="noopener" style="font-size:12px;color:var(--ac);text-decoration:none;font-weight:600">阅读原文 →</a></div>'}
        html+='</div>';
      });
      html+='</div></details>';
    });
    html+='</div>';
  }
  html+='</div>';
  return html;
}

    '</div>'+

      '<div class="qd-grid">'+

        '<div class="qd-kv"><span class="qd-k">采购合同号</span><span class="qd-v">'+esc(c.buy||'-')+'</span></div>'+
        '<div class="qd-kv"><span class="qd-k">销售合同号</span><span class="qd-v">'+esc(c.sale||'-')+'</span></div>'+
        '<div class="qd-kv"><span class="qd-k">采购端供方</span><span class="qd-v">'+esc(c.supplier||'-')+'</span></div>'+
        '<div class="qd-kv"><span class="qd-k">销售端下家</span><span class="qd-v">'+esc(c.customer||'-')+'</span></div>'+
        '<div class="qd-kv"><span class="qd-k">完结状况</span><span class="qd-v '+(stCls?'qd-'+stCls:'')+'">'+esc(c.status||'-')+'</span></div>'+
        '<div class="qd-kv"><span class="qd-k">是否逾期</span><span class="qd-v '+(ovCls?'qd-'+ovCls:'')+'">'+esc(c.overdue||'-')+'</span></div>'+
        '<div class="qd-kv qd-kv-wide"><span class="qd-k">产品信息</span><span class="qd-v">'+esc(prodLabel)+'</span></div>'+
      '</div>'+
      '<div class="qd-evt-h">出入库流水（按产品分组） · 共 '+events.length+' 笔</div>'+
      /* 按产品分组：每块单独计算库存/单价/仓库，再走明细表 */
      (function(){
        /* 桶：key=产品规格文本（与 brief.product 字段一致，含类别前缀"集成电路 X29F..."） */
        var bucket = {};
        events.forEach(function(e){
          var m = e.model || '';
          bucket[m] = bucket[m] || {events:[], ptype:'', matched:false};
          bucket[m].events.push(e);
        });
        /* 按 brief.products 顺序排序（用户认知的"第 1 种产品"对得上） */
        var orderedKeys = [];
        products.forEach(function(p){
          var fullKey = (p.product||'').trim();
          if(!fullKey) return;
          var hit = null;
          Object.keys(bucket).forEach(function(k){
            if(hit) return;
            if(k===fullKey || (k && fullKey && k.indexOf(fullKey)>-1)){ hit = k; }
          });
          if(hit && orderedKeys.indexOf(hit)<0){
            orderedKeys.push(hit);
            bucket[hit].matched = true;
            bucket[hit].ptype = p.ptype||'';
          }
        });
        /* 落单桶（events 有但 brief 没列出的）追加到末尾 */
        Object.keys(bucket).forEach(function(k){
          if(orderedKeys.indexOf(k)<0){ orderedKeys.push(k); bucket[k].ptype = bucket[k].ptype||''; }
        });
        var html='';
        var _pIdx=0;
        orderedKeys.forEach(function(k){
          var blk = bucket[k];
          _pIdx++;
          var inQty=0, outQty=0, inAmt=0, outAmt=0, prices=[], whs={}, firstP='';
          blk.events.forEach(function(e){
            if(e.is_update) return;
            if(!firstP) firstP = e.pid||'';
            if(e.dir==='入'){ inQty += (+e.qty||0); inAmt += (+e.amt||0); }
            else { outQty += (+e.qty||0); outAmt += (+e.amt||0); }
            if(e.price){ prices.push(+e.price); }
            if(e.wh){ whs[e.wh] = (whs[e.wh]||0)+1; }
          });
          var stock = inQty - outQty;
          var avgPrice = prices.length? (prices.reduce(function(a,b){return a+b;},0)/prices.length) : 0;
          var avgPriceUsd = avgPrice? (avgPrice/6.9) : 0;
          /* 合同数量推算：入总 + max(0, 当前库存) = 已入库 + 在库剩余
             含义：events 中所有「入」累加 + 剩余库存 = 隐含合同总量（纯出库合同则=0，显示—） */
          var contractQty = inQty>0 ? (inQty + (stock>0?stock:0)) : 0;
          /* 多行：每产品按仓库拆行 */
          var whArr = Object.keys(whs).length? Object.keys(whs) : ['-'];
          var ptypeLbl = blk.ptype? '<span class="pill blue" style="margin-left:6px">'+esc(blk.ptype)+'</span>':'';
          function _cell(label, html, color){
            return '<div class="qd-m"><div class="qd-m-l">'+label+'</div><div class="qd-m-v" style="'+(color?'color:'+color+';':'')+'">'+html+'</div></div>';
          }
          function _unit(html){
            return '<span class="qd-m-u">'+html+'</span>';
          }
          html += '<div class="qd-prod" style="margin:14px 0 8px;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px">'+
            '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px">'+
              '<span class="pill gray">#'+_pIdx+'</span>'+
              '<b style="font-size:14.5px;color:var(--t1);line-height:1.5;word-break:break-all">'+esc(k||'-')+'</b>'+ptypeLbl+
              '<span class="srcline" style="margin-left:auto">流水 '+blk.events.length+' 笔</span>'+
            '</div>'+
            whArr.map(function(wh){
              /* v51：按合同币种决定符号，每个产品只显示一种货币（USD → $，CNY → ¥），不显示换算副标
                 辉哥 9/9 反馈：USD 合同不要再换算成人民币显示，统一美元 */
              var _ccy = (blk.events[0]&&blk.events[0].ccy)||'';
              var _sym = _ccy==='USD' ? '$' : '¥';
              return '<div class="qd-metric">'+
                '<div class="qd-mh">'+
                  _cell('仓库', esc(wh)) +
                  _cell('单价', (avgPrice?_sym+avgPrice.toFixed(2):'<span style="color:var(--t3)">—</span>')) +
                  _cell('库存', '<span class="qd-m-big" style="color:'+(stock<0?'var(--red)':(stock>0?'var(--green)':'var(--t3)'))+'">'+fmtRaw(stock)+'</span>'+_unit('个') + '<br><span class="qd-m-sub">合同 <b style="color:'+(contractQty?'var(--t1)':'var(--t3)')+'">'+(contractQty?fmtRaw(contractQty):'—')+'</b> 个</span>') +
                  _cell('流水', '<span style="color:var(--green)"><b>'+fmtRaw(inQty)+'</b> 个 入</span><br><span style="color:var(--red)"><b>'+fmtRaw(outQty)+'</b> 个 出</span>') +
                  _cell('金额', '<span style="color:var(--green)"><b>'+_sym+fmtRaw(inAmt)+'</b> 入</span><br><span style="color:var(--red)"><b>'+_sym+fmtRaw(outAmt)+'</b> 出</span>') +
                '</div>'+
              '</div>';
            }).join('')+
            /* 明细表保持原样 */
            '<div class="tbl-scroll" style="margin-top:10px"><table class="v9tbl"><thead><tr><th>日期</th><th>方向</th><th>合同号</th><th>仓库</th><th class="num">数量（个）</th><th class="num">单价（元）</th><th class="num">金额（元）</th></tr></thead><tbody>'+
            /* v49：按币种决定符号（USD 合同的 17.5 是美元不是人民币） */
            blk.events.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(r){
              var dir=r.dir==='入'?'<span style="color:var(--green-t);font-weight:700">入</span>':'<span style="color:#E03A3F;font-weight:700">出</span>';
              var ccy = r.ccy||'';
              var sym = ccy==='USD' ? '$' : '¥';
              var priceHtml = r.price?(sym+(+r.price).toFixed(2)):'—';
              return '<tr><td>'+esc(r.date)+'</td><td>'+dir+'</td><td>'+esc(r.contract||'')+'</td><td>'+esc(r.wh||'-')+'</td><td class="num">'+fmtRaw(r.qty)+'</td><td class="num">'+priceHtml+'</td><td class="num"><b>'+sym+fmtRaw(r.amt||0)+'</b></td></tr>';
            }).join('')+
            '</tbody></table></div>'+
          '</div>';
        });
        return html || '<div class="empty" style="padding:14px">该合同暂无出入库流水</div>';
      })()+
    '</div>'+
    '</div>';
}

  var _sy=(window.pageYOffset||document.documentElement.scrollTop||0);

  var _ext=(TABS.filter(function(x){return x.k===state.tab && (x.url||x.hub);})[0]);
  var f=_ext?function(){
    if(_ext.hub) return pageExtHub(_ext.hub);

  }:({home:pageHome,todo:pageTodo,idea:pageLearn,io:pageIo,v9:pageV9,me:pageMe,audit:pageAudit}[state.tab]);
  v.innerHTML='<div class="page">'+f()+'</div>';

    if(isOffline()){ sub.textContent='离线浏览中：服务器未连接，只能看，不能写/同步'; }

}

  extra[p.sale||'sale']=sheet.sale||'';

      return fetch(u,{method:'GET',mode:'no-cors',cache:'no-store'})
        .then(function(){v9ioLogSent(u,kv,true,'no-cors');return {ok:true,confirmed:false};})
        .catch(function(){
          return new Promise(function(resolve){
            var img=new Image(),done=false;
            function fin(){ if(!done){done=true;v9ioLogSent(u,kv,true,'img');resolve({ok:true,confirmed:false});} }
            img.onload=img.onerror=fin;
            setTimeout(fin,6000);
            img.src=u;

/* 把单条 sheet 推到 v91-crud webhook（直写 V9.1 多维表格 sheet 3 + sheet 30）。
   返回 Promise<{ok:bool, err?:string, sheet3?, sheet30?}>。
   网络/4xx/5xx/超时/CORS 任一失败都算 err，留待「复制 JSON」兜底链路继续走。*/
function v9ioPushSheet(sheet, webhook){
  if(!webhook.url) return Promise.resolve({ok:false,err:'未配置 V9.1 直写通道（请在「我的→V9.1 直写」里填）'});
  if(webhook.mode==='kdocs') return v9ioPushKdocs(sheet, webhook);
  var dir=sheet.dir==='入'?'入':'出';
  var body={dir:dir,date:sheet.date,pid:sheet.pid,buy:sheet.buy||'',sale:sheet.sale||'',
    product:sheet.model||'',wh:sheet.wh||'',qty:+sheet.qty||0,
    unit_price:+sheet.price||0,amount:+sheet.amt||0,note:sheet.note||''};
  /* v47：单条超时 8s → 30s（金山建记录含 sheet3+sheet30 两次调用，8s 在弱网下极易误判失败） */
  var ctrl=new AbortController();
  var t=setTimeout(function(){ctrl.abort()}, 30000);
  return fetch(webhook.url.replace(/\/$/,'')+'/api/io-write',{
    method:'POST',signal:ctrl.signal,
    headers:_ioAuthHeaders(true),
    body:JSON.stringify(body)
  }).then(function(res){
    clearTimeout(t);
    return res.json().then(function(j){return {ok:res.ok, status:res.status, body:j};});
  }).then(function(r){
    if(!r.ok){return {ok:false,err:(r.body&&r.body.error)||('HTTP '+r.status)};}
    return {ok:true,sheet3:r.body.sheet3,sheet30:r.body.sheet30};
  }).catch(function(e){
    clearTimeout(t);
    return {ok:false,err:String(e&&e.message||e)};
  });
}
/* v47 批量写入：一次请求把整批交给服务端串行写（服务端 /api/io-write-batch）。
   背景：原来 N 条 = N 次往返，每条 8s 超时，多产品行时极易整批失败（"有时写有时不写"）。
   现在手机只等 1 个请求（超时 60s），服务端写金山（服务器间网络快且稳），可靠性大幅提升。
   返回 {ok, succ:[sheet], fail:[{sheet,err}], usedBatch:bool} */
function v9ioPushBatchServer(sheets, webhook){
  var items=sheets.map(function(s){
    return {dir:s.dir==='入'?'入':'出', date:s.date, pid:s.pid, buy:s.buy||'', sale:s.sale||'',
            product:s.model||'', wh:s.wh||'', qty:+s.qty||0, unit_price:+s.price||0,
            amount:+s.amt||0, note:s.note||''};
  });
  var ctrl=new AbortController();
  var t=setTimeout(function(){ctrl.abort()}, 60000);
  return fetch(webhook.url.replace(/\/$/,'')+'/api/io-write-batch',{
    method:'POST', signal:ctrl.signal, headers:_ioAuthHeaders(true),
    body:JSON.stringify({items:items})
  }).then(function(res){
    clearTimeout(t);
    return res.json().then(function(j){return {st:res.status, body:j};});
  }).then(function(r){
    var b=r.body||{};
    try{ _clog('batch-resp','HTTP '+r.st+' succ='+(b.succ||0)+'/'+(b.total||items.length)+' '+(b.error||''),{st:r.st,body:String(JSON.stringify(b)).slice(0,1500),n:items.length}); }catch(_){}
    if(r.st===401){ _ioExpired(); return {ok:false, succ:[], fail:sheets.map(function(s){return {sheet:s, err:'登录已过期，请重新登录'};}), usedBatch:true}; }
    /* 服务端不支持批量（旧版）→ 返回 null 让调用方回退逐条 */
    if(r.st===404 || (r.st>=400 && /not found|404/i.test(String(b.error||'')))) return null;
    if(r.st!==200) return {ok:false, succ:[], fail:sheets.map(function(s){return {sheet:s, err:(b.error||('HTTP '+r.st))};}), usedBatch:true};
    var res=b.results||[], succ=[], fail=[];
    res.forEach(function(x){
      var s=sheets[x.idx];
      if(!s) return;
      if(x.ok) succ.push(s); else fail.push({sheet:s, err:x.err||'写入失败'});
    });
    return {ok:fail.length===0, succ:succ, fail:fail, usedBatch:true};
  }).catch(function(e){
    clearTimeout(t);
    var msg=String(e&&e.message||e);
    try{ _clog('batch-ex',msg,{n:items.length,url:webhook.url}); }catch(_){}
    /* v48：手机端偶发 "Failed to fetch"（CF tunnel 连接复用导致服务端 close）。
       用 no-store + cache buster 强制开新连接重试一次。*/
    if(/Failed to fetch|TypeError|network/i.test(msg)){
      return new Promise(function(rs){setTimeout(function(){
        var ctrl2=new AbortController();
        var t2=setTimeout(function(){ctrl2.abort()},60000);
        var url2=webhook.url.replace(/\/$/,'')+'/api/io-write-batch?_='+Date.now();
        fetch(url2,{method:'POST',signal:ctrl2.signal,headers:_ioAuthHeaders(true),
          body:JSON.stringify({items:items}),cache:'no-store',keepalive:true})
          .then(function(r){clearTimeout(t2);return r.json().then(function(j){return {st:r.status,body:j};});})
          .then(function(r){
            if(r.st===401){ _ioExpired(); return {ok:false,succ:[],fail:sheets.map(function(s){return {sheet:s,err:'登录已过期'};}),usedBatch:true}; }
            if(r.st!==200) return {ok:false,succ:[],fail:sheets.map(function(s){return {sheet:s,err:(r.body&&r.body.error)||('HTTP '+r.st)};}),usedBatch:true};
            var res=r.body.results||[],succ=[],fail=[];
            res.forEach(function(x){var s=sheets[x.idx];if(!s)return;if(x.ok)succ.push(s);else fail.push({sheet:s,err:x.err||'写入失败'});});
            return {ok:fail.length===0,succ:succ,fail:fail,usedBatch:true};
          })
          .catch(function(e2){
            return {ok:false,succ:[],fail:sheets.map(function(s){return {sheet:s,err:String(e2&&e2.message||e2)};}),usedBatch:true};
          })
          .then(rs);
      },350);});
    }
    return {ok:false, succ:[], fail:sheets.map(function(s){return {sheet:s, err:msg};}), usedBatch:true};
  });
}
/* 批量推送 sheets（一条失败不阻塞其它），返回 Promise<{ok,succ[],fail[]}>
   v47：server 模式优先走批量接口；批量不可用/失败 → 自动回退逐条（30s/条） */
function v9ioPushBatch(sheets, webhook){
  var succ=[],succR=[],fail=[];
  if(webhook && webhook.mode==='server' && webhook.url && sheets.length>1){
    return v9ioPushBatchServer(sheets, webhook).then(function(r){
      if(r && r.usedBatch && r.succ.length) return {ok:(r.fail.length===0), succ:r.succ, succR:[], fail:r.fail, usedBatch:true};
      if(r && r.usedBatch) return {ok:false, succ:[], succR:[], fail:r.fail, usedBatch:true};
      return _pushOneByOne();
    });
  }
  if(webhook && webhook.mode==='server' && webhook.url && sheets.length===1){
    /* 单条也走批量接口（统一路径、统一判定），失败回退单条 */
    return v9ioPushBatchServer(sheets, webhook).then(function(r){
      if(r && r.usedBatch) return {ok:(r.fail.length===0), succ:r.succ, succR:[], fail:r.fail, usedBatch:true};
      return _pushOneByOne();
    });
  }
  return _pushOneByOne();
  function _pushOneByOne(){
    var s2=[],f2=[];
    return sheets.reduce(function(p,s){
      return p.then(function(){return v9ioPushSheet(s,webhook).then(function(r){
        if(r.ok){s2.push(s);} else f2.push({sheet:s,err:r.err});
      })});
    },Promise.resolve()).then(function(){return {ok:f2.length===0,succ:s2,succR:[],fail:f2,usedBatch:false};});
  }
}

/* 单 input/select → _IO_NEW_ROWS 实时同步（用户输入时实时调用，避免重建 DOM 覆盖用户刚填的数据） */
function _iofSyncField(el){
  el._ionTouched=true;

  if(!tr) return;
  var i=+tr.getAttribute('data-i');
  if(isNaN(i)) return;
  if(!_IO_NEW_ROWS[i]) _IO_NEW_ROWS[i]=_iofRowBlank();

/* 多产品行渲染（每行独立方向 radio：in/out；数量列按 dir 着色）。
   渲染前先同步「用户碰过的」DOM input → _IO_NEW_ROWS，避免程序写入的值被覆盖回空。 */
function _iofRenderRows(){
  var tb=document.getElementById('ioForm_rows');
  if(!tb) return;
  if(!_IO_NEW_ROWS.length) _IO_NEW_ROWS=[_iofRowBlank()];

  Array.from(tb.querySelectorAll('tr')).forEach(function(tr){

    if(isNaN(i) || !_IO_NEW_ROWS[i]) return;

          +'<div style="display:flex;border:1px solid var(--inp-b);border-radius:8px;overflow:hidden;flex-shrink:0">'
            +'<label data-f="dir" data-v="in" onclick="_iofSetDir(this,'+i+',\'in\')" style="padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;background:'+(dir==='in'?'var(--green)':'#fff')+';color:'+(dir==='in'?'#fff':'var(--t2)')+'">入库</label>'

          +'</div>'
          +'<input type="text" data-f="product" value="'+esc(r.product||'')+'" oninput="_iofSyncField(this)" placeholder="产品名称" style="flex:1;min-width:0;height:36px;font-size:13px;padding:0 10px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'
          +'<input type="number" data-f="qty" value="'+esc(r.qty||'')+'" oninput="_iofSyncField(this)" placeholder="数量" style="width:88px;height:36px;font-size:14px;font-weight:700;padding:0 8px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card);color:'+dirColor+'">'
          +'<button type="button" class="btn sm" data-act="ioFrmDelRow" data-i="'+i+'" title="删除此行" style="flex-shrink:0;height:36px;width:36px;padding:0;border-color:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center">'+ic('trash','currentColor',14)+'</button>'
        +'</div>'
        /* 下行：仓库(flex:1) | 日期(flex:1) | 体积(120px,可空) | 隐藏 note */
        +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:nowrap">'
          +'<select data-f="wh" onchange="_iofSyncField(this)" style="flex:1;min-width:0;height:36px;font-size:13px;padding:0 10px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'+whOpts+'</select>'
          +'<input type="date" data-f="date" value="'+esc(r.date||'')+'" oninput="_iofSyncField(this)" style="flex:1;min-width:0;height:36px;font-size:13px;padding:0 10px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'
          +'<input type="text" data-f="vol" value="'+esc(r.vol||'')+'" oninput="_iofSyncField(this)" placeholder="体积" style="width:120px;height:36px;font-size:12.5px;padding:0 10px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'
          +'<input type="hidden" data-f="note" value="'+esc(r.note||'')+'">'
        +'</div>'
      +'</td>'
    +'</tr>';
  }).join('');
  tb.innerHTML=html;
  /* 还原已选中的仓库 + radio 激活态（select 默认选第一个 option） */
  Array.from(tb.querySelectorAll('tr')).forEach(function(tr){

var _IO_NOTICE_ROWS = []; // 当前的产品行（每条：{wh, product, date, qty, vol, note}）
var _IO_NOTICE_DIR = 'in'; // 整张通知方向：'in'入库 / 'out'出库（一次只一种）
var _ION_SAVED_RESTART_T = null; // 保存成功后 3.5s 定时器（点「再录一条」/「关闭」立即取消）
function _ionRowBlank(){ return {wh:'',product:'',date:'',qty:'',vol:'',note:''}; }
/* 预通知：同步单个 input/select → _IO_NOTICE_ROWS（用户输入时实时调用，不破坏 DOM） */
function _ionSyncField(el){
  el._ionTouched=true; // 标记被用户碰过，_ionRenderRows 才回写
  var tr=el.closest&&el.closest('tr');
  if(!tr) return;
  var i=+tr.getAttribute('data-i');
  if(isNaN(i)) return;
  if(!_IO_NOTICE_ROWS[i]) _IO_NOTICE_ROWS[i]=_ionRowBlank();
  var f=el.getAttribute('data-f');
  _IO_NOTICE_ROWS[i][f]=el.value;
}
/* 预通知：单产品卡片行（分两行：上行产品+数量；下行仓库+日期；整张通知只一个方向）
   【重要】渲染前先同步「用户碰过的」DOM input → _IO_NOTICE_ROWS，避免重建 DOM 覆盖用户刚填的数据 */
function _ionRenderRows(){
  var tb=document.getElementById('ionRows');
  if(!tb) return;
  if(!_IO_NOTICE_ROWS.length) _IO_NOTICE_ROWS=[_ionRowBlank()];
  /* === 第一步（非破坏性）：先把现有 DOM input 值同步到 _IO_NOTICE_ROWS —— 只同步用户碰过的（_ionTouched） */
  Array.from(tb.querySelectorAll('tr')).forEach(function(tr){
    var i=+tr.getAttribute('data-i');
    if(isNaN(i) || !_IO_NOTICE_ROWS[i]) return;
    tr.querySelectorAll('[data-f]').forEach(function(el){
      if(!el._ionTouched) return; // 新建未碰过的 input 不覆盖 _IO_NOTICE_ROWS 中已有的值
      _IO_NOTICE_ROWS[i][el.getAttribute('data-f')]=el.value;
    });
  });
  /* === 第二步：根据 _IO_NOTICE_ROWS 渲染 HTML（每个 input/select 绑定 oninput/_ionSyncField 实时回写） */
  var _wh=v9ioWhList();
  var whOpts='<option value="">请选择仓库</option>'+_wh.map(function(w){return '<option value="'+esc(w)+'">'+esc(w)+'</option>'}).join('');
  var dirLabel=_IO_NOTICE_DIR==='in'?'入库':'出库';
  var dirColor=_IO_NOTICE_DIR==='in'?'var(--green)':'var(--red)';
  var html=_IO_NOTICE_ROWS.map(function(r,i){
    return '<tr data-i="'+i+'" style="border-top:1px solid var(--border)">'+
      '<td colspan="6" style="padding:10px 8px">'+
        /* 第一行：产品 + 数量 + 删除 */
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'+
          '<input type="text" data-f="product" value="'+esc(r.product||'')+'" oninput="_ionSyncField(this)" placeholder="产品名称" style="flex:1;min-width:0;height:36px;font-size:13px;padding:0 10px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'+
          '<input type="number" data-f="qty" value="'+esc(r.qty||'')+'" oninput="_ionSyncField(this)" placeholder="数量" style="width:96px;height:36px;font-size:13px;font-weight:700;padding:0 8px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card);color:'+dirColor+'">'+
          '<button type="button" data-act="ionDelRow" data-i="'+i+'" style="flex-shrink:0;height:36px;width:36px;background:transparent;border:1px solid var(--red-l);color:var(--red);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center">'+ic('trash','currentColor',14)+'</button>'+
        '</div>'+
        /* 第二行：仓库 + 日期（仓库规格体积保留 data-f=vol 隐藏，确保数据流畅） */
        '<div style="display:flex;gap:8px;align-items:center">'+
          '<select data-f="wh" onchange="_ionSyncField(this)" style="flex:1;min-width:0;height:36px;font-size:13px;padding:0 10px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'+whOpts+'</select>'+
          '<input type="date" data-f="date" value="'+esc(r.date||'')+'" oninput="_ionSyncField(this)" style="flex:1;min-width:0;height:36px;font-size:13px;padding:0 10px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'+
          /* 保留数据流动，UI 隐藏 */
          '<input type="hidden" data-f="vol" value="'+esc(r.vol||'')+'">'+
        '</div>'+
      '</td>'+
    '</tr>';
  }).join('');
  tb.innerHTML=html;
  /* 还原已选中的仓库（select 默认选中第一个 option，需手动设 value） */
  Array.from(tb.querySelectorAll('tr')).forEach(function(tr){
    var i=+tr.getAttribute('data-i');
    if(isNaN(i) || !_IO_NOTICE_ROWS[i]) return;
    var sel=tr.querySelector('[data-f="wh"]');
    if(sel && _IO_NOTICE_ROWS[i].wh){ sel.value=_IO_NOTICE_ROWS[i].wh; }
  });
}

/* 预通知：自动从 sheet2_brief 反查（输入项目号或合同号后调用）
   关键：项目号是「权威来源」→ 改项目号时同步覆盖 buy/sale/customer
        合同号是「辅助来源」→ 只填空 buy/sale/customer，保留用户改的项目号 */
var _ION_AF_DEBOUNCE=null;
var _ION_PICK_HITS=[]; // v54：候选合同暂存（多匹配弹窗用）
function ionAutoFill(){
  clearTimeout(_ION_AF_DEBOUNCE);
  _ION_AF_DEBOUNCE=setTimeout(function(){
    var sb=V9&&V9.inventory&&V9.inventory.sheet2_brief||[];
    var pidRaw='LB-'+val('ion_year')+(val('ion_mode')==='外贸（J）'?'-J':'')+(val('ion_no')?'-'+val('ion_no'):'');
    pidRaw=pidRaw.replace(/-+$/,'');
    var buy=val('ion_buy').trim(), sale=val('ion_sale').trim();
    var hint=document.getElementById('ion_autoHint');
    var hit=null, matchedById=false;
    /* 优先级：项目号 > 采购合同号 > 销售合同号 */
    if(pidRaw && pidRaw.length>5){
      /* v54：项目号末段数字去前导 0 容错（输 40 也能匹配 040） */
      var noStr=val('ion_no').trim();
      var noNum=noStr? parseInt(noStr,10) : NaN;
      var _modeVal=val('ion_mode');
      var pidPrefix='LB-'+val('ion_year')+(/^外贸/.test(_modeVal)?'-J':'');
      hit=sb.find(function(r){
        if(!r.pid) return false;
        if(r.pid===pidRaw) return true;
        if(!isNaN(noNum) && r.pid.indexOf(pidPrefix+'-')===0){
          var tail=r.pid.substring(pidPrefix.length+1);
          if(parseInt(tail,10)===noNum) return true;
        }
        return false;
      });
      if(hit) matchedById=true;
    }
    /* v54：采购/销售合同号支持子串模糊搜索；多匹配弹窗选 */
    if(!hit && buy){
      var buyHits=ionContractSearch(sb,'buy',buy);
      if(buyHits.length===1){ hit=buyHits[0]; }
      else if(buyHits.length>1){ ionPickContractModal(buyHits,'buy'); return; }
    }
    if(!hit && sale){
      var saleHits=ionContractSearch(sb,'sale',sale);
      if(saleHits.length===1){ hit=saleHits[0]; }
      else if(saleHits.length>1){ ionPickContractModal(saleHits,'sale'); return; }
    }
    if(hit){
      /* 回填项目号段（只填空） */
      if(hit.pid){
        var parts=hit.pid.split('-'); // ['LB','2026','J','091']
        if(parts.length>=3){
          if(!val('ion_year')) val_set('ion_year', parts[1]||'2026');
          var wantMode=parts[2]==='J'?'外贸（J）':'内贸';
          if(!val('ion_mode')) val_set('ion_mode', wantMode);
          if(!val('ion_no')) val_set('ion_no', parts.slice(parts[2]==='J'?3:2).join('-')||hit.no||'');
          ionPreviewPid();
        }
      }
      if(matchedById){
        /* 项目号是权威来源：改项目号 = 换合同主体 → 覆盖 buy/sale/customer */
        if(hit.buy && val('ion_buy')!==hit.buy){ val_set('ion_buy', hit.buy); }
        if(hit.sale && val('ion_sale')!==hit.sale){ val_set('ion_sale', hit.sale); }
        if(hit.customer){
          var box=document.getElementById('ion_customers');
          if(box){
            box.innerHTML='<div data-idx="0" style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'+
              '<input type="text" data-f="customer" value="'+esc(hit.customer)+'" placeholder="销售下家" style="flex:1;height:30px;font-size:12.5px;padding:0 8px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'+
              '<button type="button" class="btn sm" data-act="ionDelCustomer" data-idx="0" style="border-color:var(--red-l);color:var(--red)">'+ic('trash','currentColor',12)+'</button>'+
            '</div>';
          }
        }
      } else {
        /* 合同号是辅助来源：只填空 buy/sale/customer，保留用户改的项目号 */
        if(!val('ion_buy') && hit.buy){ val_set('ion_buy', hit.buy); }
        if(!val('ion_sale') && hit.sale){ val_set('ion_sale', hit.sale); }
        if(hit.customer){
          var box=document.getElementById('ion_customers');
          if(box && !box.querySelector('[data-idx="0"]')){
            box.innerHTML='<div data-idx="0" style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'+
              '<input type="text" data-f="customer" value="'+esc(hit.customer)+'" placeholder="销售下家" style="flex:1;height:30px;font-size:12.5px;padding:0 8px;border:1px solid var(--inp-b);border-radius:8px;background:var(--card)">'+
              '<button type="button" class="btn sm" data-act="ionDelCustomer" data-idx="0" style="border-color:var(--red-l);color:var(--red)">'+ic('trash','currentColor',12)+'</button>'+
            '</div>';
          }
        }
      }
      /* 提示 */
      if(hint){
        hint.style.display='inline-flex';
        hint.style.color='var(--green)';
        hint.innerHTML='✓ 已自动匹配合同：'+esc(hit.product||'')+(hit.customer?' · 下家 '+esc(hit.customer):'');
      }
      /* 自动加载产品下拉 */
      ionLoadProductOptions([hit]);
    } else {
      if(hint){ hint.style.display='inline-flex'; hint.style.color='var(--t3)'; hint.innerHTML='未匹配到合同（项目号/合同号可能尚无记录）'; }
    }
  }, 250);
}
/* v54：合同号子串模糊搜索（不区分大小写），返回所有匹配的合同记录 */
function ionContractSearch(records,field,q){
  if(!q) return [];
  var ql=q.toLowerCase();
  return records.filter(function(r){
    var v=r[field];
    return v && String(v).toLowerCase().indexOf(ql)>=0;
  });
}
/* v54：多个候选时弹窗让用户选择；点击后填入 buy/sale 框并重跑 ionAutoFill 走严格匹配 */

    '<div style="max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)">'+
    hits.map(function(r,i){

        'style="padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center">'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-weight:700;font-size:14px;color:var(--t1);word-break:break-all">'+esc(no||'-')+'</div>'+
          '<div style="font-size:12px;color:var(--t2);margin-top:3px">'+

    }).join('')+
    '</div>';
  openModal('选合同',body,'',null,{icon:'search'});

/* 预通知：手动加载（用户主动点「加载产品」） */
function ionLoadProduct(){

  var buy=val('ion_buy').trim(), sale=val('ion_sale').trim();

/* 预通知：用户在下拉选产品后点「✓ 确定」→ 把产品名 + 推断的仓库写入第一个空行 */
function ionConfirmProduct(){
  var sel=document.getElementById('ion_product');
  if(!sel){ toast('产品下拉不存在'); return; }
  var product=sel.value;
  if(!product){ toast('请先在下拉里选一个产品'); return; }
  // 组装 pid（归一）
  var pid='LB-'+val('ion_year')+(val('ion_mode')==='外贸（J）'?'-J':'')+(val('ion_no')?'-'+val('ion_no'):'');
  pid=pid.replace(/-+$/,'');
  // 仓库推断（用项目号+产品型号）
  var guessed=_v9ioGuessWh(pid, product);
  // 找第一个空产品行（product 空即视为空行；qty 有也行）
  var targetIdx=-1;
  for(var i=0;i<_IO_NOTICE_ROWS.length;i++){
    if(!_IO_NOTICE_ROWS[i].product){ targetIdx=i; break; }
  }
  if(targetIdx<0){
    _IO_NOTICE_ROWS.push({wh:guessed||'',date:'',qty:'',vol:'',note:'',product:product});
    targetIdx=_IO_NOTICE_ROWS.length-1;
  } else {
    _IO_NOTICE_ROWS[targetIdx].product=product;
    if(guessed && !_IO_NOTICE_ROWS[targetIdx].wh){ _IO_NOTICE_ROWS[targetIdx].wh=guessed; }
  }
  // 重新渲染前，清掉现有所有 input 的 _ionTouched 标记（确定按钮是「覆盖式」操作，避免 _ionRenderRows 步骤1 把旧 DOM 值覆盖回 _IO_NOTICE_ROWS）
  var _tbPre=document.getElementById('ionRows');
  if(_tbPre){ Array.from(_tbPre.querySelectorAll('[data-f]')).forEach(function(el){ el._ionTouched=false; }); }
  _ionRenderRows();
  if(guessed){ toast('已导入产品「'+product.slice(0,14)+'…」+ 仓库「'+guessed+'」'); }
  else { toast('已导入产品「'+product.slice(0,14)+'…」（未识别仓库，请手动选）'); }
}

/* 预通知：收集表单 → 转为多张出入库条目（保存到本地 io + v9io_pending 队列） */
function ionCollect(){
  _ionRenderRows(); // 同步最新输入
  var dir=_IO_NOTICE_DIR||'in';
  var pid='LB-'+val('ion_year')+(val('ion_mode')==='外贸（J）'?'-J':'')+(val('ion_no')?'-'+val('ion_no'):'');
  pid=pid.replace(/-+$/,'');
  var buy=val('ion_buy').trim(), sale=val('ion_sale').trim();
  var note=val('ion_note').trim();
  /* 司机信息：1 个 textarea，按行 + 空格/斜杠/逗号分隔 */
  var drvRaw=val('ion_drv');
  var drvParts=drvRaw.split(/[\n\r\s\/，,;；]+/).map(function(s){return s.trim()}).filter(Boolean);
  var drvText=drvParts.length?drvParts.join(' / '):'';
  var customers=Array.from(document.querySelectorAll('#ion_customers [data-f="customer"]')).map(function(el){return el.value.trim()}).filter(Boolean);
  if(!pid && !buy && !sale){
    toast('请至少填写项目号/采购合同号/销售合同号之一');
    return null;
  }
  var rows=_IO_NOTICE_ROWS.filter(function(r){
    return (r.wh && r.qty) || r.product;
  });
  if(!rows.length){
    toast('请至少添加一条产品行（仓库+数量 或 产品名）');
    return null;
  }
  var ts=Date.now();
  var ioItems=[], sheets=[], idx=0;
  rows.forEach(function(r){
    /* fullNote：仅本表备注（V9.1 sheet3 不写入合同号/下家/司机） */
    var fullNote=note||'';
    var rdate=r.date||today();
    var rqty=+r.qty||0;
    if(!rqty) return;
    var li={id:'ion_'+ts+'_'+idx,type:dir,date:rdate,wh:r.wh,item:r.product||'',qty:rqty,price:'',cur:'',
      project:pid,note:fullNote};
    /* contract/buy/sale：V9.1 sheet3 不写入 */
    var sh={dir:dir==='in'?'入':'出',date:rdate,pid:pid,contract:'',model:r.product||'',
      wh:r.wh,qty:rqty,amt:0,price:0,buy:'',sale:'',cur:'',vol:r.vol||'',note:fullNote,ts:ts};
    ioItems.push(li); sheets.push(sh);
    idx++;
  });
  if(!sheets.length){
    toast('请填写产品的数量');
    return null;
  }
  return {pid:pid,buy:buy,sale:sale,note:note,drv:drvText,customers:customers,rows:rows,dir:dir,items:ioItems,sheets:sheets,ts:ts};
}

/* 预通知：保存流程入口（第一步：校验 + 显示确认页）
   仿 ioFormV9OnOk：第一次点「保存至新增出入库」→ 收集 + 渲染 ionConfirmPanel
   真正写 sheet3 由 ionConfirmOk 完成（点确认写入按钮触发） */
function ionOnOk(){
  if(state._ionStep==='confirm'){
    return ionConfirmOk();
  }
  var d=ionCollect();
  if(!d) return;
  state._ionDraft=d;
  ionShowConfirm(d);
  state._ionStep='confirm';
  /* 隐藏主按钮组，显示确认态按钮组 */
  var btnSave=document.querySelector('[data-act="ionSave"]');
  if(btnSave) btnSave.style.display='none';
  /* 关键提示：「已记录数据，请点底部'确认写入 V9.1 sheet3'」—— 解决「点了第一次以为写入成功」造成的"有时写有时没写"感知 bug */
  toast('✅ 已记录 '+d.sheets.length+' 条预通知数据。\n请滚动到底部，点「确认写入 V9.1 sheet3」才真正入库');
  return;
}

/* 预通知：渲染确认页（项目号 + 本表备注 + 产品明细 + 底部按钮） */
function ionShowConfirm(d){
  var body=document.getElementById('ionForm_body');
  if(!body) return false;
  /* 在 ionForm_body 后插入/更新 ionConfirmPanel（独立 div，不替换 body 内的输入） */
  var panel=document.getElementById('ionConfirmPanel');
  if(!panel){
    panel=document.createElement('div');
    panel.id='ionConfirmPanel';
    panel.style.marginTop='14px';
    body.parentNode.insertBefore(panel, body.nextSibling);
  }
  function row(k,v,cls){

  var _s0=getSess();

/* 写入执行：渲染写入中面板 → 批量推送 → 渲染结果面板（succeededN/totalN 跨轮累计） */
function _ionWrite(sheets, wr, ts, totalN, doneN){
  var done=doneN||0;
  var panel=document.getElementById('ionConfirmPanel');
  if(panel){
    panel.innerHTML='<div style="padding:24px 16px;text-align:center;background:var(--w1);border:1.5px solid var(--ac-l);border-radius:14px">'

      +'<div style="font-size:16px;font-weight:800;color:#9A6B00;margin-top:6px">正在写入 V9.1 多维表格…</div>'
      +'<div style="font-size:12.5px;color:var(--t3);margin-top:6px;line-height:1.7">本批 '+sheets.length+' 条'+(done?('（此前已成功 '+done+' 条）'):'')+'<br>'+(sheets.length>1?'已一次性提交给服务器逐条写入':'')+'，请稍候，<b>不要关闭本窗口</b></div>'
      +'</div>';
    panel.scrollIntoView({behavior:'smooth', block:'center'});
  }
  v9ioPushBatch(sheets,wr).then(function(rs){
    state._ionLastWriteTs=null;
    /* 更新待同步区：本批 ts 全部剔除，失败的再放回去 */
    var remaining=getV9ioPending().filter(function(p){return p.ts!==ts;});
    if(rs.fail.length) remaining=remaining.concat(rs.fail.map(function(x){return x.sheet;}));
    setV9ioPending(remaining);
    _ionWriteResult(rs, sheets, wr, ts, totalN, done);
    render();
  }).catch(function(err){
    state._ionLastWriteTs=null;
    var msg=String(err&&err.message||err);
    _ionWriteResult({ok:false,succ:[],fail:sheets.map(function(s){return {sheet:s,err:msg};})}, sheets, wr, ts, totalN, done);
    render();
  });
}

/* v48：写入自检 —— 一步步测「手机→服务器」「服务器→金山」「登录身份」，结果直接显示在面板上 */
function ionDiag(tid){
  var wr=getV9ioWebhook();
  var panel=document.getElementById('ionConfirmPanel');
  var tgt=tid?document.getElementById(tid):null;
  if(!wr||!wr.url){ toast('未配置服务器地址，请先登录'); return; }
  var s=getSess()||{};
  var base=wr.url.replace(/\/$/,'');
  var lines=['<b>版本</b> '+APP_VER,
             '<b>地址</b> '+esc(wr.url),
             '<b>账号</b> '+esc(s.u||'未登录')+' · '+(s.stok?'<b style="color:#1F7A41">会话有效</b>':'<b style="color:#C0392B">无会话（会被拒）</b>')];
  function show(loading){
    if(tgt){ tgt.innerHTML=lines.join('<br>'); return; }
    if(!panel) return;
    panel.innerHTML='<div style="padding:20px 14px;background:var(--w1);border:1.5px solid var(--ac-l);border-radius:14px">'
      +'<div style="font-size:22px">🔍</div>'
      +'<div style="font-size:15px;font-weight:800;margin-top:6px">自检结果</div>'
      +'<div style="font-size:12.5px;color:var(--t3);margin-top:8px;line-height:1.9;text-align:left">'+lines.join('<br>')+'</div>'
      +'<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
      +(loading?'<span style="font-size:12px;color:var(--t3)">测试中…</span>'
              :'<button type="button" class="btn" data-act="ionCloseWrite" style="min-width:110px">关闭</button>'
               +'<button type="button" class="btn p" data-act="ionRetryWrite" style="min-width:150px">🔁 重试写入</button>')
      +'</div></div>';
  }
  if(tgt) tgt.innerHTML='⏳ 测试中…'; else show(true);
  var t0=Date.now();
  fetch(base+'/api/health',{headers:_ioAuthHeaders(false)}).then(function(r){
    lines.push((r.status===200?'✅':'❌')+' <b>手机→服务器</b> HTTP '+r.status+'（'+(Date.now()-t0)+'ms）');
    /* v48：蒙广妹手机发现第一次 fetch 后立即第二次 fetch 报 "Failed to fetch"（CF tunnel 连接复用导致服务端 close）。
       加 250ms 间隔强制浏览器开新连接。*/
    return new Promise(function(rs){setTimeout(function(){rs(fetch(base+'/api/io-probe',{headers:_ioAuthHeaders(true)}))},250);});
  }).then(function(r2){
    return r2.json().then(function(j){return {st:r2.status, j:j};});
  }).then(function(o){
    var j=o.j||{};
    if(o.st===401) lines.push('❌ <b>登录身份</b>：服务端拒绝（401）—— 退出重新登录再写');
    else if(o.st!==200) lines.push('❌ 自检接口 HTTP '+o.st+' '+esc(String(j.error||'')));
    else{
      var k=j.kdocs||{};
      lines.push((k.ok?'✅':'❌')+' <b>服务器→金山</b>'+(k.ok?'正常':'异常 '+esc(k.err||''))+'（'+(k.ms||0)+'ms）');
      lines.push((j.me&&j.me.user?'✅':'❌')+' <b>服务端身份</b>：'+esc((j.me&&j.me.user)||'未识别')+' / '+esc((j.me&&j.me.role)||'-'));
    }
    try{ _clog('diag',lines.join(' | '),{st:o.st,j:j}); }catch(_){}
    show(false);
  }).catch(function(e){
    lines.push('❌ <b>自检失败</b>：'+esc(String(e&&e.message||e))+'（多为手机连不上服务器）');
    try{ _clog('diag-ex',String(e&&e.message||e),{}); }catch(_){}
    show(false);
  });
}

/* 预通知：渲染到 canvas（生成可下载/可复制的图片） */
function ionRenderCanvas(){
  var d=ionCollect();
  if(!d){ return null; }
  var cv=document.getElementById('ion_canvas');
  if(!cv) return null;
  // 提前获取 ctx：fitRows（动态行高测量）在下面就要用 ctx.measureText，必须在 ctx 定义后再调用
  var ctx=cv.getContext('2d');
  // 移动端画布：宽度按内容定（WeChat 适合 ~720px 宽），用 2x DPR 出清晰图
  var dpr=window.devicePixelRatio||1;
  var W=720, pad=24, titleH=72;
  var dirLabel=d.dir==='in'?'入库通知':'出库通知';
  // 方向主色
  var dirColor=d.dir==='in'?'#2EA85A':'#FF6B35';
  var dirColorDeep=d.dir==='in'?'#1F7A41':'#D44B17';
  var dirBgLight=d.dir==='in'?'#E8F7EE':'#FFEFD7';
  var dirBgRow1='#FFFFFF';
  var dirBgRow2='#FAF6EE';
  // ===== 列定义：每列 x/宽/对齐方式（表头与数据共享同一组 cols → 纵向中轴线绝对重合） =====
  // cardX 必须在 cols 之前声明（修复 var 提升导致 cols.x 全为 NaN 的 bug：复制图片表格画不出）
  var cardX=pad;
  // 5 列总宽 96+248+76+96+78=594，加左右各 12px 内边距 = 618, W=720 留 24px 外边距
  // 仓库 居中 / 产品 左对齐（完整显示不够就换行） / 规格居中 / 日期居中 / 数量居中
  var cols=[
    {k:'仓库',     x:cardX+12,  w:96,  align:'center'},
    {k:'产品',     x:cardX+114, w:248, align:'left'},
    {k:'规格/体积',x:cardX+368, w:76,  align:'center'},
    {k:'日期',     x:cardX+450, w:96,  align:'center'},
    {k:'数量',     x:cardX+552, w:78,  align:'center'}
  ];
  // 行高：根据产品名换行行数动态算（产品列最多 3 行：每行 13px → 18px 行距 → 30px；单行 24px；多行 +N*16）
  function fitRows(rows){
    var totalH=0;
    rows.forEach(function(r){
      if(!(+r.qty>0)) return;
      var lines=wrapText(ctx, String(r.product||'—'), cols[1].x, 0, cols[1].w-4, 14, 13).length;
      var h=Math.max(42, 18 + lines*18);
      totalH+=h;
    });
    return totalH;
  }
  var dynRowsH=fitRows(d.rows);
  // 总高度重新计算
  var rowH=42; // 最小行高，动态扩
  var infoRows=4 + (d.drv?1:0) + (d.note?1:0);
  var H=titleH + 22 + infoRows*30 + 16 + 28 + 28 + dynRowsH + 50 + 30;
  H=Math.max(460, H);
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx=cv.getContext('2d'); // 设尺寸后 context 状态被重置，重新取同一 context 对象
  ctx.scale(dpr,dpr);

  ctx.fillStyle='#FBF6EB'; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(bandX+30, bandY+bandH/2, 16, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFFFFF';
  ctx.font='700 18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='left';
  ctx.fillText('📦', bandX+22, bandY+bandH/2+5);
  // 标题文字
  ctx.fillStyle='#FFFFFF';
  ctx.font='700 19px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('出入库预通知 · '+dirLabel, bandX+50, bandY+24);
  ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText('武汉联博光电 · 出入库预通知', bandX+50, bandY+44);
  // 右上时间戳
  ctx.fillStyle='#FFFFFF';
  ctx.font='600 12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='right';
  ctx.fillText('生成于 '+nowTime(), bandX+bandW-16, bandY+24);
  ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText(today(), bandX+bandW-16, bandY+44);
  ctx.textAlign='left';

  // ===== 信息卡片区 =====
  var cardY=bandY+bandH+18, cardW=W-pad*2;
  var y=cardY;
  function kv(k,v,color,big){
    // 左侧小标签
    ctx.fillStyle='#9A8B70'; ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(k, cardX+10, y+6);
    // 分隔小竖线
    ctx.fillStyle='#E8D9BE';
    ctx.fillRect(cardX+80, y-8, 1, 18);
    // 值
    ctx.fillStyle=color||'#222'; ctx.font=(big?'700 ':'600 ')+(big?'15':'14')+'px "PingFang SC","Microsoft YaHei",sans-serif';
    var tx=cardX+92;
    var txt=String(v==null||v===''?'—':v);
    var maxW=cardW-92-10;
    // v52：超宽自动换行（司机信息、备注等长文本不再被切掉）
    if(ctx.measureText(txt).width>maxW){
      var lines=[];
      var cur='';
      for(var i=0;i<txt.length;i++){
        var ch=txt[i];
        var test=cur+ch;
        if(ctx.measureText(test).width>maxW && cur.length>0){
          lines.push(cur); cur=ch;
        }else{ cur=test; }
      }
      if(cur) lines.push(cur);
      ctx.fillText(lines[0], tx, y+6);
      for(var li=1;li<lines.length;li++){
        y+=18;
        ctx.fillText(lines[li], tx, y+6);
      }
    }else{
      ctx.fillText(txt, tx, y+6);
    }
    // 行底细线
    ctx.strokeStyle='#F0E5D0'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(cardX+8, y+14); ctx.lineTo(cardX+cardW-8, y+14); ctx.stroke();
    y+=30;
  }
  kv('项目号', d.pid, dirColorDeep, true);
  kv('采购合同号', d.buy);
  kv('销售合同号', d.sale);
  kv('销售下家', d.customers.join('、'));
  // 司机信息（v53：去掉"司机："前缀，辉哥 9/9 反馈）
  var drvTxt=d.drv||'';
  kv('司机信息', drvTxt);
  // 备注
  if(d.note){ kv('备注', d.note); }

  // ===== 明细表 =====
  // 表区大标题
  ctx.fillStyle=dirColorDeep;
  ctx.font='700 14px "PingFang SC","Microsoft YaHei",sans-serif';
  var tblTitle=d.dir==='in'?'入库明细':'出库明细';
  ctx.fillText('▼ '+tblTitle, cardX, y+12);
  // 标题右侧小标签（总数量汇总）
  var totalQty=0; d.rows.forEach(function(r){var q=+r.qty||0; if(q>0) totalQty+=q;});
  if(totalQty>0){
    ctx.fillStyle='#999'; ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='right';
    ctx.fillText('共 '+totalQty+' '+ (d.dir==='in'?'入库':'出库'), cardX+cardW, y+12);
    ctx.textAlign='left';
  }
  y+=22;
  // 表头底色
  var thY=y, thH=28;
  ctx.fillStyle=dirBgLight;
  roundRect(ctx, cardX, thY, cardW, thH, 6);
  ctx.fill();
  ctx.fillStyle=dirColorDeep;
  ctx.font='700 12px "PingFang SC","Microsoft YaHei",sans-serif';
  // 画表头（按 col.align 居中/左对齐 → 表头与数据列中心线绝对重合）
  /* 表头 baseline：thH=28, 12px 字 → baseline = thY + (28-12)/2 + 12*0.85 ≈ thY+22 */
  cols.forEach(function(c){
    drawColText(ctx, c.k, c, thY + 18, dirColorDeep, '700 12px "PingFang SC","Microsoft YaHei",sans-serif');
  });
  y=thY+thH+4;
  // 数据行
  var rowIdx=0;
  d.rows.forEach(function(r){
    var hasQty=!!(+r.qty>0);
    if(!hasQty) return;
    // 产品列换行 → 算出本行实际行高
    var prodTxt=String(r.product||'—');
    var prodLines=ctx.measureText(prodTxt).width>cols[1].w-4
      ? (function(){
          // 模拟换行（不实际绘制，复用 wrapText 逻辑）
          var chars=prodTxt.split(''); var lines=[]; var line='';
          for(var i=0;i<chars.length;i++){
            var test=line+chars[i];
            if(ctx.measureText(test).width>cols[1].w-4 && line.length>0){ lines.push(line); line=chars[i]; }
            else line=test;
          }
          if(line) lines.push(line);
          return lines;
        })()
      : [prodTxt];
    var thisRowH=Math.max(42, 18 + prodLines.length*18);
    // 行底色（斑马纹）
    var bg=rowIdx%2===0?dirBgRow1:dirBgRow2;
    ctx.fillStyle=bg;
    ctx.fillRect(cardX, y, cardW, thisRowH-2);
    // 仓库
    /* 13px 字 baseline 偏移 ≈ fontSize*0.85 = 11px */
    var _txtBy = y + Math.floor(thisRowH/2) + 11;
    drawColText(ctx, r.wh, cols[0], _txtBy, '#222', '600 13px "PingFang SC","Microsoft YaHei",sans-serif');
    // 产品（多行 → 用 wrapText 实际绘制）
    /* 产品 col 垂直中线对齐：起点 = y + (thisRowH - 行数*lineHeight)/2 + 8 */
    /* 产品 col：单行 baseline = rowCenter + 11；多行 = rowCenter + 11 - (lines-1)*9 */
    var _prodStartY = y + Math.floor(thisRowH/2) + 11 - (prodLines.length - 1) * 9;
    if(_prodStartY < y+8) _prodStartY = y+8;
    var _drawLines=wrapText(ctx, prodTxt, cols[1].x, _prodStartY, cols[1].w-4, 18, 13);
    // 规格/体积
    drawColText(ctx, r.vol, cols[2], _txtBy, '#777', '12px "PingFang SC","Microsoft YaHei",sans-serif');
    // 日期
    drawColText(ctx, r.date, cols[3], _txtBy, '#555', '12px "PingFang SC","Microsoft YaHei",sans-serif');
    // 数量（大字号醒目）
    /* 数量列 17px 字 baseline 偏移比 13px 字大 4px */
    /* 17px 字 baseline 偏移 ≈ fontSize*0.85 = 14px */
    var _qtyBy = y + Math.floor(thisRowH/2) + 14;
    drawColText(ctx, String(r.qty), cols[4], _qtyBy, dirColor, '800 17px "PingFang SC","Microsoft YaHei",sans-serif');
    // 行右侧小圆点
    ctx.fillStyle=dirColor; ctx.font='14px sans-serif';
    ctx.textAlign='right';
    ctx.fillText('●', cardX+cardW-8, y+25);
    ctx.textAlign='left';
    y+=thisRowH;
    rowIdx++;
  });
  // 表格外框
  ctx.strokeStyle='#E8D9BE'; ctx.lineWidth=0.5;
  roundRect(ctx, cardX, thY, cardW, y-thY, 8);
  ctx.stroke();
  y+=8;

  // ===== 底部 =====
  // 装饰线
  ctx.strokeStyle='#E8D9BE'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(cardX, y+12); ctx.lineTo(cardX+cardW, y+12); ctx.stroke();
  // 底部信息
  y+=30;
  ctx.fillStyle='#888'; ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('⚠ 出入库预通知 · 生成后请人工核对再操作', cardX, y);
  ctx.textAlign='right';
  ctx.fillStyle=dirColor; ctx.font='600 11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('武汉联博光电科技有限公司', cardX+cardW, y);
  ctx.textAlign='left';
  // 输出 dataURL
  return cv.toDataURL('image/png');
}

/* canvas 工具：圆角矩形路径 */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
/* canvas 文本按列宽换行（中文按字符切，英文按空格）→ 返回行数组 */
function wrapText(ctx, text, x, y, maxWidth, lineHeight, fontSize){
  if(!text) return [''];
  text=String(text);
  // 中文/无空格文本：按字符切
  var chars=text.split('');
  var lines=[]; var line='';
  for(var i=0;i<chars.length;i++){
    var test=line+chars[i];
    if(ctx.measureText(test).width>maxWidth && line.length>0){
      lines.push(line); line=chars[i];
    } else { line=test; }
  }
  if(line) lines.push(line);
  // 渲染
  for(var j=0;j<lines.length;j++) ctx.fillText(lines[j], x, y + j*lineHeight);
  return lines;
}
/* 按列对齐方式在 col 中心点画文字 */
function drawColText(ctx, text, col, y, color, font){
  ctx.fillStyle=color; ctx.font=font;
  var txt=String(text==null||text===''?'—':text);
  var tw=ctx.measureText(txt).width;
  var drawX;
  if(col.align==='center') drawX=col.x + (col.w-tw)/2;
  else if(col.align==='right') drawX=col.x + col.w - tw;
  else drawX=col.x;
  ctx.fillText(txt, drawX, y);
}
